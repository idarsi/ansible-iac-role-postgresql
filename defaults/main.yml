---
###############################################################################
#
# DEFAULT CONFIGURATION FOR THE ROLE
#
# Warning! Do not edit this file but set configuration in inventory,
# playbook or as commandline parameter with ansible-playbook command
#
###############################################################################

###############################################################################
# ENVIRONMENT CONFIGURATION
###############################################################################

http_proxy: ""
https_proxy: ""
no_proxy: ""

###############################################################################
# SUPPORTED TARGET OPERATING SYSTEMS
###############################################################################

iac_supported_os:
  - { name: "Rocky", versions: ["8", "9", "10"] }
  - { name: "RedHat", versions: ["8", "9", "10"] }
  - { name: "Fedora", versions: ["43", "44"] }

###############################################################################
# DNF CONFIGURATION
###############################################################################

dnf_sslverify: true
dnf_validate_certs: true
dnf_disable_gpg_check: false
dnf_update_cache: true
pg_disable_postgresql_module: true
pg_repo_network_retries: 3
pg_repo_network_delay: 5
pg_el8_dnf_interpreter: "/usr/libexec/platform-python"
# Keep the target's SSH runtime packages in the same transaction as role-managed
# package updates so OpenSSH cannot be left linked against an older OpenSSL ABI.
pg_update_transport_packages:
  - "openssh"
  - "openssh-clients"
  - "openssh-server"
  - "openssl"
  - "openssl-libs"

pg_dnf_repo_path: "/etc/yum.repos.d/pgdg-redhat-all.repo"

###############################################################################
# TIMESCALEDB COMMUNITY REPOSITORY
###############################################################################

pg_timescaledb_repo_file: "/etc/yum.repos.d/timescale_timescaledb.repo"
pg_timescaledb_repo_id: "timescale_timescaledb"
pg_timescaledb_repo_name: "TimescaleDB Community repository"
pg_timescaledb_repo_baseurl: "https://packagecloud.io/timescale/timescaledb/el/$releasever/$basearch"
pg_timescaledb_repo_gpgkey: "https://packagecloud.io/timescale/timescaledb/gpgkey"
pg_timescaledb_repo_metadata_expire: "300"

###############################################################################
# ANSIBLE LOG
###############################################################################

iac_service_name: "postgresql"
iac_ansible_report: true
iac_ansible_report_tasks_path: "/root/ansible-report-tasks.log"

###############################################################################
# INSTALLATION
###############################################################################

# Directory where package creates postgres user home directory
pg_default_dir: "/var/lib/pgsql"

# Directory where you want to physical install your postgres user home directory
pg_real_dir: "{{ pg_default_dir }}"

# Directory where you want to bind your postgres user home directory (usually to default dir)
pg_bind_dir: "{{ pg_default_dir }}"

pg_systemd_service_dir: "/usr/lib/systemd/system"
pg_log_directory: "/var/log/pgsql"
pg_cleanup_marker_filename: ".ansible-iac-role-postgresql-managed"
pg_managed_packages_file: "/var/lib/ansible-iac-role-postgresql/managed-packages"

# Do not change os user
pg_os_user: "postgres"
pg_os_group: "postgres"

###############################################################################
# CERTIFICATE
###############################################################################

pg_certificate_private_key_path: "postgresql.key"
pg_certificate_private_key_bits: 3072
pg_certificate_public_key_path: "postgresql.crt"
pg_certificate_public_key_days: 3650
pg_certificate_subject_alt_names:
  - "localhost"
pg_certificate_ssl_min_protocol_version: "tlsv1.3"
pg_client_certificate_authority_path: "client-root-ca.crt"

###############################################################################
# CONNECTIONS AND AUTHENTICATION
###############################################################################

pg_default_port: 5432
pg_default_max_connections: 100

pg_lang: "fi"
pg_locale: "FI"
pg_encoding: "UTF-8"
pg_timezone: "Europe/Helsinki"

pg_lc_ctype: "{{ pg_lang | lower }}_{{ pg_locale | upper }}.{{ pg_encoding | upper }}"
pg_lc_collate: "{{ pg_lang | lower }}_{{ pg_locale | upper }}.{{ pg_encoding | upper }}"

###############################################################################
# EXTENSIONS
###############################################################################

pg_shared_preload_libraries: []

###############################################################################
# REPLICATION
###############################################################################

pg_replication_wal_level: "replica"
pg_replication_max_wal_senders: 10
pg_replication_max_replication_slots: 10
pg_replication_wal_keep_size: "1GB"
pg_replication_hba_type: "hostssl"
pg_replication_hba_method: "scram-sha-256"
pg_replication_reinitialize: false
pg_replication_sslrootcert_content: ""

###############################################################################
# CLUSTERING
###############################################################################

pg_patroni_package: "patroni"
pg_patroni_etcd_package: "patroni-etcd"
pg_etcd_package: "etcd"
pg_etcd_config_directory: "/etc/etcd"
pg_etcd_config_file: "/etc/etcd/etcd.conf"
pg_etcd_data_directory: "/var/lib/etcd/data"
pg_etcd_data_directory_root: "/var/lib/etcd"
pg_etcd_metadata_directory: "/var/lib/etcd/.idarsi-managed"
pg_etcd_data_directory_marker: "managed-etcd"
# Required for managed etcd; define per host in inventory/host_vars.
pg_etcd_bind_address: ""
pg_etcd_initial_cluster_state: "new"
# External etcd TLS material is immutable.  When TLS is externally supplied,
# inventory must name a pre-existing shared group containing both service
# accounts; the role only verifies that contract.
pg_etcd_external_tls_access_group: ""
pg_patroni_additional_packages: []
pg_patroni_python_packages: []
pg_patroni_python_interpreter: "{{ pg_package_module_interpreter | default('/usr/bin/python3') }}"
# Replication's descriptor-safe helper and Molecule target use one interpreter
# contract. The wrapper supplies REPLICATION_PYTHON_COMMAND from the shared
# testing venv; direct Ansible runs fall back to the controller interpreter.
pg_replication_python_executable: >-
  {{ lookup('env', 'REPLICATION_PYTHON_COMMAND') | default(ansible_playbook_python, true) }}
pg_patroni_reinitialize: false
pg_patroni_config_directory: "/etc/patroni"
pg_patroni_user: "postgres"
pg_patroni_group: "postgres"
pg_patroni_restapi_port: 8008
# Advertise each member through its inventory-resolved address by default.  An
# explicit pg_patroni_restapi_endpoint_fallback_address overrides this
# member-derived value; both paths are normalized into the same endpoint model.
# The listener remains loopback-only unless explicitly overridden below.
# Keep the unauthenticated HTTP exception strictly local.  A routable REST
# endpoint must opt into TLS (and retain the required authentication mapping).
pg_patroni_restapi_listen_address: "127.0.0.1"
pg_patroni_readiness_retries: 60
pg_patroni_readiness_delay: 2
pg_cluster_certificate_key_bits: 3072
pg_cluster_certificate_days: 3650
pg_cluster_certificate_seed_directory: "/var/lib/postgresql-pki-seed"
pg_replication_sslmode: "verify-full"
# All CA files supplied as controller-side sources use this single policy:
# root-owned regular non-symlink files, owner-readable, and no group/other
# write permission.  Keep this expression aligned with the runtime checks.
pg_secure_source_mode_regex: "^0?[4-7][0145][0145]$"
# Instance-less Patroni clusters use this explicit default for HBA validation.
# Clusters with instances derive the profile from those instances.
pg_patroni_default_security_profile: "safe"
# Standby replication requires an explicitly supplied CA (content or source).
pg_replication_sslrootcert: ""
pg_git_cleanup_marker_filename: ".ansible-iac-role-postgresql-git-managed"
