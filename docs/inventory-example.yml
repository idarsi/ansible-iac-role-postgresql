---
postgres_primary:
  hosts:
    pg-primary.example.net:
  vars:
    iac_blueprint:
      postgresql:
        - version: 17
          instances:
            - name: "main"
              security_profile: "safe"
              roles:
                - name: "app_user"
                  password: "{{ vault_postgresql_app_password }}"
                  login: true
              databases:
                - name: "appdb"
                  owner: "app_user"

postgres_secondary:
  hosts:
    pg-standby.example.net:
  vars:
    iac_blueprint:
      postgresql:
        - version: 17
          instances:
            - name: "main"
              replication:
                role: "standby"
                primary_host: "192.0.2.10"
                primary_port: 5432
                replication_user: "replicator"
                replication_password: >-
                  {{ vault_postgresql_replication_password }}
                application_name: "pg-standby-1"

# Put the referenced variables in an encrypted Ansible Vault file. See
# docs/inventory/ for standalone, replication, and Patroni/etcd examples.
