---
- name: "Render Patroni configuration from a shared cluster blueprint"
  hosts: all
  become: false
  vars:
    state: clusters_present
    pg_patroni_package: bash
    pg_patroni_etcd_package: bash
    pg_patroni_user: root
    pg_patroni_group: root
    pg_patroni_config_directory: /tmp/patroni
    pg_systemd_service_dir: /tmp/systemd
    pg_patroni_restapi_listen_address: "0.0.0.0"
    iac_blueprint:
      postgresql:
        - version: 17
          clusters:
            - name: molecule-cluster
              provider: patroni
              dcs:
                provider: etcd3
                endpoints:
                  - https://etcd01.example.org:2379
                  - https://etcd02.example.org:2379
              patroni:
                ttl: 30
                loop_wait: 10
                retry_timeout: 10
                restapi:
                  port: 18008
                  authentication:
                    username: patroni
                    password: patroni_password
                  cafile: /etc/patroni/pki/ca.crt
                  certfile: /etc/patroni/pki/server.crt
                  keyfile: /etc/patroni/pki/server.key
                  verify_client: optional
              members:
                - host: instance-idarsi-patroni
                  instance: main
                  name: molecule-member
          instances:
            - name: main
              cluster: molecule-cluster
              configuration:
                port: 15432
  tasks:
    - name: "Include PostgreSQL role"
      ansible.builtin.include_role:
        name: ansible-iac-role-postgresql

    - name: "Snapshot managed Patroni files before check mode"
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop:
        - /tmp/patroni/17-main.yml
        - /tmp/systemd/patroni-17-main.service
      register: patroni_files_before_check

    - name: "Predict PostgreSQL role changes in check mode"
      block:
        - name: "Run PostgreSQL role in check mode"
          ansible.builtin.include_role:
            name: ansible-iac-role-postgresql
          register: patroni_check_mode
      check_mode: true
      diff: true

    - name: "Assert converged Patroni role predicts no changes"
      ansible.builtin.assert:
        that:
          - not (patroni_check_mode.changed | default(false))
        fail_msg: "Check mode predicted changes after Patroni configuration converged."
        success_msg: "Check mode predicted no changes after Patroni configuration converged."

    - name: "Snapshot managed Patroni files after check mode"
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop:
        - /tmp/patroni/17-main.yml
        - /tmp/systemd/patroni-17-main.service
      register: patroni_files_after_check

    - name: "Assert check mode did not mutate managed Patroni files"
      ansible.builtin.assert:
        that:
          - patroni_files_before_check.results | map(attribute='stat.checksum') | list == patroni_files_after_check.results | map(attribute='stat.checksum') | list
          - patroni_files_before_check.results | map(attribute='stat.mode') | list == patroni_files_after_check.results | map(attribute='stat.mode') | list
          - patroni_files_before_check.results | map(attribute='stat.uid') | list == patroni_files_after_check.results | map(attribute='stat.uid') | list
          - patroni_files_before_check.results | map(attribute='stat.gid') | list == patroni_files_after_check.results | map(attribute='stat.gid') | list
        fail_msg: "Check mode mutated a managed Patroni configuration or service file."
        success_msg: "Check mode left managed Patroni files unchanged."
