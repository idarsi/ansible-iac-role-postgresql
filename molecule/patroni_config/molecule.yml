---
dependency:
  name: galaxy

driver:
  name: podman

platforms:
  - name: instance-idarsi-patroni
    image: docker.io/rockylinux/rockylinux:9-ubi-init
    dockerfile: Dockerfile.j2
    command: /sbin/init
    privileged: true
    pre_build_image: false
    systemd: "true"
    tty: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  inventory:
    host_vars:
      instance-idarsi-patroni:
        ansible_connection: "containers.podman.podman"
        ansible_user: "root"
        ansible_become_method: "su"
  env:
    ANSIBLE_REMOTE_TMP: "/tmp"
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
