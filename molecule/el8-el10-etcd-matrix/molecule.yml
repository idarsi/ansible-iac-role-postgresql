---
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - name: etcd-el8
    image: docker.io/rockylinux/rockylinux:8-ubi-init
    command: /sbin/init
    privileged: true
    pre_build_image: false
    network: molecule-etcd-el-matrix
    systemd: "true"
    tty: true
    volumes: [/sys/fs/cgroup:/sys/fs/cgroup:rw]
  - name: etcd-el10
    image: quay.io/rockylinux/rockylinux:10-ubi-init
    command: /sbin/init
    privileged: true
    pre_build_image: false
    network: molecule-etcd-el-matrix
    systemd: "true"
    tty: true
    volumes: [/sys/fs/cgroup:/sys/fs/cgroup:rw]
provisioner:
  name: ansible
  env:
    ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
    ANSIBLE_ASYNC_DIR: "${MOLECULE_PROJECT_DIRECTORY}/.ansible_async"
    ANSIBLE_LOCAL_TEMP: "/tmp/.ansible/tmp"
    ANSIBLE_REMOTE_TMP: "/tmp"
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  inventory:
    host_vars:
      etcd-el8:
        ansible_python_interpreter: /usr/bin/python3.9
      etcd-el10:
        ansible_python_interpreter: /usr/bin/python3
scenario:
  test_sequence: [dependency, destroy, syntax, create, prepare, converge, verify, destroy]
verifier:
  name: ansible
