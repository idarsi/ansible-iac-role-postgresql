---
- name: "Prepare local etcd TLS certificates"
  hosts: all
  become: false
  tasks:
    - name: "Create the etcd PKI directory"
      ansible.builtin.file:
        path: /etc/etcd/pki
        state: directory
        mode: "0755"

    - name: "Generate a local etcd certificate"
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -x509
          - -nodes
          - -newkey
          - rsa:2048
          - -keyout
          - /etc/etcd/pki/etcd-client.key
          - -out
          - /etc/etcd/pki/etcd-client.crt
          - -days
          - "1"
          - -subj
          - "/CN={{ inventory_hostname }}"
          - -addext
          - "subjectAltName=DNS:{{ inventory_hostname }}"
      args:
        creates: /etc/etcd/pki/etcd-client.crt

    - name: "Use the local certificate as the test CA"
      ansible.builtin.copy:
        remote_src: true
        src: /etc/etcd/pki/etcd-client.crt
        dest: /etc/etcd/pki/ca.crt
        mode: "0644"

    - name: "Install the local etcd peer private key"
      ansible.builtin.copy:
        remote_src: true
        src: /etc/etcd/pki/etcd-client.key
        dest: /etc/etcd/pki/etcd-peer.key
        mode: "0644"

    - name: "Make the test private key readable by etcd"
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0644"
      loop:
        - /etc/etcd/pki/etcd-client.key
        - /etc/etcd/pki/etcd-peer.key
