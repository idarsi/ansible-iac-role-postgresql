---
dependency:
  name: galaxy

driver:
  name: podman

platforms:
  - name: etcd01
    image: docker.io/rockylinux/rockylinux:9-ubi-init
    command: /sbin/init
    privileged: true
    pre_build_image: true
    network: molecule-etcd-tls-cluster
    systemd: "true"
    tty: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: etcd02
    image: docker.io/rockylinux/rockylinux:9-ubi-init
    command: /sbin/init
    privileged: true
    pre_build_image: true
    network: molecule-etcd-tls-cluster
    systemd: "true"
    tty: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: etcd03
    image: docker.io/rockylinux/rockylinux:9-ubi-init
    command: /sbin/init
    privileged: true
    pre_build_image: true
    network: molecule-etcd-tls-cluster
    systemd: "true"
    tty: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        # Set this explicitly from the controller runtime.  Target containers
        # do not reliably have the podman CLI or host SELinux view.
        pg_tls_host_runtime_rootless_podman: >-
          {{ lookup('ansible.builtin.env', 'MOLECULE_HOST_RUNTIME_ROOTLESS_PODMAN', default='unknown') }}
  env:
    ANSIBLE_REMOTE_TMP: "/tmp"
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy

verifier:
  name: ansible
