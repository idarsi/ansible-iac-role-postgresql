---
- name: "Install the managed three-member TLS etcd cluster"
  hosts: all
  become: false
  vars:
    ansible_become_method: "su"
    state: install
    pg_patroni_restapi_listen_address: "127.0.0.1"
    pg_lang: "en"
    pg_locale: "US"
    pg_disable_postgresql_module: false
    pg_patroni_reinitialize: true
    iac_blueprint:
      postgresql:
        - version: 17
          clusters:
            - name: molecule-etcd-tls-cluster
              provider: patroni
              dcs:
                provider: etcd3
                endpoints:
                  - https://etcd01:2379
                  - https://etcd02:2379
                  - https://etcd03:2379
                proxy: https://etcd01:2379
                etcd:
                  enabled: true
                  initial_cluster_token: molecule-etcd-tls-cluster
                  members:
                    - {name: etcd01, host: etcd01, peer_url: https://etcd01:2380, client_url: https://etcd01:2379}
                    - {name: etcd02, host: etcd02, peer_url: https://etcd02:2380, client_url: https://etcd02:2379}
                    - {name: etcd03, host: etcd03, peer_url: https://etcd03:2380, client_url: https://etcd03:2379}
                  tls:
                    enabled: true
                    auto_generate: true
              patroni:
                ttl: 30
                loop_wait: 5
                retry_timeout: 5
                postgresql:
                  superuser_password: postgres_password
                  replication_username: replicator
                replication_password: replication_password
                restapi:
                  auto_generate: true
                  verify_client: optional
                  port: 8008
                  connect_address: "127.0.0.1:8008"
                  authentication:
                    username: patroni
                    password: patroni_password
              members:
                - {host: etcd01, instance: main, name: molecule-etcd-tls-cluster-etcd01}
                - {host: etcd02, instance: main, name: molecule-etcd-tls-cluster-etcd02}
                - {host: etcd03, instance: main, name: molecule-etcd-tls-cluster-etcd03}
          instances:
            - name: main
              cluster: molecule-etcd-tls-cluster
              configuration: {listen_addresses: "*", port: 5432, max_connections: 50}
        - version: 18
          instances:
            - name: main18
              configuration: {listen_addresses: "*", port: 5433, max_connections: 50}
  pre_tasks:
    - name: "Require an explicit controller-side Podman runtime classification"
      ansible.builtin.assert:
        that:
          - pg_tls_host_runtime_rootless_podman | string | lower in ['true', 'false']
        fail_msg: >-
          Set MOLECULE_HOST_RUNTIME_ROOTLESS_PODMAN to true or false on the
          Molecule controller; unknown runtime classification is not accepted.

    - name: "Checking for an active SELinux policy required by managed TLS"
      ansible.builtin.command: "{{ item }}"
      loop:
        - "getenforce"
        - "restorecon -V"
      register: pg_tls_selinux_checks
      changed_when: false
      failed_when: false

    - name: "Determine whether SELinux capability is available"
      ansible.builtin.set_fact:
        pg_tls_selinux_supported: >-
           {{ pg_tls_selinux_checks.results | map(attribute='rc') | list == [0, 0]
              and pg_tls_selinux_checks.results[0].stdout | trim in ['Enforcing', 'Permissive'] }}

    - name: "Determine whether this is explicitly unsupported rootless Podman"
      ansible.builtin.set_fact:
        pg_tls_rootless_podman: >-
          {{ (pg_tls_host_runtime_rootless_podman | string | lower) == 'true' }}

    - name: "Skip only unsupported rootless Podman without SELinux capability"
      ansible.builtin.debug:
        msg: "Skipping managed TLS coverage: explicitly detected rootless Podman lacks SELinux policy/tooling"
      when: pg_tls_rootless_podman and not pg_tls_selinux_supported

    - name: "End only explicitly unsupported rootless Podman scenario"
      ansible.builtin.meta: end_play
      when: pg_tls_rootless_podman and not pg_tls_selinux_supported

    - name: "Require SELinux capability on non-rootless hosts"
      ansible.builtin.assert:
        that:
          - pg_tls_host_runtime_rootless_podman | string | lower != 'unknown'
          - pg_tls_selinux_supported
        fail_msg: "TLS coverage requires SELinux policy with getenforce and restorecon on non-rootless hosts"

    - name: "Discover the local container IPv4 address"
      ansible.builtin.command:
        argv:
          - "{{ ansible_facts['python']['executable'] }}"
          - "-c"
          - >-
            import socket; print(socket.getaddrinfo("{{ inventory_hostname }}", None,
            socket.AF_INET)[0][4][0])
      register: pg_etcd_local_address
      changed_when: false

    - name: "Set the explicit etcd bind address for the test host"
      ansible.builtin.set_fact:
        pg_etcd_bind_address: "{{ pg_etcd_local_address.stdout_lines[0].split()[0] }}"
  roles:
    - role: ansible-iac-role-postgresql
