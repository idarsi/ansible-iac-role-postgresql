              roles:
                - name: app_user
                  password: app_password
              databases:
                - name: appdb17
                  owner: app_user
                  access:
                    - name: app_user
                      address: 10.0.0.1/32
                      type: hostssl
                      method: cert
                      clientname: CN
                      map: missing_map
              configuration:
                port: 5417
  tasks:
    - name: "Running PostgreSQL role expecting undefined map failure"
      block:
        - name: "Applying PostgreSQL role with undefined map reference"
          ansible.builtin.include_role:
            name: ansible-iac-role-postgresql
      rescue:
        - name: "Checking undefined map failure message"
          ansible.builtin.assert:
            that:
              - ansible_failed_result is defined
              - >-
                (ansible_failed_result | to_nice_json)
                is search("references undefined map 'missing_map'")
