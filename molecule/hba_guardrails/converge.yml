    pg_locale: "US"
    pg_disable_postgresql_module: false
    ansible_become_method: su
    iac_blueprint:
      postgresql:
        - version: 17
          instances:
            - name: main
              security_profile: safe
              client_certificate_authority_content: |
                -----BEGIN CERTIFICATE-----
                MIIBhTCCASugAwIBAgIUe5yM0r9V4l6R4QwW0kY2pQ0Jk0AwCgYIKoZIzj0EAwIw
