              patroni: {restapi: {port: 8021, listen: "127.0.0.1:8021", connect_address: "127.0.0.1:8021", authentication: {username: patroni, password: password}}}
              members: [{host: instance-idarsi-validation, instance: main, name: member}]
            - name: etcd-disabled
              provider: patroni
              dcs:
                provider: etcd3
                endpoints:
                  - "http://etcd.example.org:2379"
                etcd: {enabled: false}
              patroni: {restapi: {port: 8022, listen: "127.0.0.1:8022", connect_address: "127.0.0.1:8022", authentication: {username: patroni, password: password}}}
