- name: "Reject a standby that preloads TimescaleDB without package metadata"
  hosts: all
  become: false
  vars:
    state: validate
    iac_blueprint:
      postgresql:
        - version: 17
          instances:
            - name: standby
              replication:
                role: standby
                primary_host: primary.example.org
                primary_port: 5432
                replication_user: replicator
                replication_password: changeme
              configuration:
                shared_preload_libraries: "timescaledb"
  tasks:
    - name: "Running validation expecting missing TimescaleDB metadata failure"
      block:
        - name: "Applying invalid standby TimescaleDB configuration"
          ansible.builtin.include_role:
            name: ansible-iac-role-postgresql
        - name: "Failing if missing TimescaleDB metadata was accepted"
          ansible.builtin.fail:
            msg: "Standby TimescaleDB metadata omission was accepted"
      rescue:
        - name: "Checking missing TimescaleDB metadata failure message"
          ansible.builtin.assert:
            that:
              - ansible_failed_result is defined
              - >-
                (ansible_failed_result | to_nice_json)
                is search("Standby instances that preload TimescaleDB")
        - name: "Writing missing TimescaleDB metadata marker"
          ansible.builtin.copy:
            dest: /tmp/postgresql-validation-standby-timescaledb.ok
            content: "ok\n"
            mode: "0644"

- name: "Reject a missing PostgreSQL blueprint"
  hosts: all
  become: false
  vars:
    state: validate
  tasks:
    - name: "Running validation expecting a missing blueprint failure"
      block:
        - name: "Applying a role invocation without a blueprint"
          ansible.builtin.include_role:
            name: ansible-iac-role-postgresql
        - name: "Failing if a missing blueprint was accepted"
          ansible.builtin.fail:
            msg: "A missing PostgreSQL blueprint was accepted"
      rescue:
        - name: "Checking missing blueprint failure message"
          ansible.builtin.assert:
            that:
              - ansible_failed_result is defined
              - >-
                (ansible_failed_result | to_nice_json)
                is search("iac_blueprint or iac_blueprint.postgresql is not defined")
        - name: "Writing missing blueprint marker"
          ansible.builtin.copy:
            dest: /tmp/postgresql-validation-missing-blueprint.ok
            content: "ok\n"
            mode: "0644"
