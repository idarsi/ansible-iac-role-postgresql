      instance-idarsi-etcd: "{{ iac_validation_system_ca }}"
    iac_blueprint:
      postgresql:
        - version: 17
          instances:
            - name: host-specific-replication-ca
              replication:
                role: standby
                primary_host: primary.example.org
                primary_port: 5432
