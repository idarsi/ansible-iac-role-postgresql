- name: "Reject a malformed DCS proxy"
  hosts: instance-idarsi-validation
  become: false
  vars:
    state: validate
    iac_blueprint:
      postgresql:
        - version: 17
          clusters:
            - name: malformed-dcs-proxy
              provider: patroni
              dcs:
                provider: etcd3
                endpoints: ["http://dcs.example.org:2379"]
                proxy: "https://2001:db8::20:2379"
              patroni: {restapi: {authentication: {username: patroni, password: password}}}
              members: [{host: instance-idarsi-validation, instance: main, name: member}]
          instances: [{name: main, cluster: malformed-dcs-proxy}]
  tasks:
    - name: "Checking malformed proxy is rejected"
      block:
        - name: "Applying malformed DCS proxy"
          ansible.builtin.include_role: {name: ansible-iac-role-postgresql}
        - name: "Failing if malformed DCS proxy was accepted"
          ansible.builtin.fail: {msg: "Malformed DCS proxy was accepted"}
      rescue:
        - name: "Checking malformed DCS proxy failure"
          ansible.builtin.assert:
            that:
              - ansible_failed_result is defined
              - >-
                'DCS proxy must be a host:port endpoint' in
                (ansible_failed_result | to_nice_json)

