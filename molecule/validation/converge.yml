                sslrootcert_src: "{{ iac_validation_ca_by_host[inventory_hostname] }}"
                primary_certificate_subject_alt_names: [primary.example.org]
  tasks:
    - name: "Running per-host replication CA source validation"
      ansible.builtin.include_role:
        name: ansible-iac-role-postgresql
    - name: "Checking this host validated only its own replication CA source"
      ansible.builtin.assert:
        that:
          - pg_validation_controller_ca_sources == [iac_validation_ca_by_host[inventory_hostname]]
          - pg_validation_controller_ca_source_stats.results | length == 1
          - pg_validation_controller_ca_source_stats.results[0].pg_validation_controller_ca_source == iac_validation_ca_by_host[inventory_hostname]
          - pg_validation_controller_ca_source_stats.results[0].stat.uid == 0
        fail_msg: "Controller validation did not isolate this host's replication CA source"

- name: "Validate a regular controller-side CA source without target mutation"
  hosts: instance-idarsi-validation
  become: false
  vars:
    state: "validate"
    ansible_become_method: "su"
    iac_validation_regular_ca_source: "{{ lookup('ansible.builtin.pipe', 'readlink -f /etc/ssl/certs/ca-certificates.crt') }}"
    iac_validation_regular_ca_target: "/var/lib/pgsql/17/validation-regular-ca.crt"
    iac_validation_regular_ca_content: |-
      -----BEGIN CERTIFICATE-----
      VALIDATION-FAKE-PEM-SENTINEL
      -----END CERTIFICATE-----
    iac_blueprint:
      postgresql:
        - version: 17
          instances:
            - name: regular-controller-ca
              client_certificate_authority_src: "{{ iac_validation_regular_ca_source }}"
  tasks:
    - name: "Create a known target file for controller validation immutability test"
      become: true
      block:
        - name: "Create target parent for controller validation immutability test"
          ansible.builtin.file:
            path: "{{ iac_validation_regular_ca_target | dirname }}"
            state: "directory"
            owner: "root"
            group: "root"
            mode: "0755"
        - name: "Seed known fake PEM target content"
          ansible.builtin.copy:
            content: "{{ iac_validation_regular_ca_content }}"
            dest: "{{ iac_validation_regular_ca_target }}"
            owner: "root"
            group: "root"
            mode: "0640"

    - name: "Snapshot target before regular controller CA validation"
      ansible.builtin.stat:
        path: "{{ iac_validation_regular_ca_target }}"
        follow: false
      register: iac_validation_regular_ca_target_before

    - name: "Read target content before regular controller CA validation"
      become: true
      ansible.builtin.slurp:
        src: "{{ iac_validation_regular_ca_target }}"
      register: iac_validation_regular_ca_target_content_before

    - name: "Validate regular controller CA source"
      ansible.builtin.include_role:
        name: ansible-iac-role-postgresql
      no_log: true

    - name: "Snapshot target after regular controller CA validation"
      ansible.builtin.stat:
        path: "{{ iac_validation_regular_ca_target }}"
        follow: false
      register: iac_validation_regular_ca_target_after

    - name: "Read target content after regular controller CA validation"
      become: true
      ansible.builtin.slurp:
        src: "{{ iac_validation_regular_ca_target }}"
      register: iac_validation_regular_ca_target_content_after

    - name: "Assert regular CA metadata passed without target mutation or content logging"
      ansible.builtin.assert:
        that:
          - pg_validation_controller_ca_sources == [iac_validation_regular_ca_source]
          - pg_validation_controller_ca_source_stats.results | length == 1
          - pg_validation_controller_ca_source_stats.results[0].stat.isreg
          - not (pg_validation_controller_ca_source_stats.results[0].stat.islnk | default(false))
          - pg_validation_controller_ca_source_stats.results[0].stat.uid == 0
          - iac_validation_regular_ca_target_before.stat.checksum == iac_validation_regular_ca_target_after.stat.checksum
          - iac_validation_regular_ca_target_before.stat == iac_validation_regular_ca_target_after.stat
          - (iac_validation_regular_ca_target_content_before.content | b64decode) == iac_validation_regular_ca_content
          - (iac_validation_regular_ca_target_content_after.content | b64decode) == iac_validation_regular_ca_content
          - iac_validation_regular_ca_target_content_before.content == iac_validation_regular_ca_target_content_after.content
        fail_msg: "Regular controller CA validation mutated target content or metadata"

