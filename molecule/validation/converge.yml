          ansible.builtin.fail:
            msg: "Unsafe PostgreSQL instance name was accepted"
      rescue:
        - name: "Checking unsafe instance name failure"
          ansible.builtin.assert:
            that:
              - ansible_failed_result is defined
              - >-
                (ansible_failed_result | to_nice_json)
                is search("PostgreSQL instance names may contain only")
        - name: "Writing instance name validation marker"
          ansible.builtin.copy:
            dest: /tmp/postgresql-validation-instance-name.ok
            content: "ok\n"
            mode: "0644"

