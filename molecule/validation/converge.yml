---
- name: "Validate a valid PostgreSQL blueprint"
  hosts: instance-idarsi-validation
  become: false
  vars:
    state: validate
    pg_etcd_bind_address: "192.0.2.10"
    pg_patroni_restapi_endpoint_fallback_address: "patroni-validation.example.org"
    iac_blueprint:
      postgresql:
        - version: 16
          instances:
            - name: apache
              databases:
                - name: metrics
                  extensions:
                    - name: timescaledb
        - version: 17
          post_install:
            jobs:
              - database: metrics
                sql: "CREATE TABLE IF NOT EXISTS validation_marker (id integer);"
          clusters:
            - name: validation-cluster
              provider: patroni
              dcs:
                provider: etcd3
                endpoints:
                  - "https://instance-idarsi-etcd:2379"
                etcd:
                  enabled: true
                  initial_cluster_token: validation-dcs
                  tls:
                    enabled: true
                    auto_generate: true
                    client:
                      ca_file: "/etc/etcd/pki/client-ca.crt"
                    peer:
                      ca_file: "/etc/etcd/pki/peer-ca.crt"
                  members:
                    - name: etcd01
                      host: instance-idarsi-etcd
                      peer_url: "https://instance-idarsi-etcd:2380"
                      client_url: "https://instance-idarsi-etcd:2379"
              patroni:
                ttl: 30
                loop_wait: 10
                retry_timeout: 10
                pg_hba:
                  - "local all postgres peer"
                  - "hostssl all all 192.0.2.0/24 scram-sha-256"
                  - "hostssl all all 2001:db8::/64 scram-sha-256"
                  - "hostssl all all samehost scram-sha-256"
                  - "hostssl all all samenet scram-sha-256"
                restapi:
                  listen: "[2001:db8::1]:8008"
                  port: 8008
                  auto_generate: true
                  verify_client: "optional"
                  authentication:
                    username: patroni
                    password: patroni_password
              members:
                - host: instance-idarsi-validation
                  instance: community
                  name: validation-member
          instances:
            - name: community
              cluster: validation-cluster
              databases:
                - name: metrics
                  extensions:
                    - name: timescaledb
                      source: community
                    - name: pgcrypto
  tasks:
    - name: "Running validation for a valid blueprint"
      ansible.builtin.include_role:
        name: ansible-iac-role-postgresql

    - name: "Checking generated TLS uses the canonical custom fallback"
      ansible.builtin.assert:
        that:
          - >-
            (pg_validation_patroni_endpoint_index
             | selectattr('key', 'equalto', '17:validation-cluster:instance-idarsi-validation:community')
             | first).advertised_connect == "https://patroni-validation.example.org:8008"
        fail_msg: >-
          Auto-generated Patroni TLS must use the canonical custom REST
          connect endpoint in validation and readiness models

    - name: "Checking bracketed IPv6 Patroni listen normalization"
      ansible.builtin.assert:
        that:
          - pg_patroni_restapi_listen_host == "2001:db8::1"
          - pg_patroni_restapi_listen_port == 8008
          - "pg_patroni_restapi_listen_model.scheme_free_endpoint == '[2001:db8::1]:8008'"
          - pg_patroni_restapi_listen_model.rendered_endpoint == "[2001:db8::1]:8008"
          - pg_patroni_restapi_listen_model.uri == "https://[2001:db8::1]:8008"
          - >-
            (pg_validation_patroni_endpoint_index
             | selectattr('key', 'equalto', '17:validation-cluster:instance-idarsi-validation:community')
             | first).listen == "[2001:db8::1]:8008"
          - pg_patroni_restapi_listen_model.san_identities == ["2001:db8::1"]
          - pg_patroni_restapi_listen_model.rendered_endpoint is not search('\s')
          - pg_patroni_restapi_listen_model.uri is not search('\s')
          - pg_patroni_restapi_listen_model.san_identities | select('search', '\s') | list | length == 0
        fail_msg: >-
           Bracketed IPv6 Patroni listen endpoint was not normalized and rendered
           correctly

    - name: "Checking divergent generated etcd CA destinations are normalized"
      ansible.builtin.assert:
        that:
          - pg_validation_etcd_members | length == 1
          - pg_validation_etcd_members[0].name == "etcd01"
          - pg_validation_etcd_tls_effective.client.ca_file == "/etc/etcd/pki/client-ca.crt"
          - pg_validation_etcd_tls_effective.peer.ca_file == "/etc/etcd/pki/peer-ca.crt"
          - pg_validation_etcd_members_normalized[0].host == "instance-idarsi-etcd"
          - pg_validation_etcd_members_normalized[0].peer_url == "https://instance-idarsi-etcd:2380"
          - pg_validation_etcd_members_normalized[0].client_url == "https://instance-idarsi-etcd:2379"
        fail_msg: "Divergent generated etcd client and peer CA destinations were not preserved"

    - name: "Checking exact HTTPS DNS endpoint rendering"
      ansible.builtin.assert:
        that:
          - pg_dcs_endpoint_model[0].rendered_endpoint == "https://instance-idarsi-etcd:2379"
          - pg_dcs_endpoint_model[0].uri == "https://instance-idarsi-etcd:2379"
          - pg_dcs_endpoint_model[0].scheme_free_endpoint == "instance-idarsi-etcd:2379"
          - pg_dcs_endpoint_model[0].san_identities == ["instance-idarsi-etcd"]
          - pg_dcs_endpoint_model[0].canonical_host == "instance-idarsi-etcd"
          - pg_dcs_endpoint_model[0].path == ""
          - pg_dcs_endpoint_model[0].port is integer
          - pg_dcs_endpoint_model[0].rendered_endpoint is not search('\s')
          - pg_dcs_endpoint_model[0].uri is not search('\s')
        fail_msg: "HTTPS DNS endpoint rendering was not exact and whitespace-free"

- name: "Exercise endpoint normalization helper contracts"
  hosts: all
  become: false
  tasks:
    - name: "Normalize valid endpoint contract"
      ansible.builtin.include_tasks: ../../tasks/validate/test_endpoint_contract.yml
      loop:
        - {input: "192.0.2.1:443", default_scheme: "http", scheme: "http", host: "192.0.2.1", canonical: "192.0.2.1", has_scheme: false}
        - {input: "http://Example.Org.:80", default_scheme: "https", scheme: "http", host: "Example.Org.", canonical: "example.org", has_scheme: true}
        - {input: "https://example.org:443/", default_scheme: "http", scheme: "https", host: "example.org", canonical: "example.org", has_scheme: true}
        - {input: "[2001:0db8:0:0::1]:8443", default_scheme: "http", scheme: "http", host: "2001:0db8:0:0::1", canonical: "2001:db8::1", has_scheme: false}
        - {input: "https://[2001:0db8::2]:8443", default_scheme: "http", scheme: "https", host: "2001:0db8::2", canonical: "2001:db8::2", has_scheme: true}
      loop_control:
        loop_var: pg_endpoint_contract

    - name: "Construct valid host and port helper contracts"
      ansible.builtin.include_tasks: ../../tasks/validate/test_host_port_contract.yml
      loop:
        - {host: "192.0.2.1", port: 443, expected: "192.0.2.1:443"}
        - {host: "example.org", port: 80, expected: "example.org:80"}
        - {host: "2001:db8::1", port: 443, expected: "[2001:db8::1]:443"}
        - {host: "[2001:db8::2]", port: 8443, expected: "[2001:db8::2]:8443"}
      loop_control:
        loop_var: pg_host_port_contract

    - name: "Reject invalid host and port helper contracts"
      ansible.builtin.include_tasks: ../../tasks/validate/test_host_port_invalid_contract.yml
      loop:
        - {host: "[example.org]", port: 443}
        - {host: "[2001:db8::1", port: 443}
        - {host: "2001:db8::1", port: "443"}
        - {host: "example.org", port: 0}
        - {host: "example.org", port: 65536}
      loop_control:
        loop_var: pg_host_port_invalid_contract

- name: "Reject invalid structured HBA without mutation"
  hosts: instance-idarsi-validation
  become: false
  vars:
    state: "validate"
    pg_validation_expected_collision_message: "Patroni listen endpoint collision"
    iac_blueprint:
      postgresql:
        - version: 17
          instances:
            - name: invalid-hba
              global_access:
                - name: invalid-host
                  type: "host"
                  method: "scram-sha-256"
  tasks:
    - name: "Checking invalid structured HBA fails before state changes"
      block:
        - name: "Applying invalid structured HBA blueprint"
          ansible.builtin.include_role:
            name: ansible-iac-role-postgresql
        - name: "Failing if invalid structured HBA was accepted"
          ansible.builtin.fail:
            msg: "Invalid structured HBA was accepted"
      rescue:
        - name: "Checking structured HBA failure message"
          ansible.builtin.assert:
            that:
              - ansible_failed_result is defined
              - >-
                (ansible_failed_result | to_nice_json)
                is search("invalid address usage for type 'host'")
            fail_msg: "Expected structured HBA validation failure was not raised"

- name: "Validate an HTTPS IPv4 DCS proxy"
  hosts: instance-idarsi-validation
  become: false
  vars:
    state: validate
    iac_blueprint:
      postgresql:
        - version: 17
          clusters:
            - name: https-ipv4-proxy
              provider: patroni
              dcs:
                provider: etcd3
                endpoints: ["https://dcs.example.org:2379"]
                proxy: "https://192.0.2.20:2379"
                etcd: {tls: {enabled: true}}
              patroni:
                restapi:
                  listen: "127.0.0.1:8008"
                  connect_address: "127.0.0.1:8008"
                  authentication: {username: patroni, password: password}
              members: [{host: instance-idarsi-validation, instance: main, name: member}]
          instances: [{name: main, cluster: https-ipv4-proxy}]
  tasks:
    - name: "Running IPv4 proxy validation"
      ansible.builtin.include_role: {name: ansible-iac-role-postgresql}
    - name: "Checking normalized IPv4 proxy model"
      ansible.builtin.assert:
        that:
          - pg_dcs_proxy_model.host == "192.0.2.20"
          - pg_dcs_proxy_model.san_identities == ["192.0.2.20"]
          - pg_dcs_proxy_model.port == 2379
          - pg_dcs_proxy_model.scheme == "https"
          - pg_dcs_proxy_model.rendered_endpoint == "https://192.0.2.20:2379"
          - pg_dcs_proxy_model.uri == "https://192.0.2.20:2379"
          - pg_dcs_proxy_model.scheme_free_endpoint == "192.0.2.20:2379"
          - pg_dcs_proxy_model.rendered_host == "192.0.2.20"
          - pg_dcs_proxy_model.uri is not search('\s')

