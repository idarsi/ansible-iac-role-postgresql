- name: "Reject a Patroni cluster without DCS endpoints"
  hosts: all
  become: false
  vars:
    state: validate
    iac_blueprint:
      postgresql:
        - version: 17
          clusters:
            - name: missing-dcs-endpoints
              provider: patroni
              dcs:
                provider: etcd3
                endpoints: []
              patroni: {}
              members:
                - host: instance-idarsi-validation
                  instance: main
                  name: missing-dcs-endpoints-member
          instances:
            - name: main
              cluster: missing-dcs-endpoints
  tasks:
    - name: "Running validation expecting missing DCS endpoints failure"
      block:
        - name: "Applying Patroni configuration without DCS endpoints"
          ansible.builtin.include_role:
