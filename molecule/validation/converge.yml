- name: "Check certificate destination collision contracts"
  hosts: instance-idarsi-validation
  become: false
  tasks:
    - name: "Run certificate path collision fixtures"
      ansible.builtin.include_tasks: ../../tasks/validate/test_certificate_path_contract.yml
      loop:
        - name: "empty path collections"
          generated: []
          managed: []
          ssl_paths: []
          expected_valid: true
        - name: "single-value path collections"
          generated: "/var/lib/postgresql/17/main/ssl/server.key"
          managed: "/var/lib/postgresql/17/main/ssl"
          ssl_paths: "/var/lib/postgresql/17/main/ssl"
          expected_valid: true
        - name: "distinct key certificate and CA paths"
          generated: ["/var/lib/postgresql/17/main/ssl/server.key", "/var/lib/postgresql/17/main/ssl/server.crt", "/var/lib/postgresql/17/main/ssl/client-ca.crt"]
          managed: ["/var/lib/postgresql/17/main/ssl", "/var/lib/postgresql-pki", "/var/lib/postgresql-pki/locks", "/var/lib/postgresql-pki/postgresql-17-main.serials", "/var/lib/postgresql-pki/locks/postgresql-17-main.lock"]
          ssl_paths: ["/", "/var", "/var/lib", "/var/lib/postgresql", "/var/lib/postgresql/17", "/var/lib/postgresql/17/main", "/var/lib/postgresql/17/main/ssl", "/var/lib/postgresql/17/main/ssl/server.key", "/var/lib/postgresql/17/main/ssl/server.crt", "/var/lib/postgresql/17/main/ssl/client-ca.crt"]
          expected_valid: true
        - name: "duplicate generated destination"
          generated: ["/var/lib/postgresql/17/main/ssl/server.key", "/var/lib/postgresql/17/main/ssl/server.key", "/var/lib/postgresql/17/main/ssl/client-ca.crt"]
          managed: ["/var/lib/postgresql/17/main/ssl", "/var/lib/postgresql-pki", "/var/lib/postgresql-pki/locks", "/var/lib/postgresql-pki/postgresql-17-main.serials", "/var/lib/postgresql-pki/locks/postgresql-17-main.lock"]
          ssl_paths: ["/", "/var", "/var/lib", "/var/lib/postgresql", "/var/lib/postgresql/17", "/var/lib/postgresql/17/main", "/var/lib/postgresql/17/main/ssl", "/var/lib/postgresql/17/main/ssl/server.key", "/var/lib/postgresql/17/main/ssl/client-ca.crt"]
          expected_valid: false
        - name: "separator and dot aliases collide"
          generated: ["/var/lib/postgresql/17/main/ssl/server.key", "/var//lib/postgresql/17/./main/ssl/server.key", "/var/lib/postgresql/17/main/ssl/client-ca.crt"]
          managed: ["/var/lib/postgresql/17/main/ssl", "/var/lib/postgresql-pki", "/var/lib/postgresql-pki/locks", "/var/lib/postgresql-pki/postgresql-17-main.serials", "/var/lib/postgresql-pki/locks/postgresql-17-main.lock"]
          ssl_paths: []
          expected_valid: false
        - name: "managed CA collision"
          generated: ["/var/lib/postgresql/17/main/ssl/server.key", "/var/lib/postgresql-pki", "/var/lib/postgresql/17/main/ssl/client-ca.crt"]
          managed: ["/var/lib/postgresql/17/main/ssl", "/var/lib/postgresql-pki", "/var/lib/postgresql-pki/locks"]
          ssl_paths: []
          expected_valid: false
        - name: "lock collision"
          generated: ["/var/lib/postgresql/17/main/ssl/server.key", "/var/lib/postgresql-pki/locks/postgresql-17-main.lock", "/var/lib/postgresql/17/main/ssl/client-ca.crt"]
          managed: ["/var/lib/postgresql/17/main/ssl", "/var/lib/postgresql-pki", "/var/lib/postgresql-pki/locks", "/var/lib/postgresql-pki/postgresql-17-main.serials", "/var/lib/postgresql-pki/locks/postgresql-17-main.lock"]
          ssl_paths: []
          expected_valid: false
        - name: "valid non-colliding generated path"
          generated: ["/var/lib/postgresql/17/main/ssl/server.key", "/var/lib/postgresql/17/main/ssl/server.crt", "/var/lib/postgresql/17/main/ssl/client-ca.crt", "/var/lib/postgresql-pki/other.serials"]
          managed: ["/var/lib/postgresql/17/main/ssl", "/var/lib/postgresql-pki", "/var/lib/postgresql-pki/locks", "/var/lib/postgresql-pki/postgresql-17-main.serials", "/var/lib/postgresql-pki/locks/postgresql-17-main.lock"]
          ssl_paths: []
          expected_valid: true
        - name: "registry collision"
          generated: ["/var/lib/postgresql/17/main/ssl/server.key", "/var/lib/postgresql-pki/postgresql-17-main.serials", "/var/lib/postgresql/17/main/ssl/client-ca.crt"]
          managed: ["/var/lib/postgresql/17/main/ssl", "/var/lib/postgresql-pki", "/var/lib/postgresql-pki/locks", "/var/lib/postgresql-pki/postgresql-17-main.serials", "/var/lib/postgresql-pki/locks/postgresql-17-main.lock"]
          ssl_paths: ["/", "/var", "/var/lib", "/var/lib/postgresql", "/var/lib/postgresql/17", "/var/lib/postgresql/17/main", "/var/lib/postgresql/17/main/ssl", "/var/lib/postgresql/17/main/ssl/server.key", "/var/lib/postgresql-pki/postgresql-17-main.serials", "/var/lib/postgresql/17/main/ssl/client-ca.crt"]
          expected_valid: false
      loop_control:
        loop_var: pg_certificate_path_contract

