          Absent and disabled etcd must use HTTP DCS endpoints without etcd TLS
      vars:
        pg_optional_dcs_model: >-
          {{ pg_dcs_models_by_cluster['17:etcd-optional'] }}
        pg_disabled_dcs_model: >-
          {{ pg_dcs_models_by_cluster['17:etcd-disabled'] }}

