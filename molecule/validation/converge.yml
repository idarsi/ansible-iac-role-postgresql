- name: "Validate two isolated Patroni cluster models"
  hosts: instance-idarsi-validation
  become: false
  vars:
    state: validate
    iac_blueprint:
      postgresql:
        - version: 17
          clusters:
            - name: validation-cluster-a
              provider: patroni
              dcs:
                provider: etcd3
                endpoints: ["http://etcd-a.example.org:2379"]
              patroni:
                restapi:
                  port: 8010
                  listen: "127.0.0.1:8010"
                  connect_address: "127.0.0.1:8010"
                  authentication: {username: "patroni-a", password: "password-a"}
              members: [{host: "instance-idarsi-validation", instance: "cluster-a", name: "member-a"}]
            - name: validation-cluster-b
              provider: patroni
              dcs:
                provider: etcd3
                endpoints: ["http://etcd-b.example.org:3379"]
              patroni:
                restapi:
                  port: 8011
                  listen: "127.0.0.1:8011"
                  connect_address: "127.0.0.1:8011"
                  authentication: {username: "patroni-b", password: "password-b"}
              members: [{host: "instance-idarsi-validation", instance: "cluster-b", name: "member-b"}]
  tasks:
    - name: "Run role validation for two clusters"
      ansible.builtin.include_role:
        name: ansible-iac-role-postgresql
    - name: "Assert normalized DCS endpoint models remain isolated"
      ansible.builtin.assert:
        that:
          - pg_dcs_models_by_cluster['17:validation-cluster-a'].servers[0].host == "etcd-a.example.org"
          - pg_dcs_models_by_cluster['17:validation-cluster-a'].servers[0].port == 2379
          - pg_dcs_models_by_cluster['17:validation-cluster-a'].servers[0].rendered_endpoint == "http://etcd-a.example.org:2379"
          - pg_dcs_models_by_cluster['17:validation-cluster-a'].servers[0].uri == "http://etcd-a.example.org:2379"
          - pg_dcs_models_by_cluster['17:validation-cluster-a'].servers[0].san_identities == ["etcd-a.example.org"]
          - pg_dcs_models_by_cluster['17:validation-cluster-b'].servers[0].host == "etcd-b.example.org"
          - pg_dcs_models_by_cluster['17:validation-cluster-b'].servers[0].port == 3379
          - pg_dcs_models_by_cluster['17:validation-cluster-a'] != pg_dcs_models_by_cluster['17:validation-cluster-b']
        fail_msg: "Normalized endpoint models from separate clusters must not overwrite one another"

    - name: "Check the host-wide Patroni endpoint index for both members"
      ansible.builtin.assert:
        that:
          - pg_validation_patroni_endpoint_index | length == 2
          - >-
            (pg_validation_patroni_endpoint_index
             | selectattr('key', 'equalto', '17:validation-cluster-a:instance-idarsi-validation:cluster-a')
             | first).listen == "127.0.0.1:8010"
          - >-
            (pg_validation_patroni_endpoint_index
             | selectattr('key', 'equalto', '17:validation-cluster-b:instance-idarsi-validation:cluster-b')
             | first).advertised_connect == "http://127.0.0.1:8011"
          - >-
            (pg_validation_patroni_endpoint_index | map(attribute='key') | list | unique | length) == 2
        fail_msg: "Distinct Patroni endpoint models must persist in the host-wide index"

    - name: "Invoke the normalization and index path a second time"
      ansible.builtin.include_tasks: ../../tasks/validate/normalize_patroni_endpoint_index.yml

    - name: "Check readiness lookups resolve both indexed Patroni models"
      ansible.builtin.assert:
        that:
          - >-
            pg_validation_patroni_endpoint_index
            | selectattr('key', 'equalto', '17:validation-cluster-a:instance-idarsi-validation:cluster-a')
            | list | length == 1
          - >-
            pg_validation_patroni_endpoint_index
            | selectattr('key', 'equalto', '17:validation-cluster-b:instance-idarsi-validation:cluster-b')
            | list | length == 1
          - >-
            (pg_validation_patroni_endpoint_index
             | selectattr('key', 'equalto', '17:validation-cluster-a:instance-idarsi-validation:cluster-a')
             | first).advertised_connect !=
            (pg_validation_patroni_endpoint_index
             | selectattr('key', 'equalto', '17:validation-cluster-b:instance-idarsi-validation:cluster-b')
             | first).advertised_connect

- name: "Prove managed etcd member normalization resets between enabled clusters"
  hosts: instance-idarsi-validation
  become: false
  vars:
    state: "validate"
    pg_validation_etcd_clusters:
      - name: normalized-members-a
        enabled: true
        members:
          - name: etcd-a
            host: instance-idarsi-validation
            peer_url: "https://etcd-a.example.org:2380/"
            client_url: "https://etcd-a.example.org:2379/"
      - name: normalized-members-b
        enabled: true
        members:
          - name: etcd-b
            host: instance-idarsi-validation
            peer_url: "https://etcd-b.example.org:3380/"
            client_url: "https://etcd-b.example.org:3379/"
  tasks:
    - name: "Checking isolated normalization fixtures are enabled clusters"
      ansible.builtin.assert:
        that:
          - pg_validation_etcd_clusters | length == 2
          - pg_validation_etcd_clusters | map(attribute='enabled') | list == [true, true]

    - name: "Resetting isolated etcd member normalization"
      ansible.builtin.set_fact:
        pg_validation_etcd_members_normalized: []

    - name: "Normalizing first isolated enabled etcd cluster members"
      ansible.builtin.include_tasks: ../../tasks/validate/normalize_etcd_member.yml
      loop: "{{ pg_validation_etcd_clusters[0].members }}"
      loop_control:
        loop_var: pg_validation_etcd_member

    - name: "Capturing first isolated normalized member list"
      ansible.builtin.set_fact:
        pg_validation_first_etcd_members_normalized: "{{ pg_validation_etcd_members_normalized }}"

    - name: "Resetting normalization before second isolated cluster"
      ansible.builtin.set_fact:
        pg_validation_etcd_members_normalized: []

    - name: "Normalizing second isolated enabled etcd cluster members"
      ansible.builtin.include_tasks: ../../tasks/validate/normalize_etcd_member.yml
      loop: "{{ pg_validation_etcd_clusters[1].members }}"
      loop_control:
        loop_var: pg_validation_etcd_member

    - name: "Checking normalized members do not leak into the second cluster"
      ansible.builtin.assert:
        that:
          - pg_validation_first_etcd_members_normalized[0].name == "etcd-a"
          - pg_validation_first_etcd_members_normalized[0].peer_url == "https://etcd-a.example.org:2380"
          - pg_validation_etcd_members_normalized | length == 1
          - pg_validation_etcd_members_normalized[0].name == "etcd-b"
          - pg_validation_etcd_members_normalized[0].peer_url == "https://etcd-b.example.org:3380"
          - pg_validation_etcd_members_normalized[0].client_url == "https://etcd-b.example.org:3379"
          - pg_validation_etcd_members_normalized | selectattr('name', 'equalto', 'etcd-a') | list | length == 0
        fail_msg: "Managed etcd normalized members leaked between isolated enabled cluster validations"

- name: "Use effective TLS for omitted DCS endpoint and proxy schemes"
  hosts: instance-idarsi-validation
  become: false
  vars:
    state: "validate"
    iac_blueprint:
      postgresql:
        - version: 17
          clusters:
            - name: omitted-tls-on
              provider: patroni
              dcs:
                provider: etcd3
                endpoints: ["etcd-a.example.org:2379"]
                proxy: "proxy.example.org:2379"
                etcd: {tls: {enabled: true}}
              patroni:
                restapi: {port: 8010, listen: "127.0.0.1:8010", connect_address: "127.0.0.1:8010", authentication: {username: "patroni", password: "password"}}
              members: [{host: "instance-idarsi-validation", instance: "tls-on", name: "tls-on-member"}]
            - name: omitted-tls-off
              provider: patroni
              dcs:
                provider: etcd3
                endpoints: ["etcd-b.example.org:2379"]
                proxy: "proxy-b.example.org:2379"
                etcd: {tls: {enabled: false}}
              patroni:
                restapi: {port: 8011, listen: "127.0.0.1:8011", connect_address: "127.0.0.1:8011", authentication: {username: "patroni", password: "password"}}
              members: [{host: "instance-idarsi-validation", instance: "tls-off", name: "tls-off-member"}]
  tasks:
    - ansible.builtin.include_role: {name: ansible-iac-role-postgresql}
    - ansible.builtin.assert:
        that:
          - pg_dcs_models_by_cluster['17:omitted-tls-on'].protocol == "https"
          - pg_dcs_models_by_cluster['17:omitted-tls-on'].servers[0].uri == "https://etcd-a.example.org:2379"
          - pg_dcs_models_by_cluster['17:omitted-tls-on'].proxy.uri == "https://proxy.example.org:2379"
          - pg_dcs_models_by_cluster['17:omitted-tls-off'].protocol == "http"
          - pg_dcs_models_by_cluster['17:omitted-tls-off'].servers[0].uri == "http://etcd-b.example.org:2379"
          - pg_dcs_models_by_cluster['17:omitted-tls-off'].proxy.uri == "http://proxy-b.example.org:2379"

