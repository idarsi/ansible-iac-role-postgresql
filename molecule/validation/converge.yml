---
- name: "Validate a valid PostgreSQL blueprint"
  hosts: all
  become: false
  vars:
    state: validate
    iac_blueprint:
      postgresql:
        - version: 16
          instances:
            - name: apache
              databases:
                - name: metrics
                  extensions:
                    - name: timescaledb
        - version: 17
          clusters:
            - name: validation-cluster
              provider: patroni
              dcs:
                provider: etcd3
                endpoints:
                  - https://etcd01.example.org:2379
                  - https://etcd02.example.org:2379
              patroni:
                ttl: 30
                loop_wait: 10
                retry_timeout: 10
              members:
                - host: instance-idarsi-validation
                  instance: community
                  name: validation-member
          instances:
            - name: community
              cluster: validation-cluster
              databases:
                - name: metrics
                  extensions:
                    - name: timescaledb
                      source: community
                    - name: pgcrypto
  tasks:
    - name: "Running validation for a valid blueprint"
      ansible.builtin.include_role:
        name: ansible-iac-role-postgresql

    - name: "Writing valid blueprint marker"
      ansible.builtin.copy:
        dest: /tmp/postgresql-validation-valid.ok
        content: "ok\n"
        mode: "0644"

- name: "Reject an unsupported TimescaleDB source"
  hosts: all
  become: false
  vars:
    state: validate
    iac_blueprint:
      postgresql:
        - version: 17
          instances:
            - name: main
              databases:
                - name: metrics
                  extensions:
                    - name: timescaledb
                      source: unsupported
  tasks:
    - name: "Running validation expecting an invalid source failure"
      block:
        - name: "Applying invalid TimescaleDB source"
          ansible.builtin.include_role:
            name: ansible-iac-role-postgresql
        - name: "Failing if invalid source was accepted"
          ansible.builtin.fail:
            msg: "Unsupported TimescaleDB source was accepted"
      rescue:
        - name: "Checking invalid source failure message"
          ansible.builtin.assert:
            that:
              - ansible_failed_result is defined
              - >-
                (ansible_failed_result | to_nice_json)
                is search("TimescaleDB source must be either 'pgdg' or 'community'")
        - name: "Writing invalid source marker"
          ansible.builtin.copy:
            dest: /tmp/postgresql-validation-invalid-source.ok
            content: "ok\n"
            mode: "0644"

- name: "Reject invalid Patroni timeout values"
  hosts: all
  become: false
  vars:
    state: validate
    iac_blueprint:
      postgresql:
        - version: 17
          clusters:
            - name: invalid-timeouts
              provider: patroni
              dcs:
                provider: etcd3
                endpoints:
                  - https://etcd01.example.org:2379
              patroni:
                ttl: 20
                loop_wait: 10
                retry_timeout: 10
              members:
                - host: instance-idarsi-validation
                  instance: main
                  name: invalid-timeout-member
          instances:
            - name: main
              cluster: invalid-timeouts
  tasks:
    - name: "Running validation expecting invalid Patroni timeout failure"
      block:
        - name: "Applying invalid Patroni timeout configuration"
          ansible.builtin.include_role:
            name: ansible-iac-role-postgresql
        - name: "Failing if invalid Patroni timeouts were accepted"
          ansible.builtin.fail:
            msg: "Invalid Patroni timeout values were accepted"
      rescue:
        - name: "Checking invalid Patroni timeout failure message"
          ansible.builtin.assert:
            that:
              - ansible_failed_result is defined
              - >-
                (ansible_failed_result | to_nice_json)
                is search('Patroni requires loop_wait')
        - name: "Writing invalid Patroni timeout marker"
          ansible.builtin.copy:
            dest: /tmp/postgresql-validation-patroni-timeout.ok
            content: "ok\n"
            mode: "0644"

- name: "Reject a Patroni instance without a local cluster member"
  hosts: all
  become: false
  vars:
    state: validate
    iac_blueprint:
      postgresql:
        - version: 17
          clusters:
            - name: missing-member
              provider: patroni
              dcs:
                provider: etcd3
                endpoints:
                  - https://etcd01.example.org:2379
              patroni: {}
              members:
                - host: another-host.example.org
                  instance: main
                  name: another-member
          instances:
            - name: main
              cluster: missing-member
  tasks:
    - name: "Running validation expecting missing local member failure"
      block:
        - name: "Applying Patroni configuration without a local member"
          ansible.builtin.include_role:
            name: ansible-iac-role-postgresql
        - name: "Failing if missing local member was accepted"
          ansible.builtin.fail:
            msg: "A Patroni instance without a local member was accepted"
      rescue:
        - name: "Checking missing local member failure message"
          ansible.builtin.assert:
            that:
              - ansible_failed_result is defined
              - >-
                (ansible_failed_result | to_nice_json)
                is search("must reference an existing cluster and have exactly one member")
        - name: "Writing missing local member marker"
          ansible.builtin.copy:
            dest: /tmp/postgresql-validation-patroni-member.ok
            content: "ok\n"
            mode: "0644"

- name: "Reject conflicting TimescaleDB sources for one PostgreSQL version"
  hosts: all
  become: false
  vars:
    state: validate
    iac_blueprint:
      postgresql:
        - version: 17
          instances:
            - name: pgdg
              databases:
                - name: metrics
                  extensions:
                    - name: timescaledb
            - name: community
              databases:
                - name: metrics
                  extensions:
                    - name: timescaledb
                      source: community
  tasks:
    - name: "Running validation expecting a source conflict failure"
      block:
        - name: "Applying conflicting TimescaleDB sources"
          ansible.builtin.include_role:
            name: ansible-iac-role-postgresql
        - name: "Failing if conflicting sources were accepted"
          ansible.builtin.fail:
            msg: "Conflicting TimescaleDB sources were accepted"
      rescue:
        - name: "Checking source conflict failure message"
          ansible.builtin.assert:
            that:
              - ansible_failed_result is defined
              - >-
                (ansible_failed_result | to_nice_json)
                is search("requests multiple TimescaleDB sources")
        - name: "Writing source conflict marker"
          ansible.builtin.copy:
            dest: /tmp/postgresql-validation-source-conflict.ok
            content: "ok\n"
            mode: "0644"

