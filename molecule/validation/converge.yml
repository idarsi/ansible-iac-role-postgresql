- name: "Reject invalid managed etcd member fields independently"
  hosts: instance-idarsi-validation
  become: false
  vars:
    state: "validate"
    pg_etcd_member_cases:
      - name: "missing name"
        member: {host: "instance-idarsi-etcd", peer_url: "https://instance-idarsi-etcd:2380", client_url: "https://instance-idarsi-etcd:2379"}
        expected: "define name as a string"
        # This is the include_tasks wrapper metadata, not a failed task msg.
        forbidden: "One or more items failed"
      - name: "wrong typed name"
        member: {name: 7, host: "instance-idarsi-etcd", peer_url: "https://instance-idarsi-etcd:2380", client_url: "https://instance-idarsi-etcd:2379"}
        expected: "define name as a string"
      - name: "missing host"
        member: {name: "member", peer_url: "https://instance-idarsi-etcd:2380", client_url: "https://instance-idarsi-etcd:2379"}
        expected: "define host as a string"
      - name: "wrong typed host"
        member: {name: "member", host: 7, peer_url: "https://instance-idarsi-etcd:2380", client_url: "https://instance-idarsi-etcd:2379"}
        expected: "define host as a string"
      - name: "missing peer_url"
        member: {name: "member", host: "instance-idarsi-etcd", client_url: "https://instance-idarsi-etcd:2379"}
        expected: "define peer_url as a string"
      - name: "wrong typed peer_url"
        member: {name: "member", host: "instance-idarsi-etcd", peer_url: 7, client_url: "https://instance-idarsi-etcd:2379"}
        expected: "define peer_url as a string"
      - name: "missing client_url"
        member: {name: "member", host: "instance-idarsi-etcd", peer_url: "https://instance-idarsi-etcd:2380"}
        expected: "define client_url as a string"
      - name: "wrong typed client_url"
        member: {name: "member", host: "instance-idarsi-etcd", peer_url: "https://instance-idarsi-etcd:2380", client_url: 7}
        expected: "define client_url as a string"
      - name: "malformed peer_url"
        member:
          name: "member"
          host: "instance-idarsi-etcd"
          peer_url: "https://instance-idarsi-etcd/not-a-port"
          client_url: "https://instance-idarsi-etcd:2379"
        expected: "managed etcd peer_url must be a host:port endpoint"
        expected_exact: >-
          managed etcd peer_url must be a host:port endpoint: use a non-empty
          DNS/IPv4 host:port or bracketed IPv6 [address]:port; unbracketed IPv6,
          missing ports, empty hosts, schemes other than HTTP(S), and malformed
          values are invalid
      - name: "malformed client_url"
        member:
          name: "member"
          host: "instance-idarsi-etcd"
          peer_url: "https://instance-idarsi-etcd:2380"
          client_url: "https://instance-idarsi-etcd:0"
        expected: "managed etcd client_url has an invalid host or port (port must be 1-65535)"
        expected_exact: "managed etcd client_url has an invalid host or port (port must be 1-65535)"
  tasks:
    - name: "Running independent managed etcd member validation cases"
      ansible.builtin.include_tasks: etcd_member_validation_cases.yml
      loop: "{{ pg_etcd_member_cases }}"
      loop_control:
        loop_var: pg_etcd_member_case
      vars:
        iac_blueprint:
          postgresql:
            - version: 17
              clusters:
                - name: "member-validation"
                  provider: "patroni"
                  dcs:
                    provider: "etcd3"
                    endpoints: ["http://etcd.example.org:2379"]
                    etcd:
                      enabled: false
                      members: ["{{ pg_etcd_member_case.member }}"]
                  patroni: {restapi: {authentication: {username: "patroni", password: "password"}}}
                  members: [{host: "instance-idarsi-validation", instance: "main", name: "member"}]
              instances: [{name: "main", cluster: "member-validation"}]

    - name: "Aggregating managed etcd member validation outcomes"
      ansible.builtin.assert:
        that:
          - pg_etcd_member_validation_outcomes | default([]) | length == pg_etcd_member_cases | length
          - >-
            pg_etcd_member_validation_outcomes
            | selectattr('failed', 'equalto', true) | list | length == pg_etcd_member_cases | length
          - >-
            pg_etcd_member_validation_outcomes
            | selectattr('message_matches', 'equalto', true) | list | length == pg_etcd_member_cases | length
          - >-
            pg_etcd_member_validation_outcomes
            | selectattr('exact_message_matches', 'equalto', true) | list | length == pg_etcd_member_cases | length
          - >-
            pg_etcd_member_validation_outcomes
            | selectattr('forbidden_message_matches', 'equalto', true) | list | length == 0
          - >-
            pg_etcd_member_validation_outcomes
            | selectattr('passed', 'equalto', false) | list | length == 0
        fail_msg: >-
          One or more managed etcd member validation cases did not fail with the
          expected message substring: {{ pg_etcd_member_validation_outcomes | default([]) }}

