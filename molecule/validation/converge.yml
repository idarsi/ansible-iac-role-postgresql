        that:
          - >-
            (pg_validation_cluster_models
             | selectattr('key', 'equalto', '17:explicit-routable-restapi')
             | first).record.members[0].host == "instance-idarsi-validation"
          - >-
            (pg_validation_cluster_models
             | selectattr('key', 'equalto', '17:explicit-routable-restapi')
             | first).record.members[0].instance == "main"
          - pg_patroni_restapi_connect_value == "https://patroni.example.org:8013"
          - pg_patroni_restapi_connect_host == "patroni.example.org"
          - pg_patroni_restapi_connect_port == 8013
