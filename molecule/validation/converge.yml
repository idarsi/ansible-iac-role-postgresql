- name: "Accept explicit Patroni REST API IPv6 endpoints"
  hosts: instance-idarsi-validation
  become: false
  vars:
    state: "validate"
    iac_blueprint:
      postgresql:
        - version: 17
          clusters:
            - name: explicit-restapi-ipv6
              provider: patroni
              dcs: {provider: etcd3, endpoints: ["http://etcd01.example.org:2379"]}
              patroni:
                restapi:
                  listen: "[2001:db8::1]:8008"
                  connect_address: "[2001:db8::2]:8008"
                  auto_generate: true
                  authentication: {username: patroni, password: patroni_password}
              members: [{host: instance-idarsi-validation, instance: main, name: member}]
          instances: [{name: main, cluster: explicit-restapi-ipv6}]
  tasks:
    - name: "Validating explicit bracketed IPv6 REST API endpoints"
      ansible.builtin.include_role:
        name: ansible-iac-role-postgresql
    - name: "Checking the canonical cluster model preserves bracketed endpoints"
      ansible.builtin.assert:
        that:
          - >-
            (pg_validation_cluster_models
             | selectattr('key', 'equalto', '17:explicit-restapi-ipv6')
             | first).record.patroni.restapi.listen == "[2001:db8::1]:8008"
          - >-
            (pg_validation_cluster_models
             | selectattr('key', 'equalto', '17:explicit-restapi-ipv6')
             | first).record.patroni.restapi.connect_address == "[2001:db8::2]:8008"
        fail_msg: "Bracketed IPv6 REST API endpoints were not preserved in the canonical model"

