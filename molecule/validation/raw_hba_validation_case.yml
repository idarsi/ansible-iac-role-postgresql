---
- name: "Apply malformed raw HBA address"
  block:
    - name: "Applying malformed raw HBA address {{ pg_invalid_raw_hba_case }}"
      ansible.builtin.include_role:
        name: ansible-iac-role-postgresql
    - name: "Failing if malformed raw HBA address was accepted"
      ansible.builtin.fail:
        msg: "Malformed raw HBA address was accepted"
  rescue:
    - name: "Checking malformed raw HBA address failure"
      ansible.builtin.assert:
        that:
          - ansible_failed_result is defined
          - >-
            (ansible_failed_result | to_nice_json) is search(
            "Raw Patroni pg_hba records must use the supported unquoted grammar")
        fail_msg: "Malformed raw HBA address did not produce the intended validation message"
