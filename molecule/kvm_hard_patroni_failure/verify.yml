---
- name: "Hard Patroni failure smoke test"
  hosts: pg01
  become: true
  tasks:
    - name: "Require SELinux enforcing on every guest"
      ansible.builtin.command: getenforce
      delegate_to: "{{ item }}"
      loop: "{{ groups['all'] }}"
      changed_when: false
      register: kvm_selinux
    - name: "Assert SELinux is enforcing on every guest"
      ansible.builtin.assert:
        that:
          - >-
            kvm_selinux.results | map(attribute='stdout') | map('trim')
            | select('equalto', 'Enforcing') | list | length == 3
    - name: "Discover the actual Patroni leader"
      ansible.builtin.uri:
        url: "http://{{ item }}:8008/cluster"
        url_username: patroni
        url_password: patroni_password
        force_basic_auth: true
        return_content: true
      delegate_to: "{{ item }}"
      loop: [pg01, pg02, pg03]
      register: kvm_before_failure
      failed_when: false
    - name: "Record the actual primary"
      ansible.builtin.set_fact:
        kvm_failed_leader: >-
         {{ (kvm_before_failure.results
         | selectattr('status', 'equalto', 200) | map(attribute='json.members')
         | list | flatten | selectattr('role', 'equalto', 'leader')
         | map(attribute='host') | first) }}
    - name: "Require a discovered Patroni leader"
      ansible.builtin.assert:
        that:
          - kvm_failed_leader in groups['all']
    - name: "Select a surviving Patroni observer"
      ansible.builtin.set_fact:
        kvm_observer: "{{ (groups['all'] | reject('equalto', kvm_failed_leader) | list | first) }}"
    - name: "Create continuity data on the discovered leader"
      ansible.builtin.command: >-
        runuser -u postgres -- psql -v ON_ERROR_STOP=1 -d postgres -c
        "CREATE TABLE IF NOT EXISTS molecule_hard (v text); INSERT INTO
        molecule_hard VALUES ('before')"
      delegate_to: "{{ kvm_failed_leader }}"
      changed_when: true
    - name: "Stop and restore only the selected KVM guest"
      block:
        - name: "Stop the discovered failed leader VM"
          ansible.builtin.command:
            argv:
              - "{{ lookup('env', 'IDARSI_TEST_ENVIRONMENT') }}/scripts/kvm-vm"
              - stop
              - "{{ kvm_failed_leader }}"
          environment:
            MOLECULE_EPHEMERAL_DIRECTORY: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}"
            KVM_LIBVIRT_URI: qemu:///system
          delegate_to: localhost
          become: false
          changed_when: true
        - name: "Wait for failover after host-side stop"
          ansible.builtin.pause:
            seconds: 35
        - name: "Wait for a replacement leader"
          ansible.builtin.uri:
            url: "http://{{ kvm_observer }}:8008/cluster"
            url_username: "patroni"
            url_password: "patroni_password"
            force_basic_auth: true
            return_content: true
          delegate_to: "{{ kvm_observer }}"
          register: kvm_failover
          retries: 30
          delay: 2
          until:
            - kvm_failover.status == 200
            - kvm_failover.json.members | selectattr('role', 'equalto', 'leader') | list | length == 1
            - (kvm_failover.json.members | selectattr('role', 'equalto', 'leader') | map(attribute='host') | first) != kvm_failed_leader
      always:
        - name: "Restart the failed leader VM"
          ansible.builtin.command:
            argv:
              - "{{ lookup('env', 'IDARSI_TEST_ENVIRONMENT') }}/scripts/kvm-vm"
              - start
              - "{{ kvm_failed_leader }}"
          environment:
            MOLECULE_EPHEMERAL_DIRECTORY: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}"
            KVM_LIBVIRT_URI: qemu:///system
          delegate_to: localhost
          become: false
          changed_when: true
        - name: "Wait for the failed leader to accept connections"
          ansible.builtin.wait_for_connection:
            timeout: 300
          delegate_to: "{{ kvm_failed_leader }}"
    - name: "Write and read on the replacement leader"
      ansible.builtin.command: >-
        runuser -u postgres -- psql -v ON_ERROR_STOP=1 -tA -d postgres -c
        "INSERT INTO molecule_hard VALUES ('after'); SELECT v FROM
        molecule_hard WHERE v = 'after'"
      delegate_to: "{{ (kvm_failover.json.members
        | selectattr('role', 'equalto', 'leader') | list | first).host }}"
      register: kvm_replacement_write
      changed_when: true

    - name: "Wait for the failed member to rejoin as a replica"
      ansible.builtin.uri:
        url: "http://{{ kvm_observer }}:8008/cluster"
        url_username: "patroni"
        url_password: "patroni_password"
        force_basic_auth: true
        return_content: true
      delegate_to: "{{ kvm_observer }}"
      register: kvm_rejoined
      retries: 90
      delay: 2
      until:
        - kvm_rejoined.status == 200
        - kvm_rejoined.json.members | length == 3
        - kvm_rejoined.json.members | selectattr('role', 'equalto', 'leader') | list | length == 1
        - kvm_rejoined.json.members | selectattr('role', 'equalto', 'replica') | list | length == 2
        - kvm_rejoined.json.members | selectattr('host', 'equalto', kvm_failed_leader) | selectattr('role', 'equalto', 'replica') | list | length == 1

    - name: "Verify the old primary rejoins with its data"
      ansible.builtin.command: >-
        runuser -u postgres -- psql -tA -d postgres -c
        "SELECT v FROM molecule_hard WHERE v = 'before'"
      delegate_to: "{{ kvm_failed_leader }}"
      register: kvm_rejoined_data
      changed_when: false
      retries: 60
      delay: 3
      until: kvm_rejoined_data.stdout | trim == 'before'

    - name: "Verify the replacement marker synchronizes to the old member"
      ansible.builtin.command: >-
        runuser -u postgres -- psql -tA -d postgres -c
        "SELECT v FROM molecule_hard WHERE v = 'after'"
      delegate_to: "{{ kvm_failed_leader }}"
      register: kvm_rejoined_after_marker
      changed_when: false
      retries: 60
      delay: 3
      until: kvm_rejoined_after_marker.stdout | trim == 'after'
    - name: "Record the replacement leader"
      ansible.builtin.set_fact:
        kvm_replacement_leader: >-
          {{ kvm_failover.json.members | selectattr('role', 'equalto', 'leader')
          | map(attribute='host') | first }}
    - name: "Assert replacement changed leader and accepted a write"
      ansible.builtin.assert:
        that:
          - kvm_replacement_leader != kvm_failed_leader
          - kvm_replacement_write.stdout_lines | select('equalto', 'after') | list | length == 1
          - kvm_rejoined_after_marker.stdout | trim == 'after'
