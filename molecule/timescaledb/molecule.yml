---
dependency:
  name: galaxy

driver:
  name: podman

platforms:
  - name: instance-idarsi-timescaledb-pgdg
    image: docker.io/rockylinux/rockylinux:9-ubi-init
    command: /sbin/init
    privileged: true
    pre_build_image: true
    systemd: true
    tty: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: instance-idarsi-timescaledb-community
    image: docker.io/rockylinux/rockylinux:9-ubi-init
    command: /sbin/init
    privileged: true
    pre_build_image: true
    systemd: true
    tty: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: instance-idarsi-timescaledb-pgdg-rocky10
    image: quay.io/rockylinux/rockylinux:10-ubi-init
    command: /sbin/init
    privileged: true
    pre_build_image: true
    systemd: true
    tty: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: instance-idarsi-timescaledb-community-rocky10
    image: quay.io/rockylinux/rockylinux:10-ubi-init
    command: /sbin/init
    privileged: true
    pre_build_image: true
    systemd: true
    tty: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: instance-idarsi-timescaledb-pgdg-rhel9
    image: registry.access.redhat.com/ubi9-init
    command: /sbin/init
    privileged: true
    pre_build_image: true
    systemd: true
    tty: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: instance-idarsi-timescaledb-community-rhel9
    image: registry.access.redhat.com/ubi9-init
    command: /sbin/init
    privileged: true
    pre_build_image: true
    systemd: true
    tty: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: instance-idarsi-timescaledb-pgdg-rhel10
    image: registry.access.redhat.com/ubi10-init
    command: /sbin/init
    privileged: true
    pre_build_image: true
    systemd: true
    tty: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: instance-idarsi-timescaledb-community-rhel10
    image: registry.access.redhat.com/ubi10-init
    command: /sbin/init
    privileged: true
    pre_build_image: true
    systemd: true
    tty: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  env:
    ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
    ANSIBLE_ASYNC_DIR: "${MOLECULE_PROJECT_DIRECTORY}/.ansible_async"
    ANSIBLE_LOCAL_TEMP: "/tmp/.ansible/tmp"
    ANSIBLE_REMOTE_TMP: "/tmp"
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  inventory:
    host_vars:
      instance-idarsi-timescaledb-pgdg:
        timescaledb_source: pgdg
      instance-idarsi-timescaledb-community:
        timescaledb_source: community
      instance-idarsi-timescaledb-pgdg-rocky10:
        timescaledb_source: pgdg
      instance-idarsi-timescaledb-community-rocky10:
        timescaledb_source: community
      instance-idarsi-timescaledb-pgdg-rhel9:
        timescaledb_source: pgdg
      instance-idarsi-timescaledb-community-rhel9:
        timescaledb_source: community
      instance-idarsi-timescaledb-pgdg-rhel10:
        timescaledb_source: pgdg
      instance-idarsi-timescaledb-community-rhel10:
        timescaledb_source: community

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
