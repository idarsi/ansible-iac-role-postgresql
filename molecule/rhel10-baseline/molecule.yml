---
dependency:
  name: galaxy

driver:
  name: podman

platforms:
  - name: instance-idarsi-rhel10
    image: registry.access.redhat.com/ubi10-init
    command: /sbin/init
    privileged: true
    pre_build_image: true
    systemd: "true"
    tty: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  env:
    ANSIBLE_REMOTE_TMP: "/tmp"
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."

verifier:
  name: ansible
