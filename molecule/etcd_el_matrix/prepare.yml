---
- name: "Bootstrap Python on minimal UBI images"
  hosts: all
  gather_facts: false
  tasks:
    - name: "Install Python 3.9 for Ansible on EL8 UBI"
      ansible.builtin.raw: "dnf -y install python39 python3-dnf"
      when: inventory_hostname == "etcd-el8"
      changed_when: false

    - name: "Install Python and DNF bindings for Ansible on EL10 UBI"
      ansible.builtin.raw: "dnf -y install python3 python3-dnf"
      when: inventory_hostname == "etcd-el10"
      changed_when: false
