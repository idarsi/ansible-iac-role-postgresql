---
- name: "Install managed PGDG etcd on EL8 and EL10"
  hosts: all
  become: false
  vars:
    state: install
    pg_patroni_restapi_listen_address: "0.0.0.0"
    pg_lang: "en"
    pg_locale: "US"
    pg_disable_postgresql_module: true
    pg_patroni_reinitialize: true
    iac_blueprint:
      postgresql:
        - version: 17
          clusters:
            - name: molecule-etcd-el-matrix
              provider: patroni
              dcs:
                provider: etcd3
                endpoints: ["https://{{ inventory_hostname }}:2379"]
                proxy: "https://{{ inventory_hostname }}:2379"
                etcd:
                  enabled: true
                  initial_cluster_token: molecule-etcd-el-matrix
                  members:
                    - {name: "{{ inventory_hostname }}", host: "{{ inventory_hostname }}", peer_url: "https://{{ inventory_hostname }}:2380", client_url: "https://{{ inventory_hostname }}:2379"}
                  tls:
                    enabled: true
                    client: {ca_file: /etc/etcd/pki/ca.crt, cert_file: /etc/etcd/pki/etcd.crt, key_file: /etc/etcd/pki/etcd.key}
                    peer: {ca_file: /etc/etcd/pki/ca.crt, cert_file: /etc/etcd/pki/etcd.crt, key_file: /etc/etcd/pki/etcd.key}
              patroni:
                ttl: 30
                loop_wait: 5
                retry_timeout: 5
                postgresql: {superuser_password: postgres_password, replication_username: replicator}
                replication_password: replication_password
                restapi:
                  port: 8008
                  authentication:
                    username: patroni
                    password: patroni_password
              members:
                - {host: "{{ inventory_hostname }}", instance: main, name: "molecule-etcd-el-matrix-{{ inventory_hostname }}"}
          instances:
            - name: main
              cluster: molecule-etcd-el-matrix
              configuration: {listen_addresses: "*", port: 5432, max_connections: 50}
  pre_tasks:
    - name: "Discover the local container IPv4 address"
      ansible.builtin.command: "getent ahostsv4 {{ inventory_hostname }}"
      register: pg_etcd_local_address
      changed_when: false

    - name: "Set the explicit etcd bind address for the test host"
      ansible.builtin.set_fact:
        pg_etcd_bind_address: "{{ pg_etcd_local_address.stdout_lines[0].split()[0] }}"
  roles:
    - role: ansible-iac-role-postgresql
