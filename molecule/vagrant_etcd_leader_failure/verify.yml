---
- name: "Verify etcd leader failure and rejoin"
  hosts: pg01
  become: true
  tasks:
    - name: "Require SELinux enforcing on every guest"
      ansible.builtin.command: getenforce
      delegate_to: "{{ item }}"
      loop: "{{ groups['all'] }}"
      changed_when: false
      register: vagrant_selinux
    - name: "Assert SELinux is enforcing on every guest"
      ansible.builtin.assert:
        that:
          - >-
            vagrant_selinux.results | map(attribute='stdout') | map('trim')
            | select('equalto', 'Enforcing') | list | length == 3
    - name: "Record a committed key before failure"
      ansible.builtin.command: >-
        etcdctl --endpoints=https://pg01:2379 --cacert=/etc/etcd/pki/ca.crt
        --cert=/etc/etcd/pki/etcd.crt --key=/etc/etcd/pki/etcd.key put
        /molecule/leader-failure before
      environment: {ETCDCTL_API: "3"}
      changed_when: true
    - name: "Find the current etcd leader"
      ansible.builtin.command: >-
        etcdctl --endpoints=https://pg01:2379,https://pg02:2379,https://pg03:2379
        --cacert=/etc/etcd/pki/ca.crt --cert=/etc/etcd/pki/etcd.crt
        --key=/etc/etcd/pki/etcd.key endpoint status -w json
      environment: {ETCDCTL_API: "3"}
      register: vagrant_etcd_status
      changed_when: false
      retries: 30
      delay: 2
      until: >-
        vagrant_etcd_status.rc == 0 and
        (vagrant_etcd_status.stdout | from_json | length) == 3 and
        (vagrant_etcd_status.stdout | from_json | selectattr('Endpoint', 'defined') | list | length) == 3 and
        (vagrant_etcd_status.stdout | from_json | selectattr('Status', 'defined') | list | length) == 3 and
        (vagrant_etcd_status.stdout | from_json | map(attribute='Status') | selectattr('leader', 'defined') | list | length) == 3 and
        (vagrant_etcd_status.stdout | from_json | map(attribute='Status') | map(attribute='header') | selectattr('member_id', 'defined') | list | length) == 3 and
        ((vagrant_etcd_status.stdout | from_json | map(attribute='Status') | map(attribute='leader') | unique | list) | length) == 1
    - name: "Set leader facts"
      ansible.builtin.set_fact:
        vagrant_etcd_leader_id: "{{ (vagrant_etcd_status.stdout | from_json | map(attribute='Status') | map(attribute='leader') | first) }}"
        vagrant_etcd_status_records: "{{ vagrant_etcd_status.stdout | from_json }}"
        vagrant_surviving_etcd_endpoints: >-
          {{ vagrant_etcd_status.stdout | from_json
          | rejectattr('Status.header.member_id', 'equalto', (vagrant_etcd_status.stdout | from_json | map(attribute='Status') | map(attribute='leader') | first))
          | map(attribute='Endpoint') | join(',') }}
        vagrant_failed_etcd_endpoint: >-
          {{ vagrant_etcd_status.stdout | from_json
          | selectattr('Status.header.member_id', 'equalto', (vagrant_etcd_status.stdout | from_json | map(attribute='Status') | map(attribute='leader') | first))
          | map(attribute='Endpoint') | first }}
    - name: "Fail the discovered leader, verify replacement, and always rejoin it"
      block:
        - name: "Stop only the discovered etcd leader"
          ansible.builtin.systemd_service:
            name: "etcd.service"
            state: "stopped"
          delegate_to: >-
            {{ (vagrant_etcd_status_records
            | selectattr('Status.header.member_id', 'equalto', vagrant_etcd_leader_id)
            | map(attribute='Endpoint') | first).split('//')[1].split(':')[0] }}
        - name: "Wait for a different leader and preserved data"
          ansible.builtin.command: >-
            etcdctl --endpoints={{ vagrant_surviving_etcd_endpoints }}
            --cacert=/etc/etcd/pki/ca.crt --cert=/etc/etcd/pki/etcd.crt --key=/etc/etcd/pki/etcd.key
            get /molecule/leader-failure
          environment: {ETCDCTL_API: "3"}
          register: vagrant_after_leader
          changed_when: false
          retries: 60
          delay: 2
          until: vagrant_after_leader.rc == 0 and 'before' in vagrant_after_leader.stdout
        - name: "Confirm the elected leader changed"
          ansible.builtin.command: >-
            etcdctl --endpoints={{ vagrant_surviving_etcd_endpoints }}
            --cacert=/etc/etcd/pki/ca.crt --cert=/etc/etcd/pki/etcd.crt --key=/etc/etcd/pki/etcd.key
            endpoint status -w json
          environment: {ETCDCTL_API: "3"}
          register: vagrant_replacement_status
          changed_when: false
          retries: 30
          delay: 2
          until: >-
            vagrant_replacement_status.rc == 0 and
            (vagrant_replacement_status.stdout | from_json | length) == 2 and
            ((vagrant_replacement_status.stdout | from_json | map(attribute='Status') | map(attribute='leader') | unique | list) | length) == 1 and
            (vagrant_replacement_status.stdout | from_json | map(attribute='Status') | map(attribute='leader') | first) != vagrant_etcd_leader_id
        - name: "Assert a different etcd leader was elected"
          ansible.builtin.assert:
            that:
              - (vagrant_replacement_status.stdout | from_json | length) == 2
              - ((vagrant_replacement_status.stdout | from_json | map(attribute='Status') | map(attribute='leader') | unique | list) | length) == 1
              - (vagrant_replacement_status.stdout | from_json | map(attribute='Status') | map(attribute='leader') | first) != vagrant_etcd_leader_id
      always:
        - name: "Restore the stopped etcd leader"
          ansible.builtin.systemd_service:
            name: "etcd.service"
            state: "started"
          delegate_to: >-
            {{ (vagrant_etcd_status_records
            | selectattr('Status.header.member_id', 'equalto', vagrant_etcd_leader_id)
            | map(attribute='Endpoint') | first).split('//')[1].split(':')[0] }}
        - name: "Verify the exact restored etcd member endpoint is healthy"
          ansible.builtin.command:
            argv:
              - "etcdctl"
              - "--endpoints={{ vagrant_failed_etcd_endpoint }}"
              - "--cacert=/etc/etcd/pki/ca.crt"
              - "--cert=/etc/etcd/pki/etcd.crt"
              - "--key=/etc/etcd/pki/etcd.key"
              - "endpoint"
              - "health"
          environment: {ETCDCTL_API: "3"}
          changed_when: false
          retries: 60
          delay: 2
          until: vagrant_health.rc == 0
          register: vagrant_health
        - name: "Verify the exact restored member rejoined etcd membership"
          ansible.builtin.command:
            argv:
              - "etcdctl"
              - "--endpoints=https://pg01:2379"
              - "--cacert=/etc/etcd/pki/ca.crt"
              - "--cert=/etc/etcd/pki/etcd.crt"
              - "--key=/etc/etcd/pki/etcd.key"
              - "member"
              - "list"
              - "-w"
              - "json"
          environment: {ETCDCTL_API: "3"}
          changed_when: false
          register: vagrant_rejoined_members
          retries: 60
          delay: 2
          until: >-
            vagrant_rejoined_members.rc == 0 and
            (vagrant_rejoined_members.stdout | from_json).members
             | selectattr('ID', 'equalto', vagrant_etcd_leader_id) | list | length == 1
    - name: "Assert the original key remains readable after rejoin"
      ansible.builtin.assert:
        that: "'before' in vagrant_after_leader.stdout"
