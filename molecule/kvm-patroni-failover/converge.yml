---
###############################################################################
#
# converge.yml
#
# @author Arsi Atomi
#
###############################################################################

- name: "Converge the three PostgreSQL members against the external DCS"
  hosts: pg01:pg02:pg03
  become: true
  vars_files:
    - cluster.yml
  vars:
    state: "install"
    pg_patroni_restapi_listen_address: "0.0.0.0"
    pg_lang: "en"
    pg_locale: "US"
    pg_disable_postgresql_module: true
    pg_patroni_package: "patroni"
    pg_patroni_reinitialize: false
  roles:
    - role: ansible-iac-role-postgresql
  tasks:
    - name: "Wait for Patroni readiness before the default idempotence action"
      ansible.builtin.uri:
        url: "http://127.0.0.1:8008/readiness"
        url_username: "patroni"
        url_password: "patroni_password"
        force_basic_auth: true
        status_code: 200
      register: patroni_readiness
      retries: 90
      delay: 2
      until: patroni_readiness.status == 200
