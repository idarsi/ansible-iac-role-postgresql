---
- name: Converge
  hosts: all
  become: false
  vars:
    state: install
    pg_lang: "en"
    pg_locale: "US"
    pg_disable_postgresql_module: false
    ansible_become_method: su
    iac_blueprint:
      postgresql:
        - version: 16
          directories:
            - path: /tmp/pgsql16
              owner: root
              group: root
              mode: "0750"
          files:
            - path: /tmp/pgsql16/example.txt
              content: "molecule\n"
              owner: root
              group: root
              mode: "0640"
          cron:
            - name: pg16_heartbeat
              user: root
              minute: "0"
              hour: "3"
              job: "/bin/true"
              cron_file: pg16_heartbeat
          instances:
            - name: main
              roles:
                - name: app_user
                  password: app_password
                  createdb: false
                - name: app_admin
                  password: admin_password
                  createdb: true
              databases:
                - name: appdb16
                  owner: app_admin
                  extensions:
                    - name: pgcrypto
                  access:
                    - name: app_user
                      address: 10.0.0.1/32
                      type: host
                      method: scram-sha-256
              configuration:
                port: 5416
                max_connections: 50
        - version: 17
          directories:
            - path: /tmp/pgsql17
              owner: root
              group: root
              mode: "0750"
          files:
            - path: /tmp/pgsql17/example.txt
              content: "molecule\n"
              owner: root
              group: root
              mode: "0640"
          git:
            - repo: /tmp/pg-molecule-source
              dest: /var/lib/pgsql/git/pg-molecule-source
              version: main
              update: true
          cron:
            - name: pg17_heartbeat
              user: root
              minute: "0"
              hour: "3"
              job: "/bin/true"
              cron_file: pg17_heartbeat
          instances:
            - name: main
              roles:
                - name: app_user
                  password: app_password
                  createdb: false
                - name: app_admin
                  password: admin_password
                  createdb: true
              databases:
                - name: appdb17
                  owner: app_admin
                  extensions:
                    - name: pgcrypto
                  access:
                    - name: app_user
                      address: 10.0.0.1/32
                      type: host
                      method: scram-sha-256
              configuration_profile: balanced
              configuration:
                port: 5417
                max_connections: 50
        - version: "18"
          directories:
            - path: /tmp/pgsql18
              owner: root
              group: root
              mode: "0750"
          files:
            - path: /tmp/pgsql18/example.txt
              content: "molecule\n"
              owner: root
              group: root
              mode: "0640"
          cron:
            - name: pg18_heartbeat
              user: root
              minute: "0"
              hour: "3"
              job: "/bin/true"
              cron_file: pg18_heartbeat
          instances:
            - name: main
              roles:
                - name: app_user
                  password: app_password
                  createdb: false
                - name: app_admin
                  password: admin_password
                  createdb: true
              databases:
                - name: appdb18
                  owner: app_admin
                  extensions:
                    - name: pgcrypto
                    - name: plpython3u
                  access:
                    - name: app_user
                      address: 10.0.0.1/32
                      type: host
                      method: scram-sha-256
              autotuning_profile: balanced
              configuration:
                port: 5418
                max_connections: 50
  pre_tasks:
    - name: "Ensuring git is installed for Molecule git fixture"
      ansible.builtin.package:
        name: git
        state: present

    - name: "Ensuring Molecule git source directory exists"
      ansible.builtin.file:
        path: /tmp/pg-molecule-source
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "Writing Molecule git source fixture file"
      ansible.builtin.copy:
        dest: /tmp/pg-molecule-source/README.md
        owner: root
        group: root
        mode: "0644"
        content: "postgres molecule git fixture\n"

    - name: "Checking whether Molecule git source repository already exists"
      ansible.builtin.stat:
        path: /tmp/pg-molecule-source/.git
      register: pg_molecule_git_source_repo

    - name: "Initializing Molecule git source repository"
      ansible.builtin.command:
        argv:
          - git
          - init
          - --initial-branch=main
          - /tmp/pg-molecule-source
      changed_when: true
      when: not pg_molecule_git_source_repo.stat.exists

    - name: "Configuring Molecule git source repository user email"
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /tmp/pg-molecule-source
          - config
          - user.email
          - molecule@example.org
      changed_when: true
      when: not pg_molecule_git_source_repo.stat.exists

    - name: "Configuring Molecule git source repository user name"
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /tmp/pg-molecule-source
          - config
          - user.name
          - Molecule
      changed_when: true
      when: not pg_molecule_git_source_repo.stat.exists

    - name: "Adding Molecule git source fixture to repository"
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /tmp/pg-molecule-source
          - add
          - README.md
      changed_when: true
      when: not pg_molecule_git_source_repo.stat.exists

    - name: "Creating Molecule git source fixture commit"
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /tmp/pg-molecule-source
          - commit
          - -m
          - Initial fixture
      changed_when: true
      when: not pg_molecule_git_source_repo.stat.exists
  roles:
    - role: ansible-iac-role-postgresql
