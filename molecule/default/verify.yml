---
- name: Verify
  hosts: all
  become: false
  vars:
    ansible_become_method: su
    pg_bind_source: "/srv/data/pgsql"
    pg_bind_target: "/var/lib/pgsql"
    pg_bind_fixture_file: "/srv/data/pgsql/molecule-bind-migrated.txt"
    pg_version_bind_source: "/srv/data/pgsql16-shared"
    pg_version_bind_target: "/tmp/pgsql16-shared"
    pg_repo_file: "/etc/yum.repos.d/pgdg-redhat-all.repo"
    pg_molecule_versions:
      - version: "16"
        directory: "/tmp/pgsql16"
        file: "/tmp/pgsql16/example.txt"
        cron_file: "/etc/cron.d/pg16_heartbeat"
      - version: "17"
        directory: "/tmp/pgsql17"
        file: "/tmp/pgsql17/example.txt"
        cron_file: "/etc/cron.d/pg17_heartbeat"
      - version: "18"
        directory: "/tmp/pgsql18"
        file: "/tmp/pgsql18/example.txt"
        cron_file: "/etc/cron.d/pg18_heartbeat"
        plpython_package: "postgresql18-plpython3"
    pg_molecule_instances:
      - version: "16"
        instance: "main"
        port: 5416
        database: "appdb16"
        role_names:
          - app_user
          - app_admin
        config_file: "/var/lib/pgsql/16/main/conf.d/42-inventory.conf"
        expected_config: "max_connections = 50"
        expected_port: "port = 5416"
        profile_file: ""
        security_file: "/var/lib/pgsql/16/main/conf.d/41-security.conf"
        autotuning_file: ""
        service_file: "/usr/lib/systemd/system/postgresql-16-main.service"
        hba_rule: "hostssl appdb16 app_user 10.0.0.1/32 scram-sha-256"
      - version: "16"
        instance: "analytics"
        port: 5516
        database: "analytics16"
        role_names:
          - report_user
          - report_admin
        config_file: "/var/lib/pgsql/16/analytics/conf.d/42-inventory.conf"
        expected_config: "max_connections = 40"
        expected_port: "port = 5516"
        profile_file: ""
        autotuning_file: ""
        service_file: "/usr/lib/systemd/system/postgresql-16-analytics.service"
        hba_rule: "host analytics16 report_user 10.0.0.2/32 scram-sha-256"
      - version: "17"
        instance: "main"
        port: 5417
        database: "appdb17"
        role_names:
          - app_user
          - app_admin
        config_file: "/var/lib/pgsql/17/main/conf.d/42-inventory.conf"
        expected_config: "max_connections = 50"
        expected_port: "port = 5417"
        profile_file: "/var/lib/pgsql/17/main/conf.d/40-profile.conf"
        security_file: "/var/lib/pgsql/17/main/conf.d/41-security.conf"
        ca_file: "/var/lib/pgsql/17/main/ssl/client-root-ca.crt"
        autotuning_file: ""
        service_file: "/usr/lib/systemd/system/postgresql-17-main.service"
        hba_rule: "hostssl appdb17 app_user 10.0.0.1/32 cert clientname=CN map=app_cert_map"
        ident_rule: "app_cert_map app-client app_user"
        security_rule: "ssl_ca_file = '/var/lib/pgsql/17/main/ssl/client-root-ca.crt'"
      - version: "18"
        instance: "main"
        port: 5418
        database: "appdb18"
        role_names:
          - app_user
          - app_admin
        config_file: "/var/lib/pgsql/18/main/conf.d/42-inventory.conf"
        expected_config: "max_connections = 50"
        expected_port: "port = 5418"
        profile_file: ""
        security_file: "/var/lib/pgsql/18/main/conf.d/41-security.conf"
        ca_file: "/var/lib/pgsql/18/main/ssl/client-root-ca.crt"
        autotuning_file: "/var/lib/pgsql/18/main/conf.d/43-autotuning.conf"
        service_file: "/usr/lib/systemd/system/postgresql-18-main.service"
        hba_rule: "hostssl appdb18 app_user 10.0.0.1/32 scram-sha-256 clientcert=verify-full clientname=DN"
        extra_hba_rule: "hostssl appdb18 app_user 10.0.0.2/32 cert clientname=CN"
        security_rule: "ssl_ca_file = '/var/lib/pgsql/18/main/ssl/client-root-ca.crt'"
  tasks:
    - name: "Checking PostgreSQL operating system user"
      ansible.builtin.command: "getent passwd postgres"
      register: pg_os_user_check
      changed_when: false

    - name: "Checking role with SQL-sensitive characters"
      become: true
      become_user: postgres
      ansible.builtin.command: >-
        /usr/pgsql-17/bin/psql postgres -p 5417 -tXAc
        "SELECT 1 FROM pg_roles WHERE rolname = 'app_user''injection'"
      register: pg_sql_sensitive_role_check
      changed_when: false

    - name: "Checking database with SQL-sensitive characters"
      become: true
      become_user: postgres
      ansible.builtin.command: >-
        /usr/pgsql-17/bin/psql postgres -p 5417 -tXAc
        "SELECT 1 FROM pg_database WHERE datname = 'appdb''injection'"
      register: pg_sql_sensitive_database_check
      changed_when: false

    - name: "Verifying SQL-sensitive role and database"
      ansible.builtin.assert:
        that:
          - pg_sql_sensitive_role_check.stdout | trim == '1'
          - pg_sql_sensitive_database_check.stdout | trim == '1'
        fail_msg: "SQL-sensitive role or database was not created correctly"

    - name: "Checking PostgreSQL repository file"
      ansible.builtin.stat:
        path: "{{ pg_repo_file }}"
      register: pg_repo_file_check

    - name: "Checking enabled PostgreSQL PGDG repositories"
      ansible.builtin.command: "dnf repolist --enabled"
      register: pg_enabled_repos
      changed_when: false

    - name: "Checking Rocky 9 CRB repository is enabled"
      ansible.builtin.command: "dnf repolist --enabled crb"
      register: pg_crb_repo_check
      changed_when: false

    - name: "Checking PostgreSQL module is disabled on Rocky 9"
      ansible.builtin.command: "dnf -qy module list postgresql --disabled"
      register: pg_module_disabled_check
      changed_when: false
      failed_when: false

    - name: "Checking PostgreSQL server packages"
      ansible.builtin.command: "rpm -q postgresql{{ item.version }}-server"
      loop: "{{ pg_molecule_versions }}"
      register: pg_package_checks
      changed_when: false

    - name: "Checking PL/Python extension packages"
      ansible.builtin.command: "rpm -q {{ item.plpython_package }}"
      loop: "{{ pg_molecule_versions | selectattr('plpython_package', 'defined') | rejectattr('plpython_package', 'equalto', '') | list }}"
      register: pg_plpython_package_checks
      changed_when: false

    - name: "Checking PostgreSQL services are active"
      ansible.builtin.command: "systemctl is-active postgresql-{{ item.version }}-{{ item.instance }}.service"
      loop: "{{ pg_molecule_instances }}"
      register: pg_service_checks
      changed_when: false

    - name: "Checking PostgreSQL services are enabled"
      ansible.builtin.command: "systemctl is-enabled postgresql-{{ item.version }}-{{ item.instance }}.service"
      loop: "{{ pg_molecule_instances }}"
      register: pg_service_enabled_checks
      changed_when: false

    - name: "Checking managed directories"
      ansible.builtin.stat:
        path: "{{ item.directory }}"
      loop: "{{ pg_molecule_versions }}"
      register: pg_directory_checks

    - name: "Checking managed files"
      ansible.builtin.stat:
        path: "{{ item.file }}"
      loop: "{{ pg_molecule_versions }}"
      register: pg_file_checks

    - name: "Reading managed files"
      ansible.builtin.slurp:
        path: "{{ item.file }}"
      loop: "{{ pg_molecule_versions }}"
      register: pg_file_contents

    - name: "Checking managed cron files"
      ansible.builtin.stat:
        path: "{{ item.cron_file }}"
      loop: "{{ pg_molecule_versions }}"
      register: pg_cron_checks

    - name: "Reading managed cron files"
      ansible.builtin.slurp:
        path: "{{ item.cron_file }}"
      loop: "{{ pg_molecule_versions }}"
      register: pg_cron_contents

    - name: "Checking inventory configuration files"
      ansible.builtin.stat:
        path: "{{ item.config_file }}"
      loop: "{{ pg_molecule_instances }}"
      register: pg_config_checks

    - name: "Reading inventory configuration files"
      ansible.builtin.slurp:
        path: "{{ item.config_file }}"
      loop: "{{ pg_molecule_instances }}"
      register: pg_config_contents

    - name: "Checking optional profile files"
      ansible.builtin.stat:
        path: "{{ item.profile_file }}"
      loop: "{{ pg_molecule_instances | selectattr('profile_file', 'truthy') | list }}"
      register: pg_profile_checks

    - name: "Checking optional autotuning files"
      ansible.builtin.stat:
        path: "{{ item.autotuning_file }}"
      loop: "{{ pg_molecule_instances | selectattr('autotuning_file', 'truthy') | list }}"
      register: pg_autotuning_checks

    - name: "Checking generated systemd service files"
      ansible.builtin.stat:
        path: "{{ item.service_file }}"
      loop: "{{ pg_molecule_instances }}"
      register: pg_service_file_checks

    - name: "Checking expected inventory configuration values"
      ansible.builtin.command: >-
        grep -F "{{ item.expected_config }}" {{ item.config_file }}
      loop: "{{ pg_molecule_instances }}"
      register: pg_expected_config_checks
      changed_when: false

    - name: "Checking expected inventory port values"
      ansible.builtin.command: >-
        grep -F "{{ item.expected_port }}" {{ item.config_file }}
      loop: "{{ pg_molecule_instances }}"
      register: pg_expected_port_checks
      changed_when: false

    - name: "Checking cloned git fixture file"
      ansible.builtin.stat:
        path: /var/lib/pgsql/git/pg-molecule-source/README.md
      register: pg_git_fixture_file

    - name: "Reading cloned git fixture file"
      ansible.builtin.slurp:
        path: /var/lib/pgsql/git/pg-molecule-source/README.md
      register: pg_git_fixture_content
      when: pg_git_fixture_file.stat.exists

    - name: "Checking cloned git fixture file without update option"
      ansible.builtin.stat:
        path: /var/lib/pgsql/git/pg-molecule-source-no-update/README.md
      register: pg_git_fixture_no_update_file

    - name: "Reading cloned git fixture file without update option"
      ansible.builtin.slurp:
        path: /var/lib/pgsql/git/pg-molecule-source-no-update/README.md
      register: pg_git_fixture_no_update_content
      when: pg_git_fixture_no_update_file.stat.exists

    - name: "Checking bind migration fixture file in real PostgreSQL directory"
      ansible.builtin.stat:
        path: "{{ pg_bind_fixture_file }}"
      register: pg_bind_fixture_stat

    - name: "Reading bind migration fixture file"
      ansible.builtin.slurp:
        path: "{{ pg_bind_fixture_file }}"
      register: pg_bind_fixture_content
      when: pg_bind_fixture_stat.stat.exists

    - name: "Checking non-conflicting source fixture file in real PostgreSQL directory"
      ansible.builtin.stat:
        path: "/srv/data/pgsql/.bash_profile"
      register: pg_bind_source_fixture_stat

    - name: "Reading non-conflicting source fixture file"
      ansible.builtin.slurp:
        path: "/srv/data/pgsql/.bash_profile"
      register: pg_bind_source_fixture_content
      when: pg_bind_source_fixture_stat.stat.exists

    - name: "Checking live bind mount source for PostgreSQL directory"
      ansible.builtin.command: "findmnt -n -M {{ pg_bind_target }} -o SOURCE"
      register: pg_bind_mount_source
      changed_when: false

    - name: "Checking PostgreSQL bind mount fstab entry"
      ansible.builtin.command: >-
        grep -F "{{ pg_bind_source }} {{ pg_bind_target }} none bind 0 0" /etc/fstab
      register: pg_bind_fstab_check
      changed_when: false

    - name: "Checking version-scoped bind source directory"
      ansible.builtin.stat:
        path: "{{ pg_version_bind_source }}"
      register: pg_version_bind_source_stat

    - name: "Checking version-scoped bind target directory"
      ansible.builtin.stat:
        path: "{{ pg_version_bind_target }}"
      register: pg_version_bind_target_stat

    - name: "Checking live bind mount source for version-scoped bind target"
      ansible.builtin.command: "findmnt -n -M {{ pg_version_bind_target }} -o SOURCE"
      register: pg_version_bind_mount_source
      changed_when: false

    - name: "Checking version-scoped bind mount fstab entry"
      ansible.builtin.command: >-
        grep -F "{{ pg_version_bind_source }} {{ pg_version_bind_target }} none bind 0 0" /etc/fstab
      register: pg_version_bind_fstab_check
      changed_when: false

    - name: "Checking databases exist"
      become: true
      become_user: postgres
      ansible.builtin.command: >-
        /usr/pgsql-{{ item.version }}/bin/psql postgres -p {{ item.port }}
        -tXAc "SELECT 1 FROM pg_database WHERE datname='{{ item.database }}'"
      loop: "{{ pg_molecule_instances }}"
      register: pg_database_checks
      changed_when: false

    - name: "Checking primary application roles exist"
      become: true
      become_user: postgres
      ansible.builtin.command: >-
        /usr/pgsql-{{ item.version }}/bin/psql postgres -p {{ item.port }}
        -tXAc "SELECT 1 FROM pg_roles WHERE rolname='{{ item.role_names[0] }}'"
      loop: "{{ pg_molecule_instances }}"
      register: pg_role_checks
      changed_when: false

    - name: "Checking administrative roles exist"
      become: true
      become_user: postgres
      ansible.builtin.command: >-
        /usr/pgsql-{{ item.version }}/bin/psql postgres -p {{ item.port }}
        -tXAc "SELECT 1 FROM pg_roles WHERE rolname='{{ item.role_names[1] }}'"
      loop: "{{ pg_molecule_instances }}"
      register: pg_admin_role_checks
      changed_when: false

    - name: "Checking pgcrypto extension is installed"
      become: true
      become_user: postgres
      ansible.builtin.command: >-
        /usr/pgsql-{{ item.version }}/bin/psql {{ item.database }} -p {{ item.port }}
        -tXAc "SELECT 1 FROM pg_extension WHERE extname='pgcrypto'"
      loop: "{{ pg_molecule_instances }}"
      register: pg_extension_checks
      changed_when: false

    - name: "Checking plpython3u extension is installed"
      become: true
      become_user: postgres
      ansible.builtin.command: >-
        /usr/pgsql-{{ item.version }}/bin/psql {{ item.database }} -p {{ item.port }}
        -tXAc "SELECT 1 FROM pg_extension WHERE extname='plpython3u'"
      loop: "{{ pg_molecule_instances | selectattr('version', 'equalto', '18') | list }}"
      register: pg_plpython_extension_checks
      changed_when: false

    - name: "Checking pg_hba access rules"
      ansible.builtin.command: >-
        grep -F "{{ item.hba_rule }}"
        /var/lib/pgsql/{{ item.version }}/{{ item.instance }}/pg_hba.conf
      loop: "{{ pg_molecule_instances }}"
      register: pg_hba_checks
      changed_when: false

    - name: "Checking additional pg_hba access rules"
      ansible.builtin.command: >-
        grep -F "{{ item.extra_hba_rule }}"
        /var/lib/pgsql/{{ item.version }}/{{ item.instance }}/pg_hba.conf
      loop: "{{ pg_molecule_instances | selectattr('extra_hba_rule', 'defined') | list }}"
      register: pg_extra_hba_checks
      changed_when: false

    - name: "Checking pg_ident access rules"
      ansible.builtin.command: >-
        grep -F "{{ item.ident_rule }}"
        /var/lib/pgsql/{{ item.version }}/{{ item.instance }}/pg_ident.conf
      loop: "{{ pg_molecule_instances | selectattr('ident_rule', 'defined') | list }}"
      register: pg_ident_checks
      changed_when: false

    - name: "Checking SSL client CA files"
      ansible.builtin.stat:
        path: "{{ item.ca_file }}"
      loop: "{{ pg_molecule_instances | selectattr('ca_file', 'defined') | list }}"
      register: pg_client_ca_checks

    - name: "Checking security configuration for SSL client CA"
      ansible.builtin.command: >-
        grep -F "{{ item.security_rule }}"
        {{ item.security_file }}
      loop: "{{ pg_molecule_instances | selectattr('security_rule', 'defined') | list }}"
      register: pg_security_checks
      changed_when: false

    - name: "Verifying Molecule-managed PostgreSQL state"
      ansible.builtin.assert:
        that:
          - pg_os_user_check.rc == 0
          - pg_repo_file_check.stat.exists
          - "'pgdg16' in pg_enabled_repos.stdout"
          - "'pgdg17' in pg_enabled_repos.stdout"
          - "'pgdg18' in pg_enabled_repos.stdout"
          - pg_crb_repo_check.rc == 0
          - >-
            (
              pg_module_disabled_check.rc == 0
              and (pg_module_disabled_check.stdout is search('postgresql'))
            )
            or
            (
              pg_module_disabled_check.stderr is search('No matching Modules to list')
            )
          - pg_package_checks.results | map(attribute='rc') | list == [0, 0, 0]
          - pg_plpython_package_checks.results | map(attribute='rc') | list == [0]
          - pg_service_checks.results | map(attribute='stdout') | list == ['active', 'active', 'active', 'active']
          - pg_service_enabled_checks.results | map(attribute='stdout') | list == ['enabled', 'enabled', 'enabled', 'enabled']
          - pg_directory_checks.results | map(attribute='stat.exists') | list == [true, true, true]
          - pg_directory_checks.results | map(attribute='stat.isdir') | list == [true, true, true]
          - pg_file_checks.results | map(attribute='stat.exists') | list == [true, true, true]
          - pg_file_contents.results | map(attribute='content') | map('b64decode') | list == ['molecule\n', 'molecule\n', 'molecule\n']
          - pg_cron_checks.results | map(attribute='stat.exists') | list == [true, true, true]
          - pg_cron_contents.results | map(attribute='content') | map('b64decode') | join('') is search('/bin/true')
          - pg_config_checks.results | map(attribute='stat.exists') | list == [true, true, true, true]
          - pg_expected_config_checks.results | map(attribute='rc') | list == [0, 0, 0, 0]
          - pg_expected_port_checks.results | map(attribute='rc') | list == [0, 0, 0, 0]
          - pg_profile_checks.results | map(attribute='stat.exists') | list == [true]
          - pg_autotuning_checks.results | map(attribute='stat.exists') | list == [true]
          - pg_service_file_checks.results | map(attribute='stat.exists') | list == [true, true, true, true]
          - pg_git_fixture_file.stat.exists
          - (pg_git_fixture_content.content | b64decode) == 'postgres molecule git fixture\n'
          - pg_git_fixture_no_update_file.stat.exists
          - (pg_git_fixture_no_update_content.content | b64decode) == 'postgres molecule git fixture\n'
          - pg_bind_fixture_stat.stat.exists
          - (pg_bind_fixture_content.content | b64decode) == 'legacy bind data\n'
          - pg_bind_source_fixture_stat.stat.exists
          - (pg_bind_source_fixture_content.content | b64decode) == 'source fixture\numask 077\n'
          - (pg_bind_mount_source.stdout | trim) is search(pg_bind_source)
          - pg_bind_fstab_check.rc == 0
          - pg_version_bind_source_stat.stat.exists
          - pg_version_bind_source_stat.stat.isdir
          - pg_version_bind_target_stat.stat.exists
          - pg_version_bind_target_stat.stat.isdir
          - (pg_version_bind_mount_source.stdout | trim) is search(pg_version_bind_source)
          - pg_version_bind_fstab_check.rc == 0
          - pg_database_checks.results | map(attribute='stdout') | list == ['1', '1', '1', '1']
          - pg_role_checks.results | map(attribute='stdout') | list == ['1', '1', '1', '1']
          - pg_admin_role_checks.results | map(attribute='stdout') | list == ['1', '1', '1', '1']
          - pg_extension_checks.results | map(attribute='stdout') | list == ['1', '1', '1', '1']
          - pg_plpython_extension_checks.results | map(attribute='stdout') | list == ['1']
          - pg_hba_checks.results | map(attribute='rc') | list == [0, 0, 0, 0]
          - pg_extra_hba_checks.results | map(attribute='rc') | list == [0]
          - pg_ident_checks.results | map(attribute='rc') | list == [0]
          - pg_client_ca_checks.results | map(attribute='stat.exists') | list == [true, true]
          - pg_security_checks.results | map(attribute='rc') | list == [0, 0]
        fail_msg: "PostgreSQL Molecule verification failed"
