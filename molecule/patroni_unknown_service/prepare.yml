---
- name: "Prepare pre-existing Patroni data without its service unit"
  hosts: all
  become: false
  tasks:
    - name: "Creating PostgreSQL system group"
      ansible.builtin.group:
        name: "postgres"
        system: true
        state: "present"

    - name: "Creating PostgreSQL system user and home directory"
      ansible.builtin.user:
        name: "postgres"
        group: "postgres"
        home: "/var/lib/pgsql"
        create_home: true
        system: true
        shell: "/sbin/nologin"
        state: "present"

    - name: "Creating existing Patroni data directory"
      ansible.builtin.file:
        path: /tmp/custom-pgdata/17/main
        state: "directory"
        owner: "postgres"
        group: "postgres"
        mode: "0700"

    - name: "Creating existing Patroni data directory and sentinel"
      ansible.builtin.copy:
        content: "pre-existing-data\n"
        dest: /tmp/custom-pgdata/17/main/PG_VERSION
        owner: root
        group: root
        mode: "0600"

    - name: "Creating existing nested Patroni data directory"
      ansible.builtin.file:
        path: "/tmp/custom-pgdata/17/main/nested"
        state: "directory"
        owner: "postgres"
        group: "postgres"
        mode: "0700"

    - name: "Creating additional pre-existing Patroni data files"
      ansible.builtin.copy:
        content: "{{ item.content }}\n"
        dest: "/tmp/custom-pgdata/17/main/{{ item.name }}"
        owner: "postgres"
        group: "postgres"
        mode: "{{ item.mode }}"
      loop:
        - { name: "postgresql.conf", content: "existing configuration", mode: "0600" }
        - { name: "nested/metadata", content: "existing nested metadata", mode: "0640" }

    - name: "Snapshotting complete pre-test Patroni data tree"
      ansible.builtin.command:
        argv:
          - /bin/bash
          - -o
          - pipefail
          - -c
          - "tar --sort=name --format=gnu --numeric-owner -cf - -C /tmp/custom-pgdata/17/main . | sha256sum"
      register: patroni_data_before
      changed_when: false

    - name: "Saving the pre-test data tree checksum"
      ansible.builtin.copy:
        content: "{{ patroni_data_before.stdout }}\n"
        dest: "/tmp/patroni-data-before.sha256"
        mode: "0600"
