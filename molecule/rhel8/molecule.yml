---
dependency:
  name: galaxy

driver:
  name: podman

platforms:
  - name: instance-idarsi-rhel8
    image: registry.access.redhat.com/ubi8-init
    command: /sbin/init
    privileged: true
    pre_build_image: false
    systemd: "true"
    tty: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  env:
    ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
    ANSIBLE_ASYNC_DIR: "${MOLECULE_PROJECT_DIRECTORY}/.ansible_async"
    ANSIBLE_LOCAL_TEMP: "/tmp/.ansible/tmp"
    ANSIBLE_REMOTE_TMP: "/tmp"
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  inventory:
    host_vars:
      instance-idarsi-rhel8:
        ansible_python_interpreter: /usr/bin/python3.9

verifier:
  name: ansible
