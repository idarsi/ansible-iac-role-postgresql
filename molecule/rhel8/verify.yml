---
- name: Verify
  hosts: all
  become: false
  vars:
    ansible_become_method: su
    pg_repo_file: "/etc/yum.repos.d/pgdg-redhat-all.repo"
    pg_version: "17"
    pg_instance: "main"
    pg_port: 5417
    pg_database: "appdb17"
    pg_config_file: "/var/lib/pgsql/17/main/conf.d/42-inventory.conf"
    pg_profile_file: "/var/lib/pgsql/17/main/conf.d/40-profile.conf"
    pg_service_file: "/usr/lib/systemd/system/postgresql-17-main.service"
  tasks:
    - name: "Checking PostgreSQL operating system user"
      ansible.builtin.command: "getent passwd postgres"
      register: pg_os_user_check
      changed_when: false

    - name: "Checking PostgreSQL repository file"
      ansible.builtin.stat:
        path: "{{ pg_repo_file }}"
      register: pg_repo_file_check

    - name: "Checking enabled PostgreSQL PGDG repositories"
      ansible.builtin.command: "dnf repolist --enabled"
      register: pg_enabled_repos
      changed_when: false

    - name: "Checking PostgreSQL module is disabled on RHEL 8"
      ansible.builtin.command: "dnf -qy module list postgresql --disabled"
      register: pg_module_disabled_check
      changed_when: false
      failed_when: false

    - name: "Checking PostgreSQL server package"
      ansible.builtin.command: "rpm -q postgresql{{ pg_version }}-server"
      register: pg_package_check
      changed_when: false

    - name: "Checking PostgreSQL service is active"
      ansible.builtin.command: "systemctl is-active postgresql-{{ pg_version }}-{{ pg_instance }}.service"
      register: pg_service_check
      changed_when: false

    - name: "Checking PostgreSQL service is enabled"
      ansible.builtin.command: "systemctl is-enabled postgresql-{{ pg_version }}-{{ pg_instance }}.service"
      register: pg_service_enabled_check
      changed_when: false

    - name: "Checking managed file"
      ansible.builtin.stat:
        path: /tmp/pgsql17/example.txt
      register: pg_file_check

    - name: "Reading managed file"
      ansible.builtin.slurp:
        path: /tmp/pgsql17/example.txt
      register: pg_file_content

    - name: "Checking managed cron file"
      ansible.builtin.stat:
        path: /etc/cron.d/pg17_heartbeat
      register: pg_cron_check

    - name: "Checking inventory configuration file"
      ansible.builtin.stat:
        path: "{{ pg_config_file }}"
      register: pg_config_check

    - name: "Reading inventory configuration file"
      ansible.builtin.slurp:
        path: "{{ pg_config_file }}"
      register: pg_config_content

    - name: "Checking profile configuration file"
      ansible.builtin.stat:
        path: "{{ pg_profile_file }}"
      register: pg_profile_check

    - name: "Checking generated systemd service file"
      ansible.builtin.stat:
        path: "{{ pg_service_file }}"
      register: pg_service_file_check

    - name: "Checking database exists"
      become: true
      become_user: postgres
      ansible.builtin.command: >-
        /usr/pgsql-{{ pg_version }}/bin/psql postgres -p {{ pg_port }}
        -tXAc "SELECT 1 FROM pg_database WHERE datname='{{ pg_database }}'"
      register: pg_database_check
      changed_when: false

    - name: "Checking primary application roles exist"
      become: true
      become_user: postgres
      ansible.builtin.command: >-
        /usr/pgsql-{{ pg_version }}/bin/psql postgres -p {{ pg_port }}
        -tXAc "SELECT 1 FROM pg_roles WHERE rolname='{{ item }}'"
      loop:
        - app_user
        - app_admin
      register: pg_role_checks
      changed_when: false

    - name: "Checking pgcrypto extension is installed"
      become: true
      become_user: postgres
      ansible.builtin.command: >-
        /usr/pgsql-{{ pg_version }}/bin/psql {{ pg_database }} -p {{ pg_port }}
        -tXAc "SELECT 1 FROM pg_extension WHERE extname='pgcrypto'"
      register: pg_extension_check
      changed_when: false

    - name: "Checking pg_hba access rule"
      ansible.builtin.command: >-
        grep -F "host {{ pg_database }} app_user 10.0.0.1/32 scram-sha-256"
        /var/lib/pgsql/{{ pg_version }}/{{ pg_instance }}/pg_hba.conf
      register: pg_hba_check
      changed_when: false

    - name: "Verifying RHEL 8 PostgreSQL repository workflow"
      ansible.builtin.assert:
        that:
          - pg_os_user_check.rc == 0
          - pg_repo_file_check.stat.exists
          - "'pgdg17' in pg_enabled_repos.stdout"
          - >-
            (
              pg_module_disabled_check.rc == 0
              and (pg_module_disabled_check.stdout is search('postgresql'))
            )
            or
            (
              pg_module_disabled_check.stderr is search('No matching Modules to list')
            )
          - pg_package_check.rc == 0
          - pg_service_check.stdout == 'active'
          - pg_service_enabled_check.stdout == 'enabled'
          - pg_file_check.stat.exists
          - (pg_file_content.content | b64decode) == 'molecule\n'
          - pg_cron_check.stat.exists
          - pg_config_check.stat.exists
          - (pg_config_content.content | b64decode) is search('max_connections = 50')
          - (pg_config_content.content | b64decode) is search('port = 5417')
          - pg_profile_check.stat.exists
          - pg_service_file_check.stat.exists
          - pg_database_check.stdout == '1'
          - pg_role_checks.results | map(attribute='stdout') | list == ['1', '1']
          - pg_extension_check.stdout == '1'
          - pg_hba_check.rc == 0
        fail_msg: "PostgreSQL RHEL 8 repository Molecule verification failed"
