---
- name: Verify
  hosts: all
  become: false
  vars:
    ansible_become_method: su
    pg_repo_file: "/etc/yum.repos.d/pgdg-redhat-all.repo"
    pg_molecule_versions:
      - { version: "17", port: 5417, database: appdb17, directory: /tmp/pgsql17, file: /tmp/pgsql17/example.txt, cron_file: /etc/cron.d/pg17_heartbeat, config_file: /var/lib/pgsql/17/main/conf.d/42-inventory.conf }
      - { version: "18", port: 5418, database: appdb18, directory: /tmp/pgsql18, file: /tmp/pgsql18/example.txt, cron_file: /etc/cron.d/pg18_heartbeat, config_file: /var/lib/pgsql/18/main/conf.d/42-inventory.conf }
  tasks:
    - name: "Checking PostgreSQL operating system user"
      ansible.builtin.command: "getent passwd postgres"
      register: pg_os_user_check
      changed_when: false

    - name: "Checking PostgreSQL repository file"
      ansible.builtin.stat:
        path: "{{ pg_repo_file }}"
      register: pg_repo_file_check

    - name: "Checking enabled PostgreSQL PGDG repositories"
      ansible.builtin.command: "dnf repolist --enabled"
      register: pg_enabled_repos
      changed_when: false

    - name: "Checking PostgreSQL module is disabled on RHEL 8"
      ansible.builtin.command: "dnf -qy module list postgresql --disabled"
      register: pg_module_disabled_check
      changed_when: false
      failed_when: false

    - name: "Checking PostgreSQL server packages"
      ansible.builtin.command: "rpm -q postgresql{{ item.version }}-server"
      loop: "{{ pg_molecule_versions }}"
      register: pg_package_checks
      changed_when: false

    - name: "Checking PostgreSQL services"
      ansible.builtin.command: "systemctl is-active postgresql-{{ item.version }}-main.service"
      loop: "{{ pg_molecule_versions }}"
      register: pg_service_checks
      changed_when: false

    - name: "Checking PostgreSQL service enablement"
      ansible.builtin.command: "systemctl is-enabled postgresql-{{ item.version }}-main.service"
      loop: "{{ pg_molecule_versions }}"
      register: pg_service_enabled_checks
      changed_when: false

    - name: "Checking managed directories and files"
      ansible.builtin.stat:
        path: "{{ item.1 }}"
      loop: "{{ pg_molecule_versions | map(attribute='directory') | zip(pg_molecule_versions | map(attribute='file')) | list }}"
      register: pg_managed_path_checks

    - name: "Checking managed cron files"
      ansible.builtin.stat:
        path: "{{ item.cron_file }}"
      loop: "{{ pg_molecule_versions }}"
      register: pg_cron_checks

    - name: "Checking inventory configuration"
      ansible.builtin.command: "grep -F 'max_connections = 50' {{ item.config_file }}"
      loop: "{{ pg_molecule_versions }}"
      register: pg_config_checks
      changed_when: false

    - name: "Checking generated systemd service files"
      ansible.builtin.stat:
        path: "/usr/lib/systemd/system/postgresql-{{ item.version }}-main.service"
      loop: "{{ pg_molecule_versions }}"
      register: pg_service_file_checks

    - name: "Checking databases exist"
      become: true
      become_user: postgres
      ansible.builtin.command: >-
        /usr/pgsql-{{ item.version }}/bin/psql postgres -p {{ item.port }}
        -tXAc "SELECT 1 FROM pg_database WHERE datname='{{ item.database }}'"
      loop: "{{ pg_molecule_versions }}"
      register: pg_database_checks
      changed_when: false

    - name: "Checking application roles exist"
      become: true
      become_user: postgres
      ansible.builtin.command: >-
        /usr/pgsql-{{ item.0.version }}/bin/psql postgres -p {{ item.0.port }}
        -tXAc "SELECT 1 FROM pg_roles WHERE rolname='{{ item.1 }}'"
      loop: "{{ pg_molecule_versions | product(['app_user', 'app_admin']) | list }}"
      register: pg_role_checks
      changed_when: false

    - name: "Checking pgcrypto extensions exist"
      become: true
      become_user: postgres
      ansible.builtin.command: >-
        /usr/pgsql-{{ item.version }}/bin/psql {{ item.database }} -p {{ item.port }}
        -tXAc "SELECT 1 FROM pg_extension WHERE extname='pgcrypto'"
      loop: "{{ pg_molecule_versions }}"
      register: pg_extension_checks
      changed_when: false

    - name: "Checking pg_hba rules"
      ansible.builtin.command: >-
        grep -F "host {{ item.database }} app_user 10.0.0.1/32 scram-sha-256"
        /var/lib/pgsql/{{ item.version }}/main/pg_hba.conf
      loop: "{{ pg_molecule_versions }}"
      register: pg_hba_checks
      changed_when: false

    - name: "Checking PostgreSQL 17 profile configuration"
      ansible.builtin.stat:
        path: /var/lib/pgsql/17/main/conf.d/40-profile.conf
      register: pg_profile_check

    - name: "Verifying RHEL 8 PostgreSQL versions and repository workflow"
      ansible.builtin.assert:
        that:
          - pg_os_user_check.rc == 0
          - pg_repo_file_check.stat.exists
          - "'pgdg17' in pg_enabled_repos.stdout"
          - "'pgdg18' in pg_enabled_repos.stdout"
          - >-
            (pg_module_disabled_check.rc == 0 and pg_module_disabled_check.stdout is search('postgresql'))
            or pg_module_disabled_check.stderr is search('No matching Modules to list')
          - pg_package_checks.results | map(attribute='rc') | list == [0, 0]
          - pg_service_checks.results | map(attribute='stdout') | list == ['active', 'active']
          - pg_service_enabled_checks.results | map(attribute='stdout') | list == ['enabled', 'enabled']
          - pg_managed_path_checks.results | map(attribute='stat.exists') | list == [true, true]
          - pg_cron_checks.results | map(attribute='stat.exists') | list == [true, true]
          - pg_config_checks.results | map(attribute='rc') | list == [0, 0]
          - pg_service_file_checks.results | map(attribute='stat.exists') | list == [true, true]
          - pg_database_checks.results | map(attribute='stdout') | list == ['1', '1']
          - pg_role_checks.results | map(attribute='stdout') | list == ['1', '1', '1', '1']
          - pg_extension_checks.results | map(attribute='stdout') | list == ['1', '1']
          - pg_hba_checks.results | map(attribute='rc') | list == [0, 0]
          - pg_profile_check.stat.exists
        fail_msg: "PostgreSQL RHEL 8 repository Molecule verification failed"
