---
dependency:
  name: "shell"
  command: >-
    python3 "${MOLECULE_PROJECT_DIRECTORY}/tests/dependency.py"
    --scenario-directory "${MOLECULE_SCENARIO_DIRECTORY}"
    --ephemeral-directory "${MOLECULE_EPHEMERAL_DIRECTORY}"
    --molecule-file "${MOLECULE_FILE}"
    --env-file "${MOLECULE_ENV_FILE}"
    --helper-directory "${IDARSI_TEST_ENVIRONMENT}"
driver:
  name: default
  safe_files:
    - "${MOLECULE_EPHEMERAL_DIRECTORY}/collections/*"
  options:
    managed: true
provisioner:
  playbooks:
    create: "${IDARSI_TEST_ENVIRONMENT}/molecule/managed/create.yml"
    destroy: "${IDARSI_TEST_ENVIRONMENT}/molecule/managed/destroy.yml"
  name: ansible
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_EPHEMERAL_DIRECTORY}/collections"
    IDARSI_MOLECULE_BACKEND: "kvm"
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
    ANSIBLE_REMOTE_TMP: /tmp
platforms:
- name: pg01
  install_source: "${IDARSI_TEST_KVM_INSTALL_SOURCE}"
  kickstart: ${IDARSI_TEST_ENVIRONMENT}/examples/molecule-kvm/rocky9-10.ks.tmpl
  memory_mb: 2048
  vcpus: 2
  disk_size_gb: 30
  install_timeout: 3600
  ssh_user: molecule
- name: pg02
  install_source: "${IDARSI_TEST_KVM_INSTALL_SOURCE}"
  kickstart: ${IDARSI_TEST_ENVIRONMENT}/examples/molecule-kvm/rocky9-10.ks.tmpl
  memory_mb: 2048
  vcpus: 2
  disk_size_gb: 30
  install_timeout: 3600
  ssh_user: molecule
- name: pg03
  install_source: "${IDARSI_TEST_KVM_INSTALL_SOURCE}"
  kickstart: ${IDARSI_TEST_ENVIRONMENT}/examples/molecule-kvm/rocky9-10.ks.tmpl
  memory_mb: 2048
  vcpus: 2
  disk_size_gb: 30
  install_timeout: 3600
  ssh_user: molecule
verifier:
  name: ansible
