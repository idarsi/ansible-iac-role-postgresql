---
- name: "Checking published PostgreSQL certificate preflight model"
  ansible.builtin.assert:
    that: pg_certificate_preflight_complete | default(false) | bool
    fail_msg: "Top-level certificate preflight must complete before certificate convergence"

- name: "PREFLIGHT COMPLETE - converge PostgreSQL certificate pair"
  ansible.builtin.include_tasks: certification_converge.yml
