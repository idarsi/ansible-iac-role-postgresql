---
###############################################################################
#
# certification_present.yml
#
# @author Arsi Atomi
#
###############################################################################

###############################################################################
# SETTING VARIABLES
###############################################################################

- name: "Checking if required variables are defined"
  ansible.builtin.assert:
    that:
      - pg_certificate_private_key_bits is defined
      - pg_certificate_private_key_fullpath is defined
      - pg_certificate_public_key_fullpath is defined
      - >-
        (
          pg_client_certificate_authority_content is not defined
        )
        or
        (
          pg_client_certificate_authority_src is not defined
        )
      - pg_default_dir is defined
      - pg_instance is defined
      - pg_os_user is defined
      - pg_os_group is defined
      - pg_version is defined
    fail_msg: "All tests did not pass"

###############################################################################
# ENSURING SSL CERTIFICATE EXISTS IF NEEDED
###############################################################################

- name: "Setting variables"
  ansible.builtin.set_fact:
    pg_cli_command: "openssl genrsa -out {{ pg_certificate_private_key_fullpath }} {{ pg_certificate_private_key_bits }}"

- name: "Ensuring directory ssl is present"
  ansible.builtin.file:
    path: "{{ pg_default_dir }}/{{ pg_version }}/{{ pg_instance }}/ssl/"
    state: directory
    owner: "{{ pg_os_user }}"
    group: "{{ pg_os_group }}"
    mode: "0700"

- name: "Ensuring certificate private key exists if needed"
  ansible.builtin.command: "{{ pg_cli_command }}"
  args:
    creates: "{{ pg_certificate_private_key_fullpath }}"
  register: my_output
  failed_when: my_output.rc != 0

- name: "Writing log"
  ansible.builtin.include_tasks: log_write.yml
  vars:
    iac_log_write: "Created private key to {{ pg_certificate_private_key_fullpath }}"

- name: "Setting variables"
  ansible.builtin.set_fact:
    pg_cli_command: >-
      openssl req -new -x509 -nodes
      -key {{ pg_certificate_private_key_fullpath }}
      -out {{ pg_certificate_public_key_fullpath }}
      -days {{ pg_certificate_public_key_days }}
      -subj "/CN=localhost"

- name: "Ensuring certificate public key exists if needed"
  ansible.builtin.command: "{{ pg_cli_command }}"
  args:
    creates: "{{ pg_certificate_public_key_fullpath }}"
  register: my_output
  failed_when: my_output.rc != 0

- name: "Ensuring trusted client CA certificate from inline content is present"
  ansible.builtin.copy:
    content: "{{ pg_client_certificate_authority_content }}"
    dest: "{{ pg_client_certificate_authority_fullpath }}"
    owner: "{{ pg_os_user }}"
    group: "{{ pg_os_group }}"
    mode: "0600"
  when: pg_client_certificate_authority_content is defined

- name: "Ensuring trusted client CA certificate from source path is present"
  ansible.builtin.copy:
    src: "{{ pg_client_certificate_authority_src }}"
    dest: "{{ pg_client_certificate_authority_fullpath }}"
    owner: "{{ pg_os_user }}"
    group: "{{ pg_os_group }}"
    mode: "0600"
  when: pg_client_certificate_authority_src is defined

- name: "Collecting SSL directory entries"
  ansible.builtin.find:
    path: "{{ pg_default_dir }}/{{ pg_version }}/{{ pg_instance }}/ssl/"
    file_type: file
  register: pg_ssl_directory_files

- name: "Ensuring SSL files are set to 0600"
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ pg_os_user }}"
    group: "{{ pg_os_group }}"
    mode: "0600"
  loop: "{{ pg_ssl_directory_files.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: "Ensuring directory is set 0700"
  ansible.builtin.file:
    path: "{{ pg_default_dir }}/{{ pg_version }}/{{ pg_instance }}/ssl/"
    state: directory
    owner: "{{ pg_os_user }}"
    group: "{{ pg_os_group }}"
    mode: "0700"

- name: "Writing log"
  ansible.builtin.include_tasks: log_write.yml
  vars:
    iac_log_write: "Created public key to {{ pg_certificate_public_key_fullpath }}"

- name: "Writing log"
  ansible.builtin.include_tasks: log_write.yml
  vars:
    iac_log_write: "Created trusted client CA certificate to {{ pg_client_certificate_authority_fullpath }}"
  when: pg_client_certificate_authority_enabled
