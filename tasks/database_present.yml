---
###############################################################################
#
# database_present.yml
#
# @author Arsi Atomi
#
###############################################################################

###############################################################################
# SETTING VARIABLES
###############################################################################

- name: "Setting what variables are configured"
  ansible.builtin.set_fact:
    pg_database: "{{ pg_database_record.name }}"
    pg_access: "{{ pg_database_record.access | default([]) }}"
    pg_extensions: "{{ pg_database_record.extensions | default([]) }}"
  when: pg_database_record is defined

- name: "Checking if required variables are defined"
  ansible.builtin.assert:
    that:
      - pg_extensions is defined
      - pg_database is defined
      - pg_instance is defined
      - pg_port is defined
      - pg_version is defined
    fail_msg: "PostgreSQL database_present state is missing one or more required variables"

###############################################################################
# ENSURING DATABASE ARE PRESENT
###############################################################################

- name: "Setting variables"
  ansible.builtin.set_fact:
    pg_cli_command: >-
      /usr/pgsql-{{ pg_version }}/bin/psql postgres -p {{ pg_port }}
      -tXAc "SELECT 1 FROM pg_database WHERE datname='{{ pg_database | string | replace("'", "''") }}'"

- name: "Checking if database already exists"
  become: true
  become_user: "{{ pg_os_user }}"
  ansible.builtin.command: "{{ pg_cli_command }}"
  check_mode: false
  register: database_exists
  changed_when: false
  failed_when: database_exists.rc != 0

- name: "Setting database existence flag"
  ansible.builtin.set_fact:
    database_is_present: "{{ (database_exists.stdout | trim) == '1' }}"
    database_needs_update: false

- name: "Reading current database owner when database exists"
  become: true
  become_user: "{{ pg_os_user }}"
  ansible.builtin.command:
    cmd: >-
      /usr/pgsql-{{ pg_version }}/bin/psql postgres -p {{ pg_port }} -tXA
    stdin: >-
      SELECT pg_catalog.pg_get_userbyid(datdba)
      FROM pg_database
      WHERE datname='{{ pg_database | string | replace("'", "''") }}'
  check_mode: false
  register: database_owner
  changed_when: false
  when: database_is_present | bool

- name: "Deciding if existing database needs changes"
  ansible.builtin.set_fact:
    database_needs_update: "{{ pg_database_record.owner is defined and (database_owner.stdout | trim) != (pg_database_record.owner | string) }}"
  when: database_is_present | bool

- name: "Preparing CREATE DATABASE command if database does not exist"
  when: not database_is_present
  block:
    - name: "Setting optional attributes for CREATE DATABASE"
      ansible.builtin.set_fact:
        pg_database_owner_str: >-
          {{ ('OWNER "' ~ (pg_database_record.owner | string | replace('"', '""')) ~ '"') if (pg_database_record.owner is defined) else '' }}
        pg_database_encoding_str: >-
          {{ ('ENCODING "' ~ (pg_database_record.encoding | string | replace('"', '""')) ~ '"') if (pg_database_record.encoding is defined) else '' }}
    - name: "Assembling full CREATE DATABASE psql command"
      ansible.builtin.set_fact:
        pg_cli_command: >-
          /usr/pgsql-{{ pg_version }}/bin/psql postgres -p {{ pg_port }}
        pg_cli_sql: >-
          CREATE DATABASE "{{ pg_database | string | replace('"', '""') }}"
          {{ pg_database_owner_str }} {{ pg_database_encoding_str }}
- name: "Preparing ALTER DATABASE command if database does not exist"
  when: database_is_present
  block:
    - name: "Setting optional attributes for ALTER DATABASE"
      ansible.builtin.set_fact:
        pg_database_owner_str: >-
          {{ ('OWNER TO "' ~ (pg_database_record.owner | string | replace('"', '""')) ~ '"') if (pg_database_record.owner is defined) else '' }}
    - name: "Assembling full ALTER DATABASE psql command"
      ansible.builtin.set_fact:
        pg_cli_command: >-
          /usr/pgsql-{{ pg_version }}/bin/psql postgres -p {{ pg_port }}
        pg_cli_sql: >-
          ALTER DATABASE "{{ pg_database | string | replace('"', '""') }}"
          {{ pg_database_owner_str }}
- name: "Ensuring database is present with correct parameters"
  become: true
  become_user: "{{ pg_os_user }}"
  ansible.builtin.command:
    cmd: "{{ pg_cli_command }}"
    stdin: "{{ pg_cli_sql }}"
  register: database_command_result
  changed_when: (not (database_is_present | bool)) or ((database_needs_update | default(false)) | bool)
  failed_when: database_command_result.rc != 0
  when: (not (database_is_present | bool)) or ((database_needs_update | default(false)) | bool)

- name: "Writing log"
  ansible.builtin.include_tasks: log_write.yml
  vars:
    iac_log_write: "Created database {{ pg_version }}/{{ pg_instance }}/{{ pg_database }}"
  when: database_command_result is defined and (database_command_result.changed | bool)

###############################################################################
# LOOPING THROUGH EXTENSIONS
###############################################################################

- name: "Looping through extensions"
  ansible.builtin.include_tasks: "extension_present.yml"
  loop: "{{ pg_extensions }}"
  loop_control:
    loop_var: pg_extension_record
