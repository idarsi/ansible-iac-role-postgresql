---
###############################################################################
#
# main.yml
#
# @author Arsi Atomi
#
###############################################################################

###############################################################################
# CHECKING REQUIREMENTS
###############################################################################

- name: "Checking if operating system is supported"
  ansible.builtin.fail:
    msg: "Unsupported operating system: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}"
  when: >
    iac_supported_os | selectattr('name', 'equalto', ansible_facts['distribution'])
                 | selectattr('versions', 'contains', ansible_facts['distribution_major_version'])
                 | list
                 | length == 0

- name: "Checking if service_key is found from variables"
  ansible.builtin.fail:
    msg: "iac_blueprint or iac_blueprint.postgresql is not defined"
  when:
    - iac_blueprint is not defined or iac_blueprint.postgresql is not defined

###############################################################################
# SETTING VARIABLES
###############################################################################

- name: "Setting variables"
  ansible.builtin.set_fact:
    pg_versions: "{{ iac_blueprint.postgresql }}"

- name: "Setting Python interpreter for DNF and RPM modules"
  ansible.builtin.set_fact:
    pg_package_module_interpreter: >-
      {{
        pg_el8_dnf_interpreter
        if
        (
          ansible_facts["os_family"] == "RedHat"
          and ansible_facts["distribution_major_version"] == "8"
        )
        else ansible_facts["python"]["executable"] | default('/usr/bin/python3')
      }}

- name: "Setting what instances are to be configured"
  ansible.builtin.set_fact:
    pg_instances: "{{ iac_blueprint.postgresql | subelements('instances', skip_missing=True) }}"
  when: iac_blueprint.postgresql | selectattr('instances', 'defined') | list | length > 0

###############################################################################
# VALIDATING INVENTORY
###############################################################################

- name: "Validating PostgreSQL inventory"
  ansible.builtin.include_tasks: validate/validate_inventory.yml

- name: "Validating destructive cleanup paths"
  ansible.builtin.include_tasks: validate/validate_cleanup.yml
  when: state in ['all_absent', 'instances_absent']

###############################################################################
# CHECKING PROXY
###############################################################################

- name: "Checking proxy address if it's defined"
  ansible.builtin.set_fact:
    pg_proxy_url: "{{ http_proxy if http_proxy | default('') | length > 0 else https_proxy }}"
  when: >
    (
      (http_proxy is defined and http_proxy != "")
      or (https_proxy is defined and https_proxy != "")
    )
    and (inventory_hostname not in (no_proxy | default("") | split(",")))
    and state != 'validate'

- name: "Deriving proxy connection details"
  ansible.builtin.set_fact:
    proxy_host: >-
      {{ (pg_proxy_url | regex_replace('^https?://', '')).rsplit(':', 1)[0] }}
    proxy_port: >-
      {{ (pg_proxy_url | regex_replace('^https?://', '')).rsplit(':', 1)[1] | int }}
  when: >
    (
      (http_proxy is defined and http_proxy != "")
      or (https_proxy is defined and https_proxy != "")
    )
    and (inventory_hostname not in (no_proxy | default("") | split(",")))
    and state != 'validate'

- name: "Checking that proxy connection is working if it's defined"
  ansible.builtin.wait_for:
    host: "{{ proxy_host }}"
    port: "{{ proxy_port }}"
    state: "started"
    timeout: 3
  when: >
    (
      (http_proxy is defined and http_proxy != "")
      or (https_proxy is defined and https_proxy != "")
    )
    and (inventory_hostname not in (no_proxy | default("") | split(",")))
    and state != 'validate'

###############################################################################
# CHECKING STATES
###############################################################################

- name: "STATE: Ensure PostgreSQL installations are present"
  ansible.builtin.include_tasks: install.yml
  when: state == 'install'

- name: "STATE: Update installed role-managed packages"
  ansible.builtin.include_tasks: update.yml
  when: state == 'update'

- name: "STATE: Ensure PostgreSQL installations are absent"
  ansible.builtin.include_tasks: uninstall.yml
  when: state == 'uninstall'

- name: "STATE: Ensure PostgreSQL installations and host-level remnants are absent"
  ansible.builtin.include_tasks: all_absent.yml
  when: state == 'all_absent'

- name: "STATE: Ensure PostgreSQL installations are present"
  ansible.builtin.include_tasks: present.yml
  when: state == 'present'

- name: "STATE: Ensure PostgreSQL installations are absent"
  ansible.builtin.include_tasks: absent.yml
  when: state == 'absent'

- name: "STATE: Ensure PostgreSQL instances are present"
  ansible.builtin.include_tasks: loop_instances.yml
  vars:
    pg_state: "{{ state }}"
  when: state == 'instances_present'

- name: "STATE: Ensure PostgreSQL instances are absent"
  ansible.builtin.include_tasks: loop_instances.yml
  vars:
    pg_state: "{{ state }}"
  when: state == 'instances_absent'

- name: "STATE: Ensure PostgreSQL instances are started"
  ansible.builtin.include_tasks: loop_instances.yml
  vars:
    pg_state: "{{ state }}"
  when: state == 'instances_started'

- name: "STATE: Ensure PostgreSQL instances are stopped"
  ansible.builtin.include_tasks: loop_instances.yml
  vars:
    pg_state: "{{ state }}"
  when: state == 'instances_stopped'

- name: "STATE: Ensure PostgreSQL instances are restarted"
  ansible.builtin.include_tasks: loop_instances.yml
  vars:
    pg_state: "{{ state }}"
  when: state == 'instances_restarted'

- name: "STATE: Ensure PostgreSQL replication is present"
  ansible.builtin.include_tasks: loop_instances.yml
  vars:
    pg_state: "{{ state }}"
  when: state == 'replication_present'

- name: "STATE: Ensure PostgreSQL clusters are present"
  ansible.builtin.include_tasks: loop_instances.yml
  vars:
    pg_state: "{{ state }}"
  when: state == 'clusters_present'

- name: "STATE: Ensure PostgreSQL database roles are present"
  ansible.builtin.include_tasks: loop_instances.yml
  vars:
    pg_state: "{{ state }}"
  when: state == 'roles_present'

- name: "STATE: Ensure PostgreSQL database roles are absent"
  ansible.builtin.include_tasks: loop_instances.yml
  vars:
    pg_state: "{{ state }}"
  when: state == 'roles_absent'

- name: "STATE: Ensure PostgreSQL databases are present"
  ansible.builtin.include_tasks: loop_instances.yml
  vars:
    pg_state: "{{ state }}"
  when: state == 'databases_present'

- name: "STATE: Ensure PostgreSQL databases are absent"
  ansible.builtin.include_tasks: loop_instances.yml
  vars:
    pg_state: "{{ state }}"
  when: state == 'databases_absent'

- name: "STATE: Ensure post_installs are present"
  ansible.builtin.include_tasks: loop_instances.yml
  vars:
    pg_state: "{{ state }}"
  when: state == 'post_installs_present'

- name: "STATE: Validate PostgreSQL inventory"
  ansible.builtin.debug:
    msg: "PostgreSQL inventory validation completed successfully"
  when: state == 'validate'
