---
###############################################################################
#
# repo_present_el10.yml
#
# @author Arsi Atomi
#
###############################################################################

- name: "Ensuring Rocky 10 CRB repository is enabled"
  ansible.builtin.command: "dnf config-manager --set-enabled crb"
  register: pg_crb_enable
  changed_when: false
  failed_when: false
  when:
    - ansible_facts["distribution"] == "Rocky"
    - pg_repofile_available is true

- name: "Falling back to repo file enablement for Rocky 10 CRB repository"
  ansible.builtin.include_tasks: repo_enable_in_file.yml
  vars:
    pg_repo_enable_file: "/etc/yum.repos.d/rocky.repo"
    pg_repo_enable_section: "crb"
  when:
    - ansible_facts["distribution"] == "Rocky"
    - pg_repofile_available is true
    - pg_crb_enable.rc != 0

- name: "Checking Rocky 10 CRB repository is enabled"
  ansible.builtin.command: "dnf repolist --enabled crb"
  register: pg_crb_repo_check
  changed_when: false
  failed_when: pg_crb_repo_check.rc != 0
  when:
    - ansible_facts["distribution"] == "Rocky"
    - pg_repofile_available is true

- name: "Ensuring PostgreSQL packages are excluded from EL10 AppStream"
  ansible.builtin.command: "dnf config-manager --setopt=appstream.exclude=postgresql* --save"
  register: pg_appstream_exclude
  changed_when: false
  failed_when:
    - pg_appstream_exclude.rc != 0
    - "'No matching repo to modify: appstream.' not in (pg_appstream_exclude.stderr | default(''))"
