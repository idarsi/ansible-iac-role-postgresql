---
###############################################################################
#
# replication_present.yml
#
# @author Arsi Atomi
#
###############################################################################

###############################################################################
# SETTING VARIABLES
###############################################################################

- name: "Setting what replication variables are configured"
  ansible.builtin.set_fact:
    pg_instance: "{{ pg_instance_record.1.name }}"
    pg_port: "{{ pg_instance_record.1.configuration.port | default(pg_default_port) }}"
    pg_replication: "{{ pg_instance_record.1.replication | default({}) }}"
    pg_version: "{{ pg_instance_record.0.version | string }}"
  when: pg_instance_record is defined

- name: "Setting detailed replication variables if defined"
  ansible.builtin.set_fact:
    pg_replication_enabled: "{{ (pg_replication | length) > 0 }}"
    pg_replication_role: "{{ pg_replication.role | default('off') }}"
    pg_replication_primary_host: "{{ pg_replication.primary_host | default('') }}"
    pg_replication_primary_port: "{{ pg_replication.primary_port | default(pg_default_port) }}"
    pg_replication_user: "{{ pg_replication.replication_user | default('') }}"
    pg_replication_password: "{{ pg_replication.replication_password | default('') }}"
    pg_replication_password_sql: "{{ pg_replication.replication_password | replace(\"'\", \"''\") }}"
    pg_replication_slot_name: "{{ pg_replication.slot_name | default('') }}"
    pg_replication_application_name: "{{ pg_replication.application_name | default(inventory_hostname) }}"
    pg_replication_hba_type_effective: "{{ pg_replication.hba_type | default(pg_replication_hba_type) }}"
    pg_replication_hba_method_effective: "{{ pg_replication.hba_method | default(pg_replication_hba_method) }}"
    pg_replication_sslmode_effective: "{{ pg_replication.sslmode | default(pg_replication_sslmode) }}"
    pg_replication_sslrootcert_effective: "{{ pg_replication.sslrootcert | default(pg_replication_sslrootcert) }}"
    pg_replication_sslrootcert_content_effective: "{{ pg_replication.sslrootcert_content | default(pg_replication_sslrootcert_content) }}"
    pg_replication_sslrootcert_src_effective: "{{ pg_replication.sslrootcert_src | default('') }}"
    pg_replication_wal_level_effective: "{{ pg_replication.wal_level | default(pg_replication_wal_level) }}"
    pg_replication_max_wal_senders_effective: "{{ pg_replication.max_wal_senders | default(pg_replication_max_wal_senders) }}"
    pg_replication_max_replication_slots_effective: "{{ pg_replication.max_replication_slots | default(pg_replication_max_replication_slots) }}"
    pg_replication_wal_keep_size_effective: "{{ pg_replication.wal_keep_size | default(pg_replication_wal_keep_size) }}"
    pg_replication_allowed_standby_addresses: "{{ pg_replication.allowed_standby_addresses | default([]) }}"
    pg_replication_reinitialize_effective: "{{ pg_replication.reinitialize | default(pg_replication_reinitialize) | bool }}"
    pg_data_directory: "{{ pg_bind_dir }}/{{ pg_version }}/{{ pg_instance }}"
    pg_service_name: "postgresql-{{ pg_version }}-{{ pg_instance }}.service"
  when: pg_replication is defined

- name: "Setting durable replication connection values"
  ansible.builtin.set_fact:
    pg_replication_pgpass_path: "{{ pg_data_directory }}/.pgpass"
    pg_replication_pgpass_line: >-
      *:*:*:{{ pg_replication_user | replace("\\", "\\\\") | replace(":", "\\:") }}:{{ pg_replication_password | replace("\\", "\\\\") | replace(":", "\\:") }}
    pg_replication_primary_conninfo: >-
      host={{ pg_replication_primary_host }} port={{ pg_replication_primary_port }}
      user={{ pg_replication_user }} application_name={{ pg_replication_application_name }}
      passfile={{ pg_data_directory }}/.pgpass sslmode={{ pg_replication_sslmode_effective }}
      sslrootcert={{ pg_replication_sslrootcert_effective }}
  when: pg_replication is defined

- name: "Setting durable standby pgpass path"
  ansible.builtin.set_fact:
    pg_replication_pgpass_path: "{{ pg_data_directory }}/.pgpass"
  when: pg_replication is defined

- name: "Checking if required replication variables are defined"
  ansible.builtin.assert:
    that:
      - pg_bind_dir is defined
      - pg_instance is defined
      - pg_port is defined
      - pg_version is defined
    fail_msg: "PostgreSQL replication state is missing required instance variables"

- name: "Validating replication configuration if defined"
  ansible.builtin.include_tasks: validate/validate_replication_record.yml
  when: pg_replication_enabled | default(false)

- name: "Rejecting unsafe replication CA destination path"
  ansible.builtin.assert:
    that:
      - pg_replication_sslrootcert_effective is match('^/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*$')
      - pg_replication_sslrootcert_effective.split('/') | select('equalto', '.') | list | length == 0
      - pg_replication_sslrootcert_effective.split('/') | select('equalto', '..') | list | length == 0
    fail_msg: "Replication sslrootcert must be a normalized absolute path without dot components"
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'

- name: "Checking replication CA destination parent is safe"
  ansible.builtin.stat:
    path: "{{ pg_replication_sslrootcert_effective | dirname }}"
    follow: false
  register: pg_replication_ca_destination_parent
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'

- name: "Rejecting unsafe replication CA destination"
  ansible.builtin.assert:
    that:
      - pg_replication_sslrootcert_effective is match('^/[A-Za-z0-9_./-]+$')
      - pg_replication_sslrootcert_effective not in ['/', '/etc', '/usr', '/var', '/tmp', '/home']
      - pg_replication_ca_destination_parent.stat.exists
      - pg_replication_ca_destination_parent.stat.isdir
      - not (pg_replication_ca_destination_parent.stat.islnk | default(false))
    fail_msg: "Replication sslrootcert must be a safe file below an existing non-symlink directory"
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'

- name: "Checking replication CA destination itself is not a symlink"
  ansible.builtin.stat:
    path: "{{ pg_replication_sslrootcert_effective }}"
    follow: false
  register: pg_replication_ca_destination_stat
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'

- name: "Rejecting pre-existing symlink at replication CA destination"
  ansible.builtin.assert:
    that:
      - not (pg_replication_ca_destination_stat.stat.islnk | default(false))
    fail_msg: "Replication sslrootcert destination must not be a symlink"
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'

- name: "Checking every replication CA destination component"
  ansible.builtin.command:
    argv:
      - namei
      - -mo
      - "{{ pg_replication_sslrootcert_effective | dirname }}"
  register: pg_replication_ca_destination_components
  changed_when: false
  failed_when: false
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'

- name: "Rejecting symlinked replication CA destination components"
  ansible.builtin.assert:
    that:
      - pg_replication_ca_destination_components.rc == 0
      - pg_replication_ca_destination_components.stdout is not search(' -> ')
    fail_msg: "Replication sslrootcert destination or one of its parent components must not be symlinked"
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'

- name: "Checking standby replication CA source before host mutation"
  ansible.builtin.stat:
    path: "{{ pg_replication_sslrootcert_src_effective }}"
    follow: false
  delegate_to: localhost
  register: pg_replication_ca_source_stat
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'
    - pg_replication_sslrootcert_src_effective | length > 0

- name: "Requiring standby replication CA source ownership and permissions"
  ansible.builtin.assert:
    that:
      - pg_replication_ca_source_stat.stat.exists
      - pg_replication_ca_source_stat.stat.isreg | default(false)
      - not (pg_replication_ca_source_stat.stat.islnk | default(false))
      - pg_replication_ca_source_stat.stat.uid | default(-1) == 0
      - (pg_replication_ca_source_stat.stat.mode | default('')) is match(pg_secure_source_mode_regex)
    fail_msg: "Replication CA source must be a root-owned, non-symlink regular file with owner-readable mode and no group/other write"
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'
    - pg_replication_sslrootcert_src_effective | length > 0

- name: "Reading standby replication CA source with descriptor-safe reader"
  ansible.builtin.command:
    argv:
      - "{{ pg_replication_python_executable }}"
      - "{{ role_path }}/files/read_secure_metadata.py"
      - "--uid"
      - "0"
      - "--mode"
      - "{{ pg_replication_ca_source_stat.stat.mode }}"
      - "--raw"
      - "{{ pg_replication_sslrootcert_src_effective }}"
  delegate_to: localhost
  register: pg_replication_ca_source_content
  changed_when: false
  no_log: true
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'
    - pg_replication_sslrootcert_content_effective | length == 0
    - pg_replication_sslrootcert_src_effective | length > 0

###############################################################################
# PRIMARY REPLICATION PREREQUISITES
###############################################################################

- name: "Checking primary PostgreSQL service state before replication setup" # noqa command-instead-of-module
  ansible.builtin.command: "systemctl is-active {{ pg_service_name }}"
  check_mode: false
  register: pg_primary_service_check
  changed_when: false
  failed_when: false
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'primary'

- name: "Checking primary service is running for replication setup"
  ansible.builtin.assert:
    that:
      - pg_primary_service_check.stdout == 'active'
    fail_msg: "PostgreSQL primary replication setup requires the instance service to be running"
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'primary'

- name: "Checking whether replication role already exists"
  become: true
  become_user: "{{ pg_os_user }}"
  ansible.builtin.command: >-
    /usr/pgsql-{{ pg_version }}/bin/psql postgres -p {{ pg_port }}
    -tXAc "SELECT 1 FROM pg_roles WHERE rolname='{{ pg_replication_user }}'"
  check_mode: false
  register: pg_replication_role_exists
  changed_when: false
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'primary'

- name: "Creating replication role if needed"
  become: true
  become_user: "{{ pg_os_user }}"
  ansible.builtin.command:
    cmd: >-
      /usr/pgsql-{{ pg_version }}/bin/psql postgres -p {{ pg_port }}
    stdin: >-
      CREATE ROLE "{{ pg_replication_user }}" WITH LOGIN REPLICATION
      PASSWORD '{{ pg_replication_password_sql }}'
  register: pg_replication_role_create
  changed_when: pg_replication_role_create.rc == 0
  no_log: true
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'primary'
    - pg_replication_role_exists.stdout != '1'

- name: "Altering replication role if it already exists"
  become: true
  become_user: "{{ pg_os_user }}"
  ansible.builtin.command:
    cmd: >-
      /usr/pgsql-{{ pg_version }}/bin/psql postgres -p {{ pg_port }}
    stdin: >-
      ALTER ROLE "{{ pg_replication_user }}" WITH LOGIN REPLICATION
      PASSWORD '{{ pg_replication_password_sql }}'
  register: pg_replication_role_alter
  changed_when: false
  no_log: true
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'primary'
    - pg_replication_role_exists.stdout == '1'

- name: "Writing log"
  ansible.builtin.include_tasks: log_write.yml
  vars:
    iac_log_write: "Ensured replication role {{ pg_version }}/{{ pg_instance }}/{{ pg_replication_user }}"
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'primary'

- name: "Checking whether replication slot already exists"
  become: true
  become_user: "{{ pg_os_user }}"
  ansible.builtin.command: >-
    /usr/pgsql-{{ pg_version }}/bin/psql postgres -p {{ pg_port }}
    -tXAc "SELECT 1 FROM pg_replication_slots WHERE slot_name='{{ pg_replication_slot_name }}'"
  check_mode: false
  register: pg_replication_slot_exists
  changed_when: false
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'primary'
    - pg_replication_slot_name | length > 0

- name: "Creating physical replication slot if needed"
  become: true
  become_user: "{{ pg_os_user }}"
  ansible.builtin.command: >-
    /usr/pgsql-{{ pg_version }}/bin/psql postgres -p {{ pg_port }}
    -c "SELECT * FROM pg_create_physical_replication_slot('{{ pg_replication_slot_name }}')"
  register: pg_replication_slot_create
  changed_when: pg_replication_slot_create.rc == 0
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'primary'
    - pg_replication_slot_name | length > 0
    - pg_replication_slot_exists.stdout != '1'

- name: "Writing log"
  ansible.builtin.include_tasks: log_write.yml
  vars:
    iac_log_write: "Ensured replication slot {{ pg_version }}/{{ pg_instance }}/{{ pg_replication_slot_name }}"
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'primary'
    - pg_replication_slot_name | length > 0

###############################################################################
# STANDBY REPLICATION BOOTSTRAP
###############################################################################

- name: "Checking whether standby data directory is initialized"
  ansible.builtin.stat:
    path: "{{ pg_data_directory }}/PG_VERSION"
  register: pg_standby_data_directory
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'

- name: "Stopping standby service before basebackup when needed"
  ansible.builtin.systemd_service:
    name: "{{ pg_service_name }}"
    state: stopped
    enabled: true
    masked: false
  failed_when: false
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'
    - pg_replication_reinitialize_effective or not pg_standby_data_directory.stat.exists

- name: "Removing standby data directory before basebackup when needed"
  ansible.builtin.file:
    path: "{{ pg_data_directory }}"
    state: absent
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'
    - pg_replication_reinitialize_effective or not pg_standby_data_directory.stat.exists

- name: "Ensuring standby data directory exists before basebackup"
  ansible.builtin.file:
    path: "{{ pg_data_directory }}"
    state: directory
    owner: "{{ pg_os_user }}"
    group: "{{ pg_os_group }}"
    mode: "0700"
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'
    - pg_replication_reinitialize_effective or not pg_standby_data_directory.stat.exists

- name: "Setting pg_basebackup arguments"
  ansible.builtin.set_fact:
    pg_basebackup_argv: >-
      {{ [
        '/usr/pgsql-' ~ pg_version ~ '/bin/pg_basebackup', '-h', pg_replication_primary_host,
        '-p', pg_replication_primary_port | string, '-D', pg_data_directory, '-U', pg_replication_user,
        '--dbname', 'host=' ~ pg_replication_primary_host ~ ' port=' ~ (pg_replication_primary_port | string)
         ~ ' user=' ~ pg_replication_user
           ~ ' sslmode=' ~ pg_replication_sslmode_effective ~ ' sslrootcert=' ~ pg_replication_sslrootcert_effective, '-X', 'stream', '-R'
      ] + (['-S', pg_replication_slot_name] if pg_replication_slot_name | length > 0 else []) }}
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'
    - pg_replication_reinitialize_effective or not pg_standby_data_directory.stat.exists

- name: "Checking standby replication TLS contract"
  ansible.builtin.assert:
    that:
      - pg_replication_sslmode_effective == 'verify-full'
      - pg_replication_sslrootcert_effective is match('^/')
    fail_msg: "Standby replication requires sslmode=verify-full and an absolute sslrootcert"
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'

- name: "Installing managed standby replication CA certificate from content"
  ansible.builtin.copy:
    content: "{{ pg_replication_sslrootcert_content_effective }}"
    dest: "{{ pg_replication_sslrootcert_effective }}"
    owner: "{{ pg_os_user }}"
    group: "{{ pg_os_group }}"
    mode: "0600"
  no_log: true
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'
    - pg_replication_sslrootcert_content_effective | length > 0

- name: "Installing managed standby replication CA certificate from source"
  ansible.builtin.copy:
    content: "{{ pg_replication_ca_source_content.stdout }}"
    dest: "{{ pg_replication_sslrootcert_effective }}"
    owner: "{{ pg_os_user }}"
    group: "{{ pg_os_group }}"
    mode: "0600"
  no_log: true
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'
    - pg_replication_sslrootcert_content_effective | length == 0
    - pg_replication_sslrootcert_src_effective | length > 0

- name: "Checking standby replication CA certificate"
  ansible.builtin.stat:
    path: "{{ pg_replication_sslrootcert_effective }}"
  register: pg_replication_sslrootcert_stat
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'
    - pg_replication_reinitialize_effective or not pg_standby_data_directory.stat.exists

- name: "Requiring standby replication CA certificate"
  ansible.builtin.assert:
    that:
      - pg_replication_sslrootcert_stat.stat.exists
      - pg_replication_sslrootcert_stat.stat.isreg
    fail_msg: "Standby replication sslrootcert must point to an existing regular CA certificate"
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'
    - pg_replication_reinitialize_effective or not pg_standby_data_directory.stat.exists

- name: "Bootstrapping standby with a temporary pgpass"
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'
    - pg_replication_reinitialize_effective or not pg_standby_data_directory.stat.exists
  block:
    - name: "Creating temporary secure pgpass outside standby target"
      ansible.builtin.tempfile:
        path: "/tmp"
        state: file
        prefix: "postgresql-bootstrap-"
      register: pg_replication_bootstrap_pgpass
      become: true
      become_user: "{{ pg_os_user }}"

    - name: "Writing temporary bootstrap pgpass"
      ansible.builtin.copy:
        content: "{{ pg_replication_pgpass_line }}\n"
        dest: "{{ pg_replication_bootstrap_pgpass.path }}"
        owner: "{{ pg_os_user }}"
        group: "{{ pg_os_group }}"
        mode: "0600"
      no_log: true

    - name: "Checking temporary bootstrap pgpass permissions"
      ansible.builtin.stat:
        path: "{{ pg_replication_bootstrap_pgpass.path }}"
        follow: false
      register: pg_replication_bootstrap_pgpass_stat
      become: true
      become_user: "root"

    - name: "Requiring restrictive temporary bootstrap pgpass permissions"
      ansible.builtin.assert:
        that:
          - pg_replication_bootstrap_pgpass_stat.stat.isreg
          - pg_replication_bootstrap_pgpass_stat.stat.mode == '0600'
        fail_msg: "Temporary PostgreSQL bootstrap credentials must be a regular mode-0600 file"
      no_log: true

    - name: "Running pg_basebackup for standby"
      become: true
      become_user: "{{ pg_os_user }}"
      ansible.builtin.command:
        argv: "{{ pg_basebackup_argv }}"
      environment:
        PGAPPNAME: "{{ pg_replication_application_name }}"
        PGPASSFILE: "{{ pg_replication_bootstrap_pgpass.path }}"
      register: pg_basebackup_result
      changed_when: pg_basebackup_result.rc == 0
      no_log: true
  always:
    - name: "Securely removing temporary standby bootstrap pgpass"
      become: true
      become_user: "root"
      ansible.builtin.command:
        argv:
          - shred
          - --remove=unlink
          - --zero
          - "{{ pg_replication_bootstrap_pgpass.path }}"
      register: pg_replication_bootstrap_pgpass_cleanup
      changed_when: pg_replication_bootstrap_pgpass_cleanup.rc == 0
      failed_when: false
      no_log: true
      when:
        - pg_replication_bootstrap_pgpass is defined
        - pg_replication_bootstrap_pgpass.path is defined

    - name: "Removing bootstrap pgpass when secure shredding is unavailable"
      become: true
      become_user: "root"
      ansible.builtin.file:
        path: "{{ pg_replication_bootstrap_pgpass.path }}"
        state: absent
      register: pg_replication_bootstrap_pgpass_fallback_cleanup
      failed_when: false
      no_log: true
      when:
        - pg_replication_bootstrap_pgpass_cleanup is defined
        - pg_replication_bootstrap_pgpass_cleanup.rc != 0
        - pg_replication_bootstrap_pgpass is defined
        - pg_replication_bootstrap_pgpass.path is defined

    - name: "Checking temporary standby bootstrap pgpass was removed"
      ansible.builtin.stat:
        path: "{{ pg_replication_bootstrap_pgpass.path }}"
        follow: false
      register: pg_replication_bootstrap_pgpass_after_cleanup
      failed_when: false
      no_log: true
      when:
        - pg_replication_bootstrap_pgpass is defined
        - pg_replication_bootstrap_pgpass.path is defined

    - name: "Reporting temporary bootstrap pgpass cleanup failure safely"
      ansible.builtin.assert:
        that:
          - not pg_replication_bootstrap_pgpass_after_cleanup.stat.exists
        fail_msg: "Temporary PostgreSQL bootstrap credential cleanup failed; no credential contents were logged"
      when:
        - pg_replication_bootstrap_pgpass_after_cleanup is defined
- name: "Reconciling durable standby pgpass"
  ansible.builtin.stat:
    path: "{{ pg_replication_pgpass_path }}"
    follow: false
  register: pg_replication_pgpass_stat
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'

- name: "Rejecting symlinked durable standby pgpass"
  ansible.builtin.assert:
    that:
      - not (pg_replication_pgpass_stat.stat.islnk | default(false))
    fail_msg: "Standby pgpass destination must not be a symlink"
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'

- name: "Checking every durable pgpass parent component"
  ansible.builtin.command:
    argv:
      - namei
      - -mo
      - "{{ pg_data_directory }}"
  register: pg_replication_pgpass_parent_check
  changed_when: false
  failed_when: false
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'

- name: "Rejecting unsafe durable pgpass parent components"
  ansible.builtin.assert:
    that:
      - pg_data_directory is match('^/')
      - pg_replication_pgpass_parent_check.rc == 0
      - pg_replication_pgpass_parent_check.stdout is not search(' -> ')
    fail_msg: "PostgreSQL data directory or one of its parent components is missing or symlinked"
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'

- name: "Reconciling durable standby pgpass"
  ansible.builtin.copy:
    content: "{{ pg_replication_pgpass_line }}\n"
    dest: "{{ pg_replication_pgpass_path }}"
    owner: "{{ pg_os_user }}"
    group: "{{ pg_os_group }}"
    mode: "0600"
  no_log: true
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'

- name: "Reconciling durable standby primary_conninfo"
  ansible.builtin.lineinfile:
    path: "{{ pg_data_directory }}/postgresql.auto.conf"
    regexp: '^primary_conninfo\\s*='
    line: "primary_conninfo = '{{ pg_replication_primary_conninfo | replace(\"'\", \"''\") }}'"
    owner: "{{ pg_os_user }}"
    group: "{{ pg_os_group }}"
    mode: "0600"
    create: true
  no_log: true
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'

- name: "Ensuring standby.signal exists after basebackup"
  ansible.builtin.stat:
    path: "{{ pg_data_directory }}/standby.signal"
  register: pg_standby_signal
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'

- name: "Checking standby bootstrap result"
  ansible.builtin.assert:
    that:
      - pg_standby_signal.stat.exists
    fail_msg: "PostgreSQL standby bootstrap did not create standby.signal"
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'
    - pg_replication_reinitialize_effective or not pg_standby_data_directory.stat.exists

- name: "Writing log"
  ansible.builtin.include_tasks: log_write.yml
  vars:
    iac_log_write: "Ensured standby replication bootstrap {{ pg_version }}/{{ pg_instance }}"
  when:
    - pg_replication_enabled | default(false)
    - pg_replication_role == 'standby'
