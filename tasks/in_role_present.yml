---
###############################################################################
#
# in_role_present.yml
#
# @author Arsi Atomi
#
###############################################################################

###############################################################################
# SETTING VARIABLES
###############################################################################

- name: "Setting what variables are configured"
  ansible.builtin.set_fact:
    pg_db_role: "{{ pg_role_record.name }}"
  when: pg_role_record is defined

- name: "Checking if required variables are defined"
  ansible.builtin.assert:
    that:
      - pg_db_role is defined
      - pg_grant_role is defined
      - pg_instance is defined
      - pg_port is defined
      - pg_version is defined
    fail_msg: "PostgreSQL role grant state is missing one or more required variables"

###############################################################################
# GRANTING ROLE
###############################################################################

- name: "Assembling role membership check command"
  ansible.builtin.set_fact:
    pg_cli_command: >-
      /usr/pgsql-{{ pg_version }}/bin/psql postgres -p {{ pg_port }}
      -tXAc "SELECT 1 FROM pg_auth_members m
      JOIN pg_roles granted_role ON granted_role.oid = m.roleid
      JOIN pg_roles member_role ON member_role.oid = m.member
      WHERE granted_role.rolname='{{ pg_grant_role | string | replace("'", "''") }}'
      AND member_role.rolname='{{ pg_db_role | string | replace("'", "''") }}'"

- name: "Checking whether role membership exists"
  become: true
  become_user: "{{ pg_os_user }}"
  ansible.builtin.command: "{{ pg_cli_command }}"
  check_mode: false
  register: pg_grant_exists
  changed_when: false
  failed_when: pg_grant_exists.rc != 0

- name: "Assembling role grant command"
  ansible.builtin.set_fact:
    pg_cli_command: >-
      /usr/pgsql-{{ pg_version }}/bin/psql postgres -p {{ pg_port }}
    pg_cli_sql: >-
      GRANT "{{ pg_grant_role | string | replace('"', '""') }}" TO
      "{{ pg_db_role | string | replace('"', '""') }}"

- name: "Ensuring role is granted to role"
  become: true
  become_user: "{{ pg_os_user }}"
  ansible.builtin.command:
    cmd: "{{ pg_cli_command }}"
    stdin: "{{ pg_cli_sql }}"
  register: cli_changed
  changed_when: "cli_changed.rc == 0"
  failed_when: "cli_changed.rc != 0"
  when: pg_grant_exists.stdout | trim != '1'

- name: "Writing log"
  ansible.builtin.include_tasks: log_write.yml
  vars:
    iac_log_write: "Granted role {{ pg_grant_role }} to {{ pg_version }}/{{ pg_instance }}/{{ pg_db_role }}"
