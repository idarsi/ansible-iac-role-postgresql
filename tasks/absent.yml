---
###############################################################################
#
# absent.yml
#
# @author Arsi Atomi
#
###############################################################################

###############################################################################
# SETTING VARIABLES
###############################################################################

- name: "Checking if required variables are defined"
  ansible.builtin.assert:
    that:
      - dnf_sslverify is defined
      - dnf_validate_certs is defined
      - dnf_disable_gpg_check is defined
      - pg_lang is defined
      - pg_versions is defined
    fail_msg: "All tests did not pass"

###############################################################################
# LOOPING THROUGH VERSIONS TO BE REMOVED
###############################################################################

- name: "Looping through versions"
  ansible.builtin.include_tasks: "version_absent.yml"
  loop: "{{ pg_versions }}"
  loop_control:
    loop_var: pg_version_record

- name: "Setting PostgreSQL bind mount variables for removal"
  ansible.builtin.set_fact:
    iac_fs_binds:
      - source: "{{ pg_real_dir }}"
        target: "{{ pg_bind_dir }}"
        purge_on_absent: true
  when:
    - pg_real_dir is defined
    - pg_bind_dir is defined
    - pg_real_dir != pg_bind_dir

- name: "Ensuring PostgreSQL bind mount configuration is absent"
  ansible.builtin.include_tasks: bind_absent.yml
  when:
    - iac_fs_binds is defined
    - (iac_fs_binds | default([])) | length > 0
