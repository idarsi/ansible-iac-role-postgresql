---
###############################################################################
#
# instances_present.yml
#
# @author Arsi Atomi
#
###############################################################################

###############################################################################
# SETTING VARIABLES
###############################################################################

- name: "Setting what variables are configured"
  ansible.builtin.set_fact:
    pg_autotuning: "{{ pg_instance_record.1.autotuning_profile | default('off') }}"
    pg_client_certificate_authority_content: "{{ pg_instance_record.1.client_certificate_authority_content | default(omit) }}"
    pg_client_certificate_authority_enabled: false
    pg_client_certificate_authority_src: "{{ pg_instance_record.1.client_certificate_authority_src | default(omit) }}"
    pg_configuration: "{{ pg_instance_record.1.configuration | default(omit) }}"
    pg_databases: "{{ pg_instance_record.1.databases | default([]) }}"
    pg_global_access: "{{ pg_instance_record.1.global_access | default([]) }}"
    pg_instance: "{{ pg_instance_record.1.name }}"
    pg_max_connections: "{{ pg_instance_record.1.configuration.max_connections | default(pg_default_max_connections) }}"
    pg_port: "{{ pg_instance_record.1.configuration.port | default(pg_default_port) }}"
    pg_profile: "{{ pg_instance_record.1.configuration_profile | default(omit) }}"
    pg_maprole: "{{ pg_instance_record.1.maprole | default([]) }}"
    pg_replication: "{{ pg_instance_record.1.replication | default({}) }}"
    pg_cluster: >-
      {{
        (
          pg_instance_record.0.clusters | default([])
          | selectattr('name', 'equalto', pg_instance_record.1.cluster)
          | list | first
        ) | default({})
      }}
    pg_security: "{{ pg_instance_record.1.security_profile | default('off') }}"
    pg_version: "{{ pg_instance_record.0.version | string }}"
  when: pg_instance_record is defined

- name: "Setting PostgreSQL cluster provider"
  ansible.builtin.set_fact:
    pg_cluster_provider: "{{ pg_cluster.provider | default('standalone') }}"
  when: pg_instance_record is defined

- name: "Setting tuning profile if tuning is defined"
  ansible.builtin.set_fact:
    pg_autotuning_cpu: "{{ pg_instance_record.1.autotuning_cpu | default(pg_autotuning) }}"
    pg_autotuning_memory: "{{ pg_instance_record.1.autotuning_memory | default(pg_autotuning) }}"
  when: pg_autotuning is defined

- name: "Setting security profile if defined"
  ansible.builtin.set_fact:
    pg_security_log: "{{ pg_instance_record.1.security_log | default(pg_security) }}"
    pg_security_ssl: "{{ pg_instance_record.1.security_ssl | default(pg_security) }}"
    pg_security_syslog: "{{ pg_instance_record.1.security_syslog | default(pg_security) }}"
  when: pg_security is defined

- name: "Determining requested shared preload libraries"
  ansible.builtin.set_fact:
    pg_shared_preload_libraries_requested: |-
      {% set ns = namespace(libraries=[]) %}
      {% set configured = pg_configuration.shared_preload_libraries | default([]) if pg_configuration is defined else [] %}
      {% if configured is string %}
      {% set configured = configured.split(',') %}
      {% endif %}
      {% for library in pg_shared_preload_libraries | default([]) %}
      {% if library | string | trim | length > 0 %}
      {% set ns.libraries = ns.libraries + [library | string | trim] %}
      {% endif %}
      {% endfor %}
      {% for library in configured %}
      {% if library | string | trim | length > 0 %}
      {% set ns.libraries = ns.libraries + [library | string | trim] %}
      {% endif %}
      {% endfor %}
      {% for database in pg_databases %}
      {% for extension in database.extensions | default([]) %}
      {% if extension.name == 'timescaledb' and 'timescaledb' not in ns.libraries %}
      {% set ns.libraries = ns.libraries + ['timescaledb'] %}
      {% endif %}
      {% endfor %}
      {% endfor %}
      {{ ns.libraries | unique | join(',') }}

- name: "Preparing effective PostgreSQL configuration"
  ansible.builtin.set_fact:
    pg_configuration_effective: >-
      {{
        (pg_configuration | default({}))
        | combine(
            {'shared_preload_libraries': pg_shared_preload_libraries_requested},
            recursive=false
          )
        if pg_shared_preload_libraries_requested | trim | length > 0
        else (pg_configuration | default({}))
      }}

- name: "Setting replication variables if defined"
  ansible.builtin.set_fact:
    pg_replication_enabled: "{{ (pg_replication | length) > 0 }}"
    pg_replication_role: "{{ pg_replication.role | default('off') }}"
    pg_replication_primary_host: "{{ pg_replication.primary_host | default('') }}"
    pg_replication_primary_port: "{{ pg_replication.primary_port | default(pg_default_port) }}"
    pg_replication_user: "{{ pg_replication.replication_user | default('') }}"
    pg_replication_password: "{{ pg_replication.replication_password | default('') }}"
    pg_replication_slot_name: "{{ pg_replication.slot_name | default('') }}"
    pg_replication_application_name: "{{ pg_replication.application_name | default(inventory_hostname) }}"
    pg_replication_allowed_standby_addresses: "{{ pg_replication.allowed_standby_addresses | default([]) }}"
    pg_replication_hba_type_effective: "{{ pg_replication.hba_type | default(pg_replication_hba_type) }}"
    pg_replication_hba_method_effective: "{{ pg_replication.hba_method | default(pg_replication_hba_method) }}"
    pg_replication_wal_level_effective: "{{ pg_replication.wal_level | default(pg_replication_wal_level) }}"
    pg_replication_max_wal_senders_effective: "{{ pg_replication.max_wal_senders | default(pg_replication_max_wal_senders) }}"
    pg_replication_max_replication_slots_effective: "{{ pg_replication.max_replication_slots | default(pg_replication_max_replication_slots) }}"
    pg_replication_wal_keep_size_effective: "{{ pg_replication.wal_keep_size | default(pg_replication_wal_keep_size) }}"
  when: pg_replication is defined

- name: "Validating replication configuration if defined"
  ansible.builtin.include_tasks: validate/validate_replication_record.yml
  when: pg_replication_enabled | default(false)

- name: "Ensuring Patroni configuration is present"
  ansible.builtin.include_tasks: patroni_present.yml
  when: pg_cluster_provider == 'patroni'

- name: "Setting certificate variables if security_ssl is not off"
  ansible.builtin.set_fact:
    pg_certificate_private_key_fullpath: "{{ pg_default_dir }}/{{ pg_version }}/{{ pg_instance }}/ssl/{{ pg_certificate_private_key_path }}"
    pg_certificate_public_key_fullpath: "{{ pg_default_dir }}/{{ pg_version }}/{{ pg_instance }}/ssl/{{ pg_certificate_public_key_path }}"
    pg_client_certificate_authority_fullpath: "{{ pg_default_dir }}/{{ pg_version }}/{{ pg_instance }}/ssl/{{ pg_client_certificate_authority_path }}"
    pg_client_certificate_authority_enabled: >-
      {{
        (pg_client_certificate_authority_content is defined)
        or
        (pg_client_certificate_authority_src is defined)
      }}
  when: pg_security_ssl != 'off'

- name: "Checking whether client certificate authentication is required"
  ansible.builtin.set_fact:
    pg_client_certificate_auth_required: |-
      {% set ns = namespace(required=false) %}
      {% for item in pg_global_access %}
      {% if item.method | default('scram-sha-256') == 'cert' or item.clientcert is defined or item.clientname is defined or item.map is defined %}
      {% set ns.required = true %}
      {% endif %}
      {% endfor %}
      {% for database in pg_databases %}
      {% for item in database.access | default([]) %}
      {% if item.method | default('scram-sha-256') == 'cert' or item.clientcert is defined or item.clientname is defined or item.map is defined %}
      {% set ns.required = true %}
      {% endif %}
      {% endfor %}
      {% endfor %}
      {{ ns.required | bool }}

- name: "Checking if required variables are defined"
  ansible.builtin.assert:
    that:
      - pg_autotuning is defined
      - pg_bind_dir is defined
      - pg_encoding is defined
      - pg_instance is defined
      - pg_lc_collate is defined
      - pg_lc_ctype is defined
      - pg_os_user is defined
      - pg_security is defined
      - pg_systemd_service_dir is defined
      - pg_version is defined
      - >-
        not pg_client_certificate_auth_required | bool
        or
        pg_client_certificate_authority_enabled | bool
    fail_msg: >-
      PostgreSQL instance configuration is missing required values or certificate-aware
      authentication is enabled without a configured client CA

- name: "Checking pg_ident map records"
  ansible.builtin.assert:
    that:
      - item.mapname is defined
      - item.system_username is defined
      - item.pg_username is defined
    fail_msg: "PostgreSQL pg_ident map record is missing required fields"
  loop: "{{ pg_maprole }}"
  when: pg_maprole | length > 0

- name: "Checking global pg_hba access records"
  ansible.builtin.include_tasks: validate/validate_hba_access_record.yml
  loop: "{{ pg_global_access }}"
  loop_control:
    loop_var: pg_hba_access_record
  vars:
    pg_hba_access_type: "{{ pg_hba_access_record.type | default('host') }}"
    pg_hba_access_uses_client_certificate: >-
      {{
        (pg_hba_access_record.method | default('scram-sha-256')) == 'cert'
        or
        (pg_hba_access_record.clientcert is defined)
        or
        (pg_hba_access_record.clientname is defined)
        or
        (pg_hba_access_record.map is defined)
      }}

- name: "Checking database-specific pg_hba access records"
  ansible.builtin.include_tasks: validate/validate_hba_access_record.yml
  loop: "{{ pg_databases | subelements('access', skip_missing=True) }}"
  loop_control:
    loop_var: pg_hba_database_access_record
  vars:
    pg_hba_access_record: "{{ pg_hba_database_access_record.1 }}"
    pg_hba_access_type: "{{ pg_hba_access_record.type | default('host') }}"
    pg_hba_access_uses_client_certificate: >-
      {{
        (pg_hba_access_record.method | default('scram-sha-256')) == 'cert'
        or
        (pg_hba_access_record.clientcert is defined)
        or
        (pg_hba_access_record.clientname is defined)
        or
        (pg_hba_access_record.map is defined)
      }}

###############################################################################
# ENSURING INSTANCE IS PRESENT
###############################################################################

- name: "Checking if PostgreSQL has instance initialized"
  ansible.builtin.stat:
    path: "{{ pg_bind_dir }}/{{ pg_version }}/{{ pg_instance }}/pg_hba.conf"
  register: postgres_data

- name: "Setting log variables"
  ansible.builtin.set_fact:
    pg_cli_command: >
      /usr/pgsql-{{ pg_version }}/bin/initdb
      -D {{ pg_bind_dir }}/{{ pg_version }}/{{ pg_instance }}
      -E {{ pg_encoding }}
      --lc-collate={{ pg_lc_collate }}
      --lc-ctype={{ pg_lc_ctype }}
      -k
  when: not postgres_data.stat.exists

- name: "Ensuring instance is present"
  become: true
  become_user: "{{ pg_os_user }}"
  ansible.builtin.command: "{{ pg_cli_command }}"
  register: my_output
  changed_when: my_output.rc == 0
  failed_when: my_output.rc != 0
  when: not postgres_data.stat.exists

- name: "Writing log"
  ansible.builtin.include_tasks: log_write.yml
  vars:
    iac_log_write: "Installed instance {{ pg_version }}/{{ pg_instance }}"
  when: not postgres_data.stat.exists

###############################################################################
# ENSURING CONFIGURATION DIRECTORY EXISTS IF NEEDED
###############################################################################

- name: "Ensuring directory conf.d is present"
  ansible.builtin.file:
    path: "{{ pg_bind_dir }}/{{ pg_version }}/{{ pg_instance }}/conf.d"
    state: directory
    owner: "{{ pg_os_user }}"
    group: "{{ pg_os_group }}"
    mode: "0750"

- name: "Ensuring PostgreSQL configuration has include_dir to conf.d"
  ansible.builtin.lineinfile:
    path: "{{ pg_bind_dir }}/{{ pg_version }}/{{ pg_instance }}/postgresql.conf"
    line: include_dir = 'conf.d'
    create: true
    owner: "{{ pg_os_user }}"
    group: "{{ pg_os_group }}"
    mode: "0600"

###############################################################################
# ENSURING PROFILE CONFIGURATION EXISTS IF NEEDED
###############################################################################

- name: "Rendering profile configuration from selected template"
  ansible.builtin.template:
    src: "profile-{{ pg_profile }}.conf.j2"
    dest: "{{ pg_bind_dir }}/{{ pg_version }}/{{ pg_instance }}/conf.d/40-profile.conf"
    owner: "{{ pg_os_user }}"
    group: "{{ pg_os_group }}"
    mode: "0640"
  when: pg_profile is defined

- name: "Writing log"
  ansible.builtin.include_tasks: log_write.yml
  vars:
    iac_log_write: "Created {{ pg_bind_dir }}/{{ pg_version }}/{{ pg_instance }}/conf.d/40-profile.conf"
  when: pg_profile is defined

###############################################################################
# ENSURING SECURITY PROFILE EXISTS IF NEEDED
###############################################################################

- name: "Rendering security configuration from selected template"
  ansible.builtin.template:
    src: "security-profile-{{ pg_security }}.conf.j2"
    dest: "{{ pg_bind_dir }}/{{ pg_version }}/{{ pg_instance }}/conf.d/41-security.conf"
    owner: "{{ pg_os_user }}"
    group: "{{ pg_os_group }}"
    mode: "0640"
  when: pg_security is defined

- name: "Writing log"
  ansible.builtin.include_tasks: log_write.yml
  vars:
    iac_log_write: "Created {{ pg_bind_dir }}/{{ pg_version }}/{{ pg_instance }}/conf.d/41-security.conf"
  when: pg_security is defined

###############################################################################
# ENSURING SSL CERTIFICATE EXISTS IF NEEDED
###############################################################################

- name: "Ensure certification is present"
  ansible.builtin.include_tasks: "certification_present.yml"
  when: pg_security_ssl != 'off'

###############################################################################
# OTHER SECURITY MEASURES
###############################################################################

- name: "Ensuring umask=077 exists in postgres users .bash_profile"
  ansible.builtin.lineinfile:
    path: "{{ pg_bind_dir }}/.bash_profile"
    line: "umask 077"
    state: present
    insertafter: EOF
    create: true
    mode: "0600"
    owner: "{{ pg_os_user }}"
    group: "{{ pg_os_group }}"
  when: pg_security != 'off'

###############################################################################
# ENSURING INVENTORY CONFIGURATION EXISTS IF NEEDED
###############################################################################

- name: "Rendering configuration lines"
  ansible.builtin.set_fact:
    rendered_lines: |
      {% for item in pg_configuration_effective | dict2items if item.value is not none %}
      {% if item.value is string %}
      {{ item.key }} = '{{ item.value }}'
      {% else %}
      {{ item.key }} = {{ item.value }}
      {% endif %}
      {% endfor %}
  when:
    - pg_configuration is defined or pg_shared_preload_libraries_requested | trim | length > 0

- name: "Ensuring PostgreSQL configuration in changes.conf matches template"
  ansible.builtin.copy:
    content: "{{ rendered_lines }}"
    dest: "{{ pg_bind_dir }}/{{ pg_version }}/{{ pg_instance }}/conf.d/42-inventory.conf"
    mode: "0640"
    owner: "{{ pg_os_user }}"
    group: "{{ pg_os_group }}"
  when: rendered_lines is defined

- name: "Writing log"
  ansible.builtin.include_tasks: log_write.yml
  vars:
    iac_log_write: "Created {{ pg_bind_dir }}/{{ pg_version }}/{{ pg_instance }}/conf.d/42-inventory.conf"
  when: rendered_lines is defined

###############################################################################
# ENSURING AUTOTUNING CONFIGURATION EXISTS IF NEEDED
###############################################################################

- name: "Rendering autotuning configuration from selected template"
  ansible.builtin.template:
    src: "autotuning-profile-{{ pg_autotuning }}.conf.j2"
    dest: "{{ pg_bind_dir }}/{{ pg_version }}/{{ pg_instance }}/conf.d/43-autotuning.conf"
    mode: "0640"
    owner: "{{ pg_os_user }}"
    group: "{{ pg_os_group }}"
  when: pg_autotuning is defined

- name: "Writing log"
  ansible.builtin.include_tasks: log_write.yml
  vars:
    iac_log_write: "Created {{ pg_bind_dir }}/{{ pg_version }}/{{ pg_instance }}/conf.d/43-autotuned.conf"
  when: pg_autotuning is defined

###############################################################################
# ENSURING REPLICATION CONFIGURATION EXISTS IF NEEDED
###############################################################################

- name: "Rendering replication configuration from selected template"
  ansible.builtin.template:
    src: "replication.conf.j2"
    dest: "{{ pg_bind_dir }}/{{ pg_version }}/{{ pg_instance }}/conf.d/44-replication.conf"
    mode: "0640"
    owner: "{{ pg_os_user }}"
    group: "{{ pg_os_group }}"
  when: pg_replication_enabled | default(false)

- name: "Removing replication configuration when not configured"
  ansible.builtin.file:
    path: "{{ pg_bind_dir }}/{{ pg_version }}/{{ pg_instance }}/conf.d/44-replication.conf"
    state: absent
  when: not (pg_replication_enabled | default(false))

- name: "Writing log"
  ansible.builtin.include_tasks: log_write.yml
  vars:
    iac_log_write: "Created {{ pg_bind_dir }}/{{ pg_version }}/{{ pg_instance }}/conf.d/44-replication.conf"
  when: pg_replication_enabled | default(false)

###############################################################################
# ENSURING DEFAULT PG_HBA.CONF IS DELETED AND NEW WRITTEN
###############################################################################

- name: "Ensuring pg_hba.conf base content is present"
  ansible.builtin.template:
    src: "pg_hba.conf.j2"
    dest: "{{ pg_bind_dir }}/{{ pg_version }}/{{ pg_instance }}/pg_hba.conf"
    owner: "{{ pg_os_user }}"
    group: "{{ pg_os_group }}"
    mode: "0600"

- name: "Initializing Patroni authentication credentials"
  become: true
  become_user: "{{ pg_os_user }}"
  ansible.builtin.shell: |
    set -e
    data_dir="{{ pg_bind_dir }}/{{ pg_version }}/{{ pg_instance }}"
    pg_ctl="/usr/pgsql-{{ pg_version }}/bin/pg_ctl"
    psql="/usr/pgsql-{{ pg_version }}/bin/psql"
    superuser_password="{{ pg_patroni.postgresql.superuser_password }}"
    replication_password="{{ pg_patroni.postgresql.replication_password }}"
    "${pg_ctl}" -D "${data_dir}" -w start
    "${psql}" postgres -p "{{ pg_instance_record.1.configuration.port | default(pg_default_port) }}" \
      -v ON_ERROR_STOP=1 <<SQL
    ALTER ROLE postgres WITH LOGIN SUPERUSER PASSWORD '${superuser_password}';
    DO \$\$BEGIN
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'replicator') THEN
        CREATE ROLE replicator WITH LOGIN REPLICATION PASSWORD '${replication_password}';
      ELSE
        ALTER ROLE replicator WITH LOGIN REPLICATION PASSWORD '${replication_password}';
      END IF;
    END\$\$;
    SQL
    "${pg_ctl}" -D "${data_dir}" -w stop
  args:
    executable: /bin/bash
  changed_when: not postgres_data.stat.exists
  no_log: true
  when:
    - pg_cluster_provider == 'patroni'
    - not postgres_data.stat.exists
    - pg_patroni.postgresql is defined
    - pg_patroni.postgresql.superuser_password is defined
    - pg_patroni.postgresql.replication_password is defined

- name: "Removing locally initialized data before Patroni bootstrap"
  become: true
  ansible.builtin.file:
    path: "{{ pg_bind_dir }}/{{ pg_version }}/{{ pg_instance }}"
    state: absent
  when:
    - pg_cluster_provider == 'patroni'
    - pg_patroni_reinitialize | bool

- name: "Creating empty Patroni data directory"
  become: true
  ansible.builtin.file:
    path: "{{ pg_bind_dir }}/{{ pg_version }}/{{ pg_instance }}"
    state: directory
    owner: "{{ pg_os_user }}"
    group: "{{ pg_os_group }}"
    mode: "0700"
  when:
    - pg_cluster_provider == 'patroni'
    - pg_patroni_reinitialize | bool

###############################################################################
# ENSURING DEFAULT PG_IDENT.CONF IS DELETED AND NEW WRITTEN
###############################################################################

- name: "Removing old pg_ident.conf"
  ansible.builtin.file:
    path: "{{ pg_bind_dir }}/{{ pg_version }}/{{ pg_instance }}/pg_ident.conf"
    state: absent
  when: pg_maprole | length == 0

- name: "Ensure pg_ident.conf access rules are present"
  ansible.builtin.template:
    src: "pg_ident.conf.j2"
    dest: "{{ pg_bind_dir }}/{{ pg_version }}/{{ pg_instance }}/pg_ident.conf"
    owner: "{{ pg_os_user }}"
    group: "{{ pg_os_group }}"
    mode: "0600"
  when: pg_maprole | length > 0

###############################################################################
# ENSURING LOG DIRECTORY EXISTS
###############################################################################

- name: "Ensuring log directory exists"
  ansible.builtin.file:
    path: "{{ pg_log_directory }}/{{ pg_version }}/{{ pg_instance }}/"
    state: directory
    mode: "0700"
    owner: "{{ pg_os_user }}"
    group: "{{ pg_os_group }}"

###############################################################################
# ENSURING SYSTEMD SERVICE EXISTS
###############################################################################

- name: "Ensuring systemd service file matches template"
  ansible.builtin.template:
    src: "systemd-service-{{ pg_version }}.j2"
    dest: "{{ pg_systemd_service_dir }}/postgresql-{{ pg_version }}-{{ pg_instance }}.service"
    mode: "0644"
    owner: "root"
    group: "root"
  register: pg_systemd_service_template

- name: "Writing log"
  ansible.builtin.include_tasks: log_write.yml
  vars:
    iac_log_write: "Ensured {{ pg_systemd_service_dir }}/postgresql-{{ pg_version }}-{{ pg_instance }}.service"

- name: "Executing systemd daemon-reload" # noqa no-handler
  ansible.builtin.systemd:
    daemon_reload: true
  when: pg_systemd_service_template.changed

###############################################################################
# ENSURING EXTENSION PACKAGES ARE INSTALLED
###############################################################################

- name: "Looping through databases"
  ansible.builtin.include_tasks: "loop_databases.yml"
  when: pg_databases is defined
