---
###############################################################################
#
# present.yml
#
# @author Arsi Atomi
#
###############################################################################

###############################################################################
# SETTING VARIABLES
###############################################################################

- name: "Checking if required variables are defined"
  ansible.builtin.assert:
    that:
      - dnf_sslverify is defined
      - dnf_validate_certs is defined
      - dnf_disable_gpg_check is defined
      - http_proxy is defined
      - https_proxy is defined
      - no_proxy is defined
      - pg_lang is defined
      - pg_versions is defined
    fail_msg: "PostgreSQL present state is missing one or more required variables"

###############################################################################
# INSTALLING LANGUAGEPACKS IF NEEDED
###############################################################################

- name: "Ensuring langpack is installed"
  ansible.builtin.include_tasks: package_present.yml
  vars:
    pg_package: "glibc-langpack-{{ pg_lang }}"
  when: pg_lang is defined

- name: "Ensuring dnf plugins core is installed"
  ansible.builtin.include_tasks: package_present.yml
  vars:
    pg_package: "dnf-plugins-core"

- name: "Ensuring sudo is installed"
  ansible.builtin.include_tasks: package_present.yml
  vars:
    pg_package: "sudo"

- name: "Ensuring acl is installed"
  ansible.builtin.include_tasks: package_present.yml
  vars:
    pg_package: "acl"

- name: "Ensuring epel-release is installed"
  ansible.builtin.include_tasks: package_present.yml
  vars:
    pg_package: "epel-release"
  when:
    - ansible_facts["distribution"] in ['Rocky']
    - ansible_facts["distribution_major_version"] in ['8', '9', '10']

- name: "Ensuring openssl is installed"
  ansible.builtin.include_tasks: package_present.yml
  vars:
    pg_package: "openssl"

- name: "Ensuring sed is installed"
  ansible.builtin.include_tasks: package_present.yml
  vars:
    pg_package: "sed"

- name: "Ensuring cronie is installed when cron jobs are configured"
  ansible.builtin.include_tasks: package_present.yml
  vars:
    pg_package: "cronie"
  when: pg_versions | selectattr('cron', 'defined') | list | length > 0

- name: "Ensuring gpg2 is installed"
  ansible.builtin.include_tasks: package_present.yml
  vars:
    pg_package: "gnupg2"
  when: ansible_facts["distribution"] in ['RedHat', 'Rocky'] and ansible_facts["distribution_major_version"] == '10'

###############################################################################
# LOOPING THROUGH POSTGRESQL VERSIONS TO BE INSTALLED
###############################################################################

- name: "Setting PostgreSQL bind mount variables"
  ansible.builtin.set_fact:
    iac_fs_binds:
      - source: "{{ pg_real_dir }}"
        target: "{{ pg_bind_dir }}"
        mode: "0700"
        move_from_target: true
  when:
    - pg_real_dir is defined
    - pg_bind_dir is defined
    - pg_real_dir != pg_bind_dir

- name: "Clearing PostgreSQL bind mount variables when bind migration is disabled"
  ansible.builtin.set_fact:
    iac_fs_binds: []
  when:
    - pg_real_dir is defined
    - pg_bind_dir is defined
    - pg_real_dir == pg_bind_dir

- name: "Ensuring PostgreSQL bind mount configuration is present"
  ansible.builtin.include_tasks: bind_present.yml
  when:
    - iac_fs_binds is defined
    - (iac_fs_binds | default([])) | length > 0

- name: "Looping through versions"
  ansible.builtin.include_tasks: "version_present.yml"
  loop: "{{ pg_versions }}"
  loop_control:
    loop_var: pg_version_record

- name: "Ensuring PostgreSQL real directory ownership after bind migration"
  ansible.builtin.file:
    path: "{{ pg_real_dir }}"
    state: directory
    recurse: true
    owner: "{{ pg_os_user }}"
    group: "{{ pg_os_group }}"
  when:
    - pg_real_dir is defined
    - pg_bind_dir is defined
    - pg_real_dir != pg_bind_dir

- name: "Ensuring PostgreSQL real directory mode after bind migration"
  ansible.builtin.file:
    path: "{{ pg_real_dir }}"
    state: directory
    owner: "{{ pg_os_user }}"
    group: "{{ pg_os_group }}"
    mode: "0700"
  when:
    - pg_real_dir is defined
    - pg_bind_dir is defined
    - pg_real_dir != pg_bind_dir
