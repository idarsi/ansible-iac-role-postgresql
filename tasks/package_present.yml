---
###############################################################################
#
# package_present.yml
#
# @author Arsi Atomi
#
###############################################################################

###############################################################################
# SETTING VARIABLES
###############################################################################

- name: "Checking if required variables are defined"
  ansible.builtin.assert:
    that:
      - dnf_disable_gpg_check is defined
      - dnf_sslverify is defined
      - dnf_validate_certs is defined
      - http_proxy is defined
      - https_proxy is defined
      - no_proxy is defined
      - pg_package is defined
    fail_msg: "PostgreSQL package installation is missing one or more required variables"

- name: "Normalizing package list for installation"
  ansible.builtin.set_fact:
    pg_package_list: >-
      {{
        pg_package
        if (pg_package is sequence and pg_package is not string)
        else
        (
          pg_package.split(',')
          | map('trim')
          | reject('equalto', '')
          | list
        )
      }}

- name: "Gathering installed package facts before installation"
  ansible.builtin.package_facts:
    manager: "auto"

- name: "Recording packages already installed before role management"
  ansible.builtin.set_fact:
    pg_package_preexisting: >-
      {{ pg_package_list | select('in', ansible_facts.packages.keys() | list) | list }}

###############################################################################
# ENSURING PACKAGE IS PRESENT
###############################################################################

- name: "Ensuring packages are installed"
  ansible.builtin.command:
    argv: >-
      {{
        [
          'dnf',
          '-y',
          'install',
          '--setopt=sslverify=' ~ (1 if dnf_sslverify else 0),
          '--nogpgcheck' if dnf_disable_gpg_check else '--setopt=gpgcheck=1'
        ] + pg_package_list
      }}
  environment:
    http_proxy: "{{ http_proxy }}"
    https_proxy: "{{ https_proxy }}"
    no_proxy: "{{ no_proxy }}"
  register: pg_package_present_result
  retries: "{{ pg_repo_network_retries | default(1) }}"
  delay: "{{ pg_repo_network_delay | default(0) }}"
  until: pg_package_present_result is succeeded
  changed_when: false
  when:
    - pg_package is defined
    - ansible_facts["os_family"] == "RedHat"
    - ansible_facts["distribution_major_version"] == "8"

- name: "Ensuring packages are installed"
  ansible.builtin.dnf:
    name: "{{ pg_package_list }}"
    sslverify: "{{ dnf_sslverify }}"
    validate_certs: "{{ dnf_validate_certs }}"
    disable_gpg_check: "{{ dnf_disable_gpg_check }}"
    state: "present"
  vars:
    ansible_python_interpreter: "{{ pg_package_module_interpreter }}"
  environment:
    http_proxy: "{{ http_proxy }}"
    https_proxy: "{{ https_proxy }}"
    no_proxy: "{{ no_proxy }}"
  register: pg_package_present_result
  retries: "{{ pg_repo_network_retries | default(1) }}"
  delay: "{{ pg_repo_network_delay | default(0) }}"
  until: pg_package_present_result is succeeded
  when:
    - pg_package is defined
    - not
      (
        ansible_facts["os_family"] == "RedHat"
        and ansible_facts["distribution_major_version"] == "8"
      )

- name: "Recording packages newly installed by the role"
  ansible.builtin.set_fact:
    pg_newly_installed_packages: >-
      {{ pg_package_list
         | reject('in', pg_package_preexisting)
         | reject('search', '://')
         | list }}

- name: "Ensuring managed package marker directory exists"
  ansible.builtin.file:
    path: "{{ pg_managed_packages_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: pg_newly_installed_packages | length > 0

- name: "Recording packages newly installed by the role"
  ansible.builtin.lineinfile:
    path: "{{ pg_managed_packages_file }}"
    regexp: "^{{ item | regex_escape }}$"
    line: "{{ item }}"
    create: true
    owner: root
    group: root
    mode: "0640"
  loop: "{{ pg_newly_installed_packages }}"
  when: pg_newly_installed_packages | length > 0

- name: "Writing log"
  ansible.builtin.include_tasks: log_write.yml
  vars:
    iac_log_write: "Ensured {{ pg_package }} was installed"
  when: pg_package is defined
