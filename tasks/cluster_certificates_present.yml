---
- name: "Checking published cluster certificate preflight model"
  ansible.builtin.assert:
    that: pg_certificate_preflight_complete | default(false) | bool
    fail_msg: "Top-level certificate preflight must complete before cluster certificate convergence"

- name: "PREFLIGHT COMPLETE - converge cluster certificates"
  ansible.builtin.include_tasks: cluster_certificates_converge.yml
