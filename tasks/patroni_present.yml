---
###############################################################################
#
# patroni_present.yml
#
###############################################################################

- name: "Selecting local Patroni cluster member"
  ansible.builtin.set_fact:
    pg_patroni_member: >-
      {{
        pg_cluster.members
        | selectattr('host', 'equalto', inventory_hostname)
        | selectattr('instance', 'equalto', pg_instance)
        | list | first
        }}

# Certificate settings are normalized before the convergence boundary.  The
# endpoint records themselves are owned by inventory preflight; convergence
# only publishes a non-authoritative lookup projection of those records.
- name: "Normalizing Patroni certificate settings before convergence"
  ansible.builtin.include_tasks: cluster_certificates_normalize.yml

- name: "Publishing preflight-owned Patroni endpoint projection before convergence"
  ansible.builtin.set_fact:
    pg_patroni_endpoint_projection: "{{ pg_preflight_patroni_endpoint_models }}"
    pg_patroni_endpoint_projection_by_key: "{{ pg_preflight_patroni_endpoint_models_by_key }}"

- name: "Checking provenance of the Patroni endpoint projection before convergence"
  ansible.builtin.assert:
    that:
      - pg_patroni_endpoint_projection == pg_preflight_patroni_endpoint_models
      - pg_patroni_endpoint_projection_by_key == pg_preflight_patroni_endpoint_models_by_key
    fail_msg: "Patroni endpoint projection must remain an exact preflight-owned view"

- name: "Rejecting Patroni inventory and member identity mismatch"
  ansible.builtin.assert:
    that:
      - pg_patroni_member is defined
      - pg_patroni_member is mapping
      - pg_patroni_member.name is defined
    fail_msg: >-
      Patroni member identity mismatch: inventory host {{ inventory_hostname }}
      and PostgreSQL instance {{ pg_instance }} are not declared together in
      cluster {{ pg_cluster.name }}. Declare a member with matching host and
      instance before managing Patroni.

- name: "Selecting the canonical Patroni REST endpoint model"
  ansible.builtin.set_fact:
    pg_patroni_restapi_canonical_endpoint_models: >-
      {{ pg_patroni_endpoint_projection
         | selectattr('key', 'equalto', pg_patroni_endpoint_model_key) | list }}
  vars:
    pg_patroni_endpoint_model_key: >-
      {{ pg_version | string }}:{{ pg_cluster.name }}:{{ pg_patroni_member.host }}:{{ pg_patroni_member.instance }}

- name: "Rejecting missing or duplicate canonical Patroni REST endpoint model"
  ansible.builtin.assert:
    that:
      - pg_patroni_restapi_canonical_endpoint_models | length == 1
    fail_msg: >-
      Exactly one canonical Patroni REST endpoint model must exist for
      {{ pg_patroni_endpoint_model_key }}
  vars:
    pg_patroni_endpoint_model_key: >-
      {{ pg_version | string }}:{{ pg_cluster.name }}:{{ pg_patroni_member.host }}:{{ pg_patroni_member.instance }}

- name: "Publishing the canonical Patroni REST endpoint model"
  ansible.builtin.set_fact:
    pg_patroni_restapi_canonical_endpoint_model: "{{ pg_patroni_restapi_canonical_endpoint_models[0] }}"
    pg_patroni_restapi_endpoint_model: "{{ pg_patroni_restapi_canonical_endpoint_models[0] }}"
    pg_patroni_restapi_connect_model: "{{ pg_patroni_restapi_canonical_endpoint_models[0] }}"

- name: "Constructing PostgreSQL advertised default"
  ansible.builtin.include_tasks: host_port.yml
  vars:
    pg_host_port_host: "{{ inventory_hostname }}"
    pg_host_port_port: "{{ pg_instance_record.1.configuration.port | default(pg_default_port) }}"
    pg_host_port_result_fact: "pg_patroni_default_postgresql_connect_endpoint"
  when: (pg_cluster.patroni.postgresql | default({})).connect_address is not defined

- name: "Setting Patroni local configuration"
  ansible.builtin.set_fact:
    pg_patroni: "{{ pg_cluster.patroni | default({}) }}"
    pg_patroni_restapi_tls_enabled: >-
      {{ (pg_cluster.patroni.restapi | default({})).enabled | default(false) | bool
         or (pg_cluster.patroni.restapi | default({})).auto_generate | default(false) | bool
         or (pg_cluster.patroni.restapi | default({})).cafile is defined
         or (pg_cluster.patroni.restapi | default({})).certfile is defined
         or (pg_cluster.patroni.restapi | default({})).keyfile is defined }}
    pg_patroni_name: "{{ pg_patroni_member.name }}"
    pg_patroni_restapi_port_effective: "{{ (pg_cluster.patroni.restapi | default({})).port | default(pg_patroni_restapi_port) }}"
    pg_patroni_restapi_listen_effective: "{{ pg_patroni_restapi_canonical_endpoint_model.rendered_listener }}"
    pg_patroni_restapi_connect_address_effective: "{{ pg_patroni_restapi_canonical_endpoint_model.advertised_connect }}"
    pg_patroni_postgresql_connect_address_effective: >-
      {{ (pg_cluster.patroni.postgresql | default({})).connect_address
         | default(
              pg_patroni_default_postgresql_connect_endpoint
           ) }}
    pg_patroni_config_path: "{{ pg_patroni_config_directory }}/{{ pg_version }}-{{ pg_instance }}.yml"
    pg_patroni_service_path: "{{ pg_systemd_service_dir }}/patroni-{{ pg_version }}-{{ pg_instance }}.service"

- name: "Publishing normalized Patroni DCS endpoint model"
  ansible.builtin.set_fact:
    pg_cluster_dcs_model: "{{ pg_dcs_models_by_cluster[pg_dcs_model_key] }}"
    pg_patroni_dcs_endpoint_model: "{{ pg_dcs_models_by_cluster[pg_dcs_model_key].servers }}"
    pg_patroni_dcs_proxy_model: "{{ pg_dcs_models_by_cluster[pg_dcs_model_key].proxy }}"
    pg_patroni_dcs_endpoints_normalized: >-
      {{ pg_dcs_models_by_cluster[pg_dcs_model_key].servers
         | map(attribute='rendered_endpoint') | list }}
    pg_patroni_service_name: "patroni-{{ pg_version }}-{{ pg_instance }}.service"
  vars:
    pg_dcs_model_key: "{{ pg_version }}:{{ pg_cluster.name }}"

- name: "Selecting Patroni packages"
  ansible.builtin.set_fact:
    # Patroni and enabled DCS packages are production role contract.  Generic
    # certificate inspection tools are deliberately supplied by the top-level
    # bootstrap/preflight path, not by this Patroni-specific package list.
    pg_patroni_packages: >-
      {{
        (
          [pg_patroni_package]
          + (
            [pg_patroni_etcd_package]
            if (pg_cluster.dcs.provider | default('')) == 'etcd3'
            and (pg_cluster.dcs.etcd | default({})).enabled | default(false) | bool
            else []
          )
          + pg_patroni_additional_packages
        ) | unique
      }}

- name: "Selecting Patroni Python DCS dependencies"
  ansible.builtin.set_fact:
    pg_patroni_python_packages_effective: "{{ pg_patroni_python_packages | default([]) | list }}"

- name: "Ensuring Patroni prerequisites exist before certificate generation"
  ansible.builtin.include_tasks: patroni_prerequisites_present.yml

- name: "Ensuring Patroni and etcd certificates are present"
  ansible.builtin.include_tasks: cluster_certificates_present.yml

- name: "Refreshing Patroni settings after certificate path normalization"
  ansible.builtin.set_fact:
    pg_patroni: >-
      {{ pg_cluster.patroni | default({})
         | combine({'restapi': pg_cluster_patroni_restapi_effective}, recursive=true) }}

- name: "Refreshing normalized Patroni REST API TLS model"
  ansible.builtin.set_fact:
    pg_patroni_restapi_endpoint_model: >-
      {{ pg_patroni_restapi_endpoint_model | combine({
           'cafile': pg_cluster_patroni_restapi_effective.cafile,
           'certfile': pg_cluster_patroni_restapi_effective.certfile,
           'keyfile': pg_cluster_patroni_restapi_effective.keyfile
         }) }}
  when: pg_patroni_restapi_tls_enabled | bool

- name: "Checking the canonical per-instance Patroni REST endpoint model"
  ansible.builtin.assert:
    that:
      - pg_patroni_restapi_canonical_endpoint_model is mapping
      - pg_patroni_restapi_canonical_endpoint_model.key == pg_patroni_endpoint_model_key
      - pg_patroni_restapi_canonical_endpoint_model.rendered_listener is string
      - pg_patroni_restapi_canonical_endpoint_model.rendered_listener is not search('^https?://')
      - pg_patroni_restapi_canonical_endpoint_model.uri is match('^https?://')
      - pg_patroni_restapi_canonical_endpoint_model.member == pg_patroni_member.host
      - pg_patroni_restapi_canonical_endpoint_model.instance == pg_patroni_member.instance
      - pg_patroni_restapi_canonical_endpoint_model.uri == pg_patroni_restapi_canonical_endpoint_model.advertised_connect
      - pg_patroni_restapi_canonical_endpoint_model.uri == pg_patroni_restapi_canonical_endpoint_model.connect
      - pg_patroni_restapi_connect_model.uri == pg_patroni_restapi_canonical_endpoint_model.advertised_connect
    fail_msg: "Patroni REST endpoint model is not canonical for this version, cluster, and member"
  vars:
    pg_patroni_endpoint_model_key: >-
      {{ pg_version | string }}:{{ pg_cluster.name }}:{{ pg_patroni_member.host }}:{{ pg_patroni_member.instance }}

- name: "Checking normalized Patroni REST API TLS model"
  ansible.builtin.assert:
    that:
      - not (pg_patroni_restapi_tls_enabled | bool)
        or pg_patroni_restapi_endpoint_model.cafile is defined
      - not (pg_patroni_restapi_tls_enabled | bool)
        or pg_patroni_restapi_endpoint_model.certfile is defined
      - not (pg_patroni_restapi_tls_enabled | bool)
        or pg_patroni_restapi_endpoint_model.keyfile is defined
    fail_msg: "Normalized Patroni REST API TLS model must define cafile, certfile, and keyfile"

- name: "Ensuring managed etcd member is present"
  ansible.builtin.include_tasks: etcd_present.yml
  when:
    - (pg_cluster.dcs.etcd | default({})).enabled | default(false) | bool

- name: "Checking whether Python pip is available for Patroni dependencies"
  ansible.builtin.command:
    argv:
      - "{{ pg_patroni_python_interpreter }}"
      - -m
      - pip
      - --version
  register: pg_patroni_pip_check
  changed_when: false
  failed_when: false
  when:
    - pg_patroni_python_packages_effective | length > 0

- name: "Ensuring Python pip is available for Patroni dependencies"
  ansible.builtin.command:
    argv:
      - "{{ pg_patroni_python_interpreter }}"
      - -m
      - ensurepip
      - --upgrade
  when:
    - pg_patroni_python_packages_effective | length > 0
    - pg_patroni_pip_check.rc != 0
  changed_when: true

- name: "Checking Patroni Python dependency packages"
  ansible.builtin.command:
    argv:
      - "{{ pg_patroni_python_interpreter }}"
      - -m
      - pip
      - show
      - "{{ item }}"
  loop: "{{ pg_patroni_python_packages_effective }}"
  register: pg_patroni_python_package_checks
  changed_when: false
  failed_when: false
  when:
    - pg_patroni_python_packages_effective | length > 0

- name: "Ensuring Patroni Python dependency packages are installed"
  ansible.builtin.command:
    argv:
      - "{{ pg_patroni_python_interpreter }}"
      - -m
      - pip
      - install
      - --disable-pip-version-check
      - --no-cache-dir
      - "{{ item.item }}"
  loop: "{{ pg_patroni_python_package_checks.results | default([]) }}"
  when:
    - pg_patroni_python_packages_effective | length > 0
    - item.rc != 0
  changed_when: true

- name: "Checking Patroni configuration directory before rendering"
  ansible.builtin.stat:
    path: "{{ pg_patroni_config_directory }}"
    follow: false
  register: pg_patroni_config_directory_stat

- name: "Rejecting symlinked Patroni configuration directory"
  ansible.builtin.assert:
    that:
      - not pg_patroni_config_directory_stat.stat.exists
        or (pg_patroni_config_directory_stat.stat.isdir
        and not (pg_patroni_config_directory_stat.stat.islnk | default(false)))
    fail_msg: "Patroni configuration directory must be a non-symlink directory"

- name: "Ensuring Patroni configuration directory exists"
  ansible.builtin.file:
    path: "{{ pg_patroni_config_directory }}"
    state: directory
    owner: root
    group: "{{ pg_patroni_group }}"
    mode: "0750"
  become: true
  become_user: "root"

- name: "Rejecting unsupported Patroni REST API required client verification before rendering"
  ansible.builtin.assert:
    that:
      - pg_patroni.restapi.verify_client | default('none') != 'required'
    fail_msg: >-
      Patroni REST API verify_client: required is not supported. Use
      verify_client: optional or none, or provide a future role version that
      manages dedicated client certificate, key, and CA trust material and
      configures Patroni tooling to use it.

- name: "Rendering Patroni configuration"
  ansible.builtin.template:
    src: patroni.yml.j2
    dest: "{{ pg_patroni_config_path }}"
    owner: "root"
    group: "{{ pg_patroni_group }}"
    mode: "0640"
  no_log: true

- name: "Reading rendered Patroni configuration for endpoint verification"
  ansible.builtin.slurp:
    src: "{{ pg_patroni_config_path }}"
  register: pg_patroni_rendered_config
  no_log: true
  when: not (ansible_check_mode | bool)

- name: "Parsing rendered Patroni configuration for endpoint verification"
  ansible.builtin.set_fact:
    pg_patroni_rendered_config_data: >-
      {{ pg_patroni_rendered_config.content | b64decode | from_yaml }}
  no_log: true
  when: not (ansible_check_mode | bool)

- name: "Checking rendered Patroni advertised endpoint is canonical"
  ansible.builtin.assert:
    that:
      - pg_patroni_rendered_config_data is mapping
      - pg_patroni_rendered_config_data.restapi is mapping
       - pg_patroni_rendered_config_data.restapi.connect_address
         == pg_patroni_restapi_canonical_endpoint_model.advertised_connect
       - pg_patroni_rendered_config_data.restapi.listen
         == pg_patroni_restapi_canonical_endpoint_model.rendered_listener
    fail_msg: >-
      Rendered Patroni restapi.connect_address must equal the canonical
      per-instance advertised endpoint model
  no_log: true
  when: not (ansible_check_mode | bool)

- name: "Ensuring systemd service directory exists"
  ansible.builtin.file:
    path: "{{ pg_systemd_service_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  become_user: "root"

- name: "Rendering Patroni systemd service"
  ansible.builtin.template:
    src: patroni.service.j2
    dest: "{{ pg_patroni_service_path }}"
    owner: "root"
    group: "root"
    mode: "0644"
  register: pg_patroni_service_template

- name: "Reloading systemd after Patroni service changes" # noqa no-handler
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - pg_patroni_service_template.changed

- name: "Selecting existing Patroni and managed etcd paths for SELinux relabeling"
  ansible.builtin.set_fact:
    pg_patroni_restorecon_paths: >-
      {{ [pg_patroni_config_directory, pg_patroni_config_path]
         + (pg_cluster_patroni_pki_destinations | default([])
            + (pg_cluster_patroni_pki_destinations | default([]) | map('dirname') | list))
         + ([pg_etcd_config_directory, pg_etcd_config_file, pg_etcd_data_directory]
            + (pg_cluster_etcd_pki_destinations | default([])
               + (pg_cluster_etcd_pki_destinations | default([]) | map('dirname') | list))
            if (pg_cluster.dcs.etcd | default({})).enabled | default(false) | bool else [])
         | unique | list }}

- name: "Checking paths before SELinux relabeling"
  ansible.builtin.stat:
    path: "{{ pg_restorecon_path }}"
    follow: false
  loop: "{{ pg_patroni_restorecon_paths }}"
  loop_control:
    loop_var: pg_restorecon_path
  register: pg_patroni_restorecon_stats
  when:
    - pg_cluster_pki_generation_enabled | default(false) | bool

- name: "Restoring SELinux contexts for Patroni and managed etcd paths"
  ansible.builtin.command:
    argv:
      - restorecon
      - -Rv
      - "{{ pg_patroni_restorecon_result.item }}"
  loop: "{{ pg_patroni_restorecon_stats.results }}"
  loop_control:
    loop_var: pg_patroni_restorecon_result
    label: "{{ pg_patroni_restorecon_result.item }}"
  when:
    - pg_cluster_pki_generation_enabled | default(false) | bool
    - pg_patroni_restorecon_result.stat.exists
    - (pg_cluster_selinux_tool_checks.results | default([]) | first | default({})).stdout | default('') | trim in ["Enforcing", "Permissive"]
  changed_when: >-
    (pg_patroni_restorecon_command.stdout | default("") | trim) != ""
    or (pg_patroni_restorecon_command.stderr | default("") | trim) != ""
  register: pg_patroni_restorecon_command
