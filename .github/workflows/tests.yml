name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

# Serialize static checks without automatically cancelling older workflow versions.
concurrency:
  group: postgresql-role-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static:
    name: Static contracts (Ansible Core 2.20.8)
    runs-on: ubuntu-latest
    env:
      ANSIBLE_COLLECTIONS_PATH: "${{ runner.temp }}/postgresql-static-collections"
      ANSIBLE_COLLECTIONS_SCAN_SYS_PATH: "false"
    steps:
      - name: Check out role and recorded shared tasks
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install isolated CI static tools
        run: python -m pip install -r requirements-ci.txt "ansible-core==2.20.8"
      - name: Install and verify pinned static-check collections
        id: static-collections
        run: |
          set -euo pipefail
          install -d -m 0700 "$ANSIBLE_COLLECTIONS_PATH"
          ansible-galaxy collection install -r tests/collections.yml -p "$ANSIBLE_COLLECTIONS_PATH"
          PYTHONPATH=tests python - <<'PY'
          import os
          from pathlib import Path
          from dependency import required_collections, verify_private_collection

          destination = Path(os.environ["ANSIBLE_COLLECTIONS_PATH"])
          for record in required_collections(Path("tests/collections.yml")):
              verify_private_collection(destination, record["name"], record["version"])
          PY
      - name: Run focused contract tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check whitespace
        run: git diff --check
      - name: Run production-profile lint
        env:
          ANSIBLE_ROLES_PATH: ..
        run: ansible-lint --profile production
      - name: Check documented playbook syntax
        env:
          ANSIBLE_ROLES_PATH: ..
        run: ansible-playbook --syntax-check -i docs/inventory-example.yml docs/playbook-example.yml
