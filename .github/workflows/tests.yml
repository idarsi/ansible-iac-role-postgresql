          base_ref='docker.io/rockylinux/rockylinux:9-ubi-init@sha256:b33dfee97df5b631945b9b04ffc2f4deb28862db927c86cb0afb94ef9861dfb5'
          podman pull --quiet --platform linux/amd64 "${base_ref}"
