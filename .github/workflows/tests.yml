      - name: Resolve trusted controller Python
        if: matrix.scenario == 'replication'
        run: |
           set -euo pipefail
           . scripts/replication_runtime.sh
           export REPLICATION_PYTHON_COMMAND="${pythonLocation}/bin/python"
           replication_runtime_activate python
           printf 'REPLICATION_PYTHON_COMMAND=%s\n' "${REPLICATION_PYTHON_COMMAND}" >> "${GITHUB_ENV}"

      - name: Install Molecule and Ansible
        run: |
           if [ "${{ matrix.scenario }}" = replication ]; then
