name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: postgresql-role-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Ansible Lint
        run: python -m pip install -r requirements-ci.txt

      - name: Run production-profile Ansible Lint
        env:
          ANSIBLE_ROLES_PATH: ..
        run: ansible-lint --profile production

  molecule-fast:
    name: Molecule fast (${{ matrix.scenario }})
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - default
          - validation
          - rocky8
          - rhel9
          - rocky10
          - fedora43
          - replication
          - all_absent
          - bind_guardrails
          - hba_guardrails
          - patroni_config

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Configure Podman storage for GitHub runner
        run: |
          mkdir -p "$HOME/.config/containers"
          printf '%s\n' '[storage]' 'driver = "vfs"' > "$HOME/.config/containers/storage.conf"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Molecule and Ansible
        run: python -m pip install -r requirements-ci.txt

      - name: Run Molecule scenario
        env:
          ANSIBLE_ROLES_PATH: ..
        run: molecule test -s "${{ matrix.scenario }}"

  molecule-daily:
    name: Molecule daily (${{ matrix.scenario }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - default
          - validation
          - all_absent
          - bind_guardrails
          - hba_guardrails
          - replication
          - timescaledb
          - patroni_config
          - patroni_membership
          - patroni_failover
          - etcd_server
          - etcd_tls
          - etcd_tls_cluster
          - etcd_el_matrix
          - rocky8
          - rhel8
          - rhel9
          - rocky10
          - rhel10
          - fedora43
          - fedora44

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Configure Podman storage for GitHub runner
        run: |
          mkdir -p "$HOME/.config/containers"
          printf '%s\n' '[storage]' 'driver = "vfs"' > "$HOME/.config/containers/storage.conf"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Molecule and Ansible
        run: python -m pip install -r requirements-ci.txt

      - name: Run Molecule scenario
        env:
          ANSIBLE_ROLES_PATH: ..
        run: molecule test -s "${{ matrix.scenario }}"
