name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

# Do not cancel a supervisor during authoritative cleanup.
concurrency:
  group: postgresql-role-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static:
    name: Static contracts (Ansible Core 2.20.8)
    runs-on: ubuntu-latest
    steps:
      - name: Check out role and recorded shared tasks
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install isolated CI static tools
        run: python -m pip install -r requirements-ci.txt "ansible-core==2.20.8"
      - name: Run focused contract tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check whitespace
        run: git diff --check
      - name: Run production-profile lint
        env:
          ANSIBLE_ROLES_PATH: ..
        run: ansible-lint --profile production
      - name: Check documented playbook syntax
        env:
          ANSIBLE_ROLES_PATH: ..
        run: ansible-playbook --syntax-check -i docs/inventory-example.yml docs/playbook-example.yml

  managed:
    name: Managed whole scenarios (${{ matrix.lane }})
    # This label is an operator-provisioned capability, not hosted Ubuntu.
    # Repository code must not mutate shared host/controller configuration.
    runs-on: [self-hosted, linux, idarsi-ansible-managed-kvm]
    environment: idarsi-managed-tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        lane: ["ansible-current", "ansible-next"]
    continue-on-error: ${{ matrix.lane == 'ansible-next' }}
    steps:
      - name: Check out role and recorded shared tasks
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          path: ansible-iac-role-postgresql
      - name: Validate existing prepared controller and exact helper pin
        working-directory: ansible-iac-role-postgresql
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          : "${IDARSI_TEST_ENVIRONMENT:?Prepared canonical helper checkout required}"
          expected="$(cat tests/helper-revision.txt)"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Reviewed guest-control helper commit is not yet pinned" >&2; exit 1;
          }
          test "$(git -C "$IDARSI_TEST_ENVIRONMENT" rev-parse HEAD)" = "$expected"
          test -z "$(git -C "$IDARSI_TEST_ENVIRONMENT" status --porcelain)"
          test -x "$IDARSI_TEST_ENVIRONMENT/.venv/$LANE/bin/molecule"
          podman info --format json >/dev/null
          virsh --connect qemu:///system list --all --uuid >/dev/null
      - name: Run selected complete scenarios under the native supervisor
        working-directory: ansible-iac-role-postgresql
        env:
          LANE: ${{ matrix.lane }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          source "$IDARSI_TEST_ENVIRONMENT/.venv/$LANE/bin/activate"
          export ANSIBLE_ROLES_PATH="$PWD/.."
          if [[ "$EVENT" == schedule || "$EVENT" == workflow_dispatch ]]; then
            mapfile -t scenarios < <(python -c 'import json; print("\n".join(json.load(open("role-test.json"))["scenarios"]))')
          else
            scenarios=(podman-validation kvm-full kvm-patroni-unknown-service kvm-baseline)
          fi
          for scenario in "${scenarios[@]}"; do
            backend=kvm
            [[ "$scenario" != podman-validation ]] || backend=podman
            "$IDARSI_TEST_ENVIRONMENT/scripts/test-run" run \
              --backend "$backend" --scenario "$scenario" "$PWD"
          done
